<style id="sg-page">
/* the app's own stylesheet is injected before this block (see the script): the page shows the real tokens and components.
   This block styles only the guide itself, with the v2 roles. */
html{height:auto!important;overflow:auto!important}
body{display:block!important;height:auto!important;overflow:auto!important;background:var(--bg);color:var(--label)}
.sg{max-width:760px;margin:0 auto;padding:var(--sp-6) var(--gutter) var(--sp-10)}
.sg h1{margin:var(--sp-2) 0 var(--sp-2)}
.sg .eyebrow{font-size:var(--fs-fn);font-weight:600;color:var(--tint)}
.sg .lead{color:var(--label-2);font-size:var(--fs-body);line-height:1.5;margin:0 0 var(--sp-4);max-width:65ch}
.sg .bar2{position:sticky;top:0;z-index:5;background:var(--material);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  margin:0 calc(var(--gutter) * -1);padding:var(--sp-2) var(--gutter);display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center;border-bottom:var(--hair) solid var(--separator)}
.sg .bar2 button{min-height:36px}
.sg .toc{display:flex;flex-wrap:wrap;gap:var(--sp-1) var(--sp-4);margin:var(--sp-4) 0 0;padding:0;list-style:none;font-size:var(--fs-fn)}
.sg .toc a{color:var(--tint);text-decoration:none;font-weight:600}
.sg section{margin-top:var(--sp-10);scroll-margin-top:64px}
.sg section>h2{font-size:var(--fs-t1);line-height:var(--lh-t1);font-weight:700;letter-spacing:-.01em;margin:0}
.sg .why{color:var(--label-2);font-size:var(--fs-sub);line-height:1.5;margin:var(--sp-2) 0 var(--sp-4);max-width:65ch}
.sg section>h3{font-size:var(--fs-t3);line-height:var(--lh-t3);font-weight:600;margin:var(--sp-8) 0 var(--sp-1);display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.sg .label{font-size:var(--fs-fn);color:var(--label-2);margin:var(--sp-4) 0 var(--sp-2);font-weight:600}
.sg code{font:500 .86em/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--fill-3);border-radius:5px;padding:1px 5px;color:var(--label)}
.sg .row{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center}
.sg .gridc{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.sg .nested{margin:0 calc(var(--gutter) * -1)}
.sg .stage{display:inline-flex;align-items:center;height:22px;padding:0 var(--sp-2);border-radius:var(--r-pill);background:var(--fill-2);color:var(--label-2);font-size:var(--fs-c1);font-weight:600;line-height:1}
.sg .stage.done{background:var(--green-bg);color:var(--green)}
.sg .box{background:var(--bg-elevated);border-radius:var(--r-lg);overflow:hidden}
.sg .pr{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:var(--sp-5) var(--sp-6)}
.sg .pr div{display:flex;flex-direction:column;gap:var(--sp-1)}
.sg .pr b{font-weight:600;font-size:var(--fs-body)}
.sg .pr span{color:var(--label-2);font-size:var(--fs-sub);line-height:1.5}
/* swatches */
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:var(--sp-2)}
.sw div{display:flex;gap:var(--sp-3);align-items:center;background:var(--bg-elevated);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);min-width:0}
.sw i{flex:none;width:36px;height:36px;border-radius:var(--r-sm);box-shadow:inset 0 0 0 1px var(--separator)}
.sw span{display:flex;flex-direction:column;min-width:0;font-size:var(--fs-c1);line-height:var(--lh-c1);color:var(--label-2)}
.sw span code{background:none;padding:0;font-size:var(--fs-c1);color:var(--label)}
.sw span small{font-size:var(--fs-c2);color:var(--label-3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
/* type, space, radii, depth */
.ty div{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--sp-1) var(--sp-4);align-items:baseline;padding:var(--sp-3) var(--sp-4)}
.ty div+div::before{content:"";position:absolute;top:0;left:var(--sp-4);right:0;border-top:var(--hair) solid var(--separator)}
.ty .spec{font-size:var(--fs-c1);color:var(--label-2);text-align:right;white-space:nowrap}
.ty .spec b{display:block;color:var(--label);font-weight:600}
.ty .smp{min-width:0;overflow-wrap:anywhere}
.sp div{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-2);font-size:var(--fs-fn);color:var(--label-2)}
.sp i{display:block;height:10px;background:var(--tint);border-radius:3px;max-width:100%}
.rd{display:flex;gap:var(--sp-3);flex-wrap:wrap}
.rd div{width:76px;height:64px;background:var(--tint-bg);display:flex;align-items:flex-end;padding:var(--sp-2);font-size:var(--fs-c2);font-weight:600;color:var(--tint)}
.tapd{display:flex;align-items:center;gap:var(--sp-4);font-size:var(--fs-fn);color:var(--label-2)}
.tapd i{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px dashed var(--tint);display:grid;place-items:center}
.tapd i::after{content:"";width:30px;height:30px;border-radius:50%;background:var(--fill)}
.depth{position:relative;background:var(--bg);border-radius:var(--r-lg);padding:var(--sp-4);box-shadow:inset 0 0 0 1px var(--separator);min-height:210px;overflow:hidden;font-size:var(--fs-c1);color:var(--label-2)}
.depth .l1{background:var(--bg-elevated);border-radius:var(--r-md);padding:var(--sp-3);width:68%;margin-top:var(--sp-2)}
.depth .l2{position:absolute;right:var(--sp-4);bottom:-12px;width:52%;background:var(--bg);border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--elev-2);padding:var(--sp-4) var(--sp-3) var(--sp-6)}
.depth .l2::before{content:"";display:block;width:32px;height:4px;border-radius:2px;background:var(--label-4);margin:-8px auto var(--sp-3)}
/* icons */
.icg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:var(--sp-2)}
.icg div{display:flex;flex-direction:column;align-items:center;gap:var(--sp-1);padding:var(--sp-4) var(--sp-1) var(--sp-3);background:var(--bg-elevated);border-radius:var(--r-md);font-size:var(--fs-c2);color:var(--label-2);text-align:center;min-width:0}
.icg .sym{font-size:26px;color:var(--label);margin-bottom:var(--sp-1)}
.icg code{background:none;padding:0;font-size:var(--fs-c2);color:var(--label-3)}
.sq{width:30px;height:30px;border-radius:var(--r-icon);display:grid;place-items:center;color:#fff;font-size:18px}
.sq .sym{stroke-width:2}
/* motion and the migration table */
.mo{display:grid;gap:var(--sp-2);font-size:var(--fs-sub)}
.mo div{display:flex;gap:var(--sp-3);align-items:baseline}
.mo code{flex:none}
.tblw{overflow-x:auto;background:var(--bg-elevated);border-radius:var(--r-lg)}
table.map{width:100%;border-collapse:collapse;font-size:var(--fs-fn);line-height:var(--lh-fn);min-width:560px}
.map th,.map td{text-align:left;vertical-align:top;padding:var(--sp-3) var(--sp-4);border-bottom:var(--hair) solid var(--separator)}
.map tr:last-child td{border-bottom:0}
.map th{font-weight:600;color:var(--label-2)}
.map td:first-child{font-weight:600}
.map td:last-child{white-space:nowrap}
</style>
</head>

    book:'Урок',cards:'Карточки',checklist:'Тест',calendar:'Вопрос дня',trophy:'Экзамен',medal:'Награды',flame:'Горячий',snow:'Холодный',clock:'Время',pin:'Филиал',bell:'Изменения',gift:'Подарок',percent:'Скидка',salad:'Салат',thermo:'Хранение',info:'Заметка',alert:'Внимание',refresh:'Повторить',check:'Готово',gear:'Настройки'};
  const MAP=[['Навигация','header, .brand, .search, .langbtn, .themebtn','Большой заголовок экрана, серое поле поиска, AZ и тема — иконки справа',2],['Таббар','nav.tabs','Полупрозрачный, линейные иконки вместо эмодзи',2],

  const html=`
  <p class="eyebrow">Sensum &amp; Bakery · дизайн-система v2</p>
  <h1 class="t-large">Дизайн-система</h1>
  <p class="lead">Живой справочник: цвета, шрифты и компоненты ниже берутся прямо из <code>index.html</code>, поэтому всегда совпадают с приложением. Основы уже по системе v2. Компоненты пока прежние, у каждого указан этап, на котором его заменят. Как всё будет выглядеть в итоге — в <a class="lnk" style="display:inline;min-height:0;padding:0" href="design/concept.html">макете</a>.</p>

  <section id="s-pr"><h2>Принципы</h2><p class="why">Шесть правил. Если не знаешь, как оформить новый экран, сверяйся с ними.</p>
    <div class="pr">

      <div><b>Глубина — фоном</b><span>Экран чуть темнее, блоки на нём белые. Тень есть только у фото и у листа поверх экрана.</span></div>
      <div><b>Один акцент</b><span>Карамельный <code>--tint</code> значит одно: «можно нажать» или «выбрано».</span></div>

      <div><b>Одинаковое — одинаково</b><span>Одна строка списка, одна кнопка, один бейдж на всё приложение. Новый компонент — только если старые не подходят.</span></div>
      <div><b>Для каждого</b><span>Контраст AA (4,5 : 1) в обеих темах, касание от 44 pt, весь текст растёт с настройкой размера.</span></div>
    </div></section>

  <section id="s-color"><h2>Цвет</h2><p class="why">Цвета называются по роли, а не по оттенку. Компонент берёт <code>var(--label-2)</code>, и в тёмной теме роль сама получает своё значение. Значения ниже — для темы, включённой сейчас. Новый CSS берёт только роли.</p>
    <div id="sw"></div>
</section>

  <section id="s-type"><h2>Типографика</h2><p class="why">Системный шрифт (SF Pro на iPhone) и одиннадцать стилей текста iOS. У стиля свой размер, межстрочный интервал и насыщенность: пишем класс <code>.t-headline</code>, а не «17 px, жирный». Все стили растут вместе с настройкой размера текста (<code>--ts</code>). Растут и кнопка «назад», ссылки, счёт результата, номера шагов. Фиксированы только бренд, таббар, кнопки шапки и знаки в квадратах и кружках: их список — <code>FIXED_FS</code> в <code>tools/audit.py</code>, аудит предупреждает о любом другом размере в px. Поля ввода — не меньше 16 px, иначе iOS приближает экран.</p>
    <div class="box ty">${TY.map(([c,n,s,t,u])=>`<div><span class="smp"><span class="${c}" style="display:block">${t}</span><span class="t-c1" style="color:var(--label-2)">${u}</span></span><span class="spec"><b>${n}</b>${s}<br><code>.${c}</code></span></div>`).join('')}</div></section>

  <section id="s-layout"><h2>Сетка, форма, глубина</h2><p class="why">Сетка 4 pt: <code>--sp-1…--sp-10</code>. Левый и правый край каждого экрана — <code>--gutter</code> (16). Скругления вложены: у элемента внутри радиус меньше, чем у того, в котором он лежит.</p>
    <div class="sp">${[[1,4],[2,8],[3,12],[4,16],[5,20],[6,24],[8,32],[10,40]].map(([k,v])=>`<div><code>--sp-${k} · ${v}</code><i style="width:calc(var(--sp-${k}) * 4)"></i></div>`).join('')}</div>
    <div class="label">Скругления</div>
    <div class="rd">${[['icon',8],['seg-in',7],['seg',9],['sm',10],['md',12],['lg',16],['xl',20],['pill',999]].map(([k,v])=>`<div style="border-radius:var(--r-${k})">${k} · ${v}</div>`).join('')}</div>
    <p class="why" style="margin-top:var(--sp-3)">icon — квадрат иконки в строке · seg / seg-in — дорожка и бегунок сегментов · sm — поле · md — кнопка, вариант ответа · lg — группа, карточка, фото · xl — лист · pill — бейдж, чип.</p>
    <div class="label">Зона касания <code>--tap</code> 44</div>
    <div class="tapd"><i></i><span>Маленькая кнопка (30 pt) получает невидимую зону <code>::after</code> до 44 pt вместо того, чтобы расти.</span></div>
    <div class="label">Слои экрана</div>
    <p class="why"><code>--z-filters</code> 20 · <code>--z-header</code> 30 · <code>--z-tabbar</code> 40 · <code>--z-sheet</code> 50 · <code>--z-photo</code> 80. Внутри одного компонента хватает чисел 1–9 (бейдж над фото, полоска и ✕ листа).</p>
    <div class="label">Три уровня глубины</div>
    <div class="depth">0 · фон экрана <code>--bg</code><div class="l1">1 · группа, карточка — <code>--bg-elevated</code>, без тени</div><div class="l2">2 · лист поверх — <code>--elev-2</code></div></div></section>

  <section id="s-icons"><h2>Иконки</h2><p class="why">Один набор линейных иконок: сетка 24, линия 1,75, цвет от текста, размер от шрифта (<code>1em</code>). В коде — <code>ic('book')</code>, набор — <code>ICONS</code> в <code>index.html</code>. Новую иконку рисуем в том же стиле и добавляем в набор. Эмодзи остаются только там, где они содержание: значки-награды, совы 🦉, позиции витрины без фото.</p>
    <div class="icg" id="icg"></div>
    <div class="label">Иконка в строке списка: белый знак на цветном квадрате, как в «Настройках» iPhone (этап 3)</div>
    <div class="row">${[['blue-solid','calendar'],['orange-solid','book'],['green-solid','checklist'],['caramel-500','book'],['gold-solid','trophy'],['red-solid','bell'],['n-400','gear']].map(([c,n])=>`<span class="sq" style="background:var(--${c})">${ic(n)}</span>`).join('')}</div></section>

  <section id="s-motion"><h2>Движение и состояния</h2><p class="why">Одно поведение на вид компонента. Нажмите на кнопки и карточки ниже, чтобы увидеть.</p>
    <div class="mo">
      <div><code>--press .97</code><span>Нажатие: кнопки и карточки чуть уменьшаются. Строки списка вместо этого подсвечиваются <code>--fill-3</code>.</span></div>
      <div><code>--disabled .5</code><span>Недоступное — полупрозрачное и не реагирует.</span></div>
      <div><code>--dur .12s</code><span>Быстрые переходы цвета и нажатия.</span></div>
      <div><code>--dur-slow .3s</code><span>Сегменты, появление панелей, полосы прогресса.</span></div>
      <div><code>--dur-tick .2s</code><span>Полоса таймера: идёт за тиком равномерно (linear).</span></div>
      <div><code>--ease</code><span>Кривая iOS для листа и бегунка: быстро начинается, мягко останавливается.</span></div>
      <div><code>reduced motion</code><span>Если в телефоне включено «Уменьшение движения», анимаций нет совсем.</span></div>
      <div><code>prefers-contrast</code><span>«Увеличение контраста»: подписи и линии темнее, акцент глубже, панели почти непрозрачные.</span></div>
      <div><code>reduced transparency</code><span>«Понижение прозрачности»: панели и матовые кнопки становятся сплошными.</span></div>
    </div></section>

  <section id="s-comp"><h2>Компоненты</h2><p class="why">Всё, что есть в приложении, — уже система v2. Новый компонент сначала появляется здесь, с образцом; новые варианты старых классов не добавляем.</p>

    <h3>Навигация</h3><p class="why">Вверху — тонкая полупрозрачная панель: «Sensum &amp; Bakery», AZ и тема. Под ней большой заголовок экрана; когда он уходит под панель, панель показывает его по центру, а кнопка «назад» переезжает в неё. Внизу — полупрозрачный таббар с линейными иконками. Поиск — серое поле под заголовком.</p>
    <div class="label"><code>.ltitle</code>: <code>h1.t-large</code> и <code>.search</code></div>
    <div class="ltitle" style="padding:0"><h1 class="t-large">Напитки</h1><div class="search">${ic('search')}<input type="search" placeholder="Поиск по названию или составу…" aria-label="Поиск"></div></div>
    <div class="label"><code>.subbar</code> подэкрана: <code>.back</code> (шеврон и название экрана, куда вернёт) и большой заголовок</div>
    <div class="subbar" style="padding-left:0;padding-right:0"><button class="back">${ic('chevron-left')}<span class="backlbl">Материалы</span></button><h2>Кофе</h2></div>

    <h3>Кнопки</h3><p class="why">Четыре вида. <b>Filled</b> (<code>.lbtn.pri</code>) — одна на экран, главное действие. <b>Gray</b> (<code>.sec</code>) — второе. <b>Tinted</b> — со смыслом: зелёная «Знаю» (<code>.ok</code>), красная «Повторить» (<code>.again</code>). <b>Plain</b> (<code>.lnk</code>) — текстовая. Иконка — из <code>ic()</code>, не эмодзи; стрелки «›» у кнопок нет. Нажатая кнопка чуть уменьшается, недоступная бледнеет.</p>
    <div class="label"><code>.lbtn.pri</code> · <code>.sec</code></div><div class="lbtns" style="margin:0"><button class="lbtn sec">Открыть рецепт</button><button class="lbtn pri">Дальше</button></div>
    <div class="label"><code>.again</code> · <code>.ok</code></div><div class="lbtns" style="margin:0"><button class="lbtn again">${ic('refresh')}Повторить</button><button class="lbtn ok">${ic('check')}Знаю</button></div>
    <div class="label">С иконкой и недоступная (<code>:disabled</code>)</div><div class="lbtns" style="margin:0"><button class="lbtn pri">${ic('checklist')}Пройти проверку</button><button class="lbtn sec" disabled>${ic('check')}Урок пройден</button></div>
    <div class="label"><code>.lnk</code> — текстовая</div><div class="row"><button class="lnk">Завершить</button><button class="lnk">Сменить</button></div>

    <h3>Фильтры и переключатели</h3><p class="why"><b>Сегменты</b> (<code>.seg</code>, горячие/холодные <code>#tempchips</code>) — 2–3 варианта, выбран всегда один: серая дорожка, белый бегунок. <b>Чипы</b> (<code>.chip</code>) — много вариантов, листаются вбок: серая заливка, выбранный — акцент. <b>Чипы-ссылки</b> (<code>.chchip</code>, <code>.uchip</code>) открывают позицию или урок: бледный акцент.</p>
    <div class="label"><code>.seg</code></div><div class="seg"><button class="on">Все</button><button>Горячие</button><button>Холодные</button></div>
    <div class="label"><code>.chip</code> / <code>.chip.on</code></div><div class="row"><button class="chip on">Все категории</button><button class="chip">Эспрессо-бар</button><button class="chip">Лимонады</button></div>
    <div class="label"><code>.chchip</code> / <code>.uchip</code></div><div class="usedin" style="margin:0"><span class="chchip">☕ Lotus Latte</span><span class="chchip">${ic('book')}Легенда и происхождение</span><span class="uchip"><b>6 г</b> Signature Bliss</span></div>
    <div class="label"><code>.tsize</code> — степпер размера текста</div><div class="tsize"><button class="a1">A</button><span class="tsdots"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span><button class="a2">A</button></div>

    <h3>Бейджи</h3><p class="why">Одна форма вместо девяти: <code>.badge</code>, Caption 1 полужирный, обычными буквами (так и азербайджанские İ/ı не ломаются). На странице — бледный: цветной текст на бледном фоне того же цвета. На фото — плотный (<code>.solid</code>, белый текст) или матовый (<code>.glass</code>). Цвет несёт смысл: красный — новое, акцент — обновлено, зелёный — идёт сейчас, синий — объявление, серый — нейтральное. Горячий / холодный — не бейдж, а маленькая иконка в подписи карточки.</p>
    <div class="label">На странице</div><div class="row"><span class="badge red">Новинка</span><span class="badge accent">Правка</span><span class="badge blue">Объявление</span><span class="badge green">Сейчас действует</span><span class="badge">Сегодня с 17:00</span><span class="badge orange">${ic('flame')}Горячий</span></div>
    <div class="label">На фото</div><div class="row" style="padding:var(--sp-3);border-radius:var(--r-md);background:linear-gradient(135deg,#8a5a34,#3a2317)"><span class="badge solid red">Новинка</span><span class="badge solid accent">Обновлено</span><span class="badge glass">Салаты</span><span class="badge glass">${ic('snow')}Холодный</span><span class="badge solid red">1</span></div>
    <div class="label">В подписи карточки</div><div><div class="t-sub" style="font-weight:600">Espresso</div><div class="t-c1" style="color:var(--label-2)"><span class="tmp hot">${ic('flame')}</span>Эспрессо-бар · 160 мл</div><div class="t-c1" style="color:var(--label-2)"><span class="tmp cold">${ic('snow')}</span>Холодный кофе · 400 мл</div></div>

    <h3>Карточки, панели и списки</h3><p class="why"><b>Карточка с фото</b> (<code>.card</code>): само фото и есть карточка, название и подробности — под ним, на фоне экрана. <b>Панель</b> (<code>.lpanel</code>, <code>.promo</code>, <code>.spot</code>): <code>--bg-elevated</code> без рамки, тени и градиента; что важно, показывает бейдж. <b>Список</b> (<code>.lrows</code> с <code>.tile</code>, <code>.modes</code> с <code>.mode</code>): строки в одной белой группе, волосяные линии от начала текста, цветной квадрат <code>.ico</code> слева, шеврон <code>.chev</code> справа; нажатая строка подсвечивается. Заголовок раздела <code>h4.sec</code> — Title 3 над группой, без подчёркивания.</p>
    <div class="gridc"><div class="card"><div class="ph"><img src="${img('lotuslatte')}" alt=""></div><span class="newr badge solid red">Новинка</span><button class="fav">${ic('star')}</button><div class="body"><h3 class="serif">Lotus Latte</h3><div class="meta">Эспрессо-спешелти · 330 мл</div></div></div>
    <div class="card"><div class="ph"><img src="${img('citrussalad')}" alt=""></div><span class="kbadge badge glass">Салаты</span><button class="fav on">${ic('star-fill')}</button><div class="body"><h3 class="serif">Цитрусовый салат</h3><div class="meta vdesc">Салатный микс, киноа, черри</div></div></div></div>
    <div class="label"><code>.spot</code> — баннер новинки</div>
    <div class="nested"><div class="spot"><img src="${img('lotuslatte')}" alt=""><div class="sx"><span class="sb badge red">Новинка</span><div class="sn serif">Lotus Latte</div><div class="si">Эспрессо · Молоко · Lotus крем</div><div class="sf"><span class="pst badge on green">В продаже с 1 ноября</span><span class="sgo">Открыть рецепт ›</span></div></div></div></div>
    <div class="label"><code>.promo</code> — акция</div><div class="prow" style="padding:0;margin:0"><div class="promo now"><div class="pn">🎁 Напиток в подарок</div><div class="ps">К салату или большому сэндвичу</div><div class="pp">Подарок</div><div class="pt">12:00–15:00 · Пн–пт</div><span class="pst badge on green">Сейчас действует</span></div><div class="promo"><div class="pn">🥗 Fresh Combo</div><div class="ps">2 салата + 2 айс-ти</div><div class="pp">18 AZN</div><div class="pt">17:00–00:00 · Каждый день</div><div class="pb">📍 Только Ağ Şəhər</div><span class="pst badge">Сегодня с 17:00</span></div></div>
    <div class="label"><code>.tile</code> — строка меню «Ещё»</div><div class="lrows"><button class="tile"><span class="ti ico red">${ic('bell')}</span><span class="tx"><span class="tt">Изменения</span><span class="td">Новая позиция — Lotus Latte</span></span><span class="cnt badge solid red">1 новое</span><span class="chev"></span></button><button class="tile"><span class="ti ico gold">${ic('star-fill')}</span><span class="tx"><span class="tt">Избранное</span><span class="td">Сохранённые напитки, заготовки и позиции витрины</span></span><span class="chev"></span></button></div>
    <div class="label"><code>.tile</code> в списке уроков: номер, <code>.tile.read</code> — прочитано (зелёная галочка)</div><div class="lrows"><button class="tile read"><span class="ti ico green">${ic('check')}</span><span class="tx"><span class="tt">Легенда и происхождение</span><span class="td">Происхождение и ботаника</span></span><span class="chev"></span></button><button class="tile"><span class="ti ico gray">3</span><span class="tx"><span class="tt">Арабика и робуста</span><span class="td">Арабика и робуста</span></span><span class="chev">›</span></button></div>
    <div class="label"><code>.lpanel.plan</code> — «План на сегодня»: <code>.tile.next</code> — что делать сейчас, <code>.tile.read</code> — сделано сегодня</div><div class="lpanel plan"><div class="lph serif"><span>План на сегодня</span><small>1 / 2</small></div><div class="lrows"><button class="tile read"><span class="ti ico green">${ic('check')}</span><span class="tx"><span class="tt">Учёба на сегодня: сделано</span><span class="td">Дальше: Арабика и робуста</span></span><span class="chev">›</span></button><button class="tile next"><span class="ti ico green">${ic('checklist')}</span><span class="tx"><span class="tt">Общий тест недели</span><span class="td">На этой неделе: 1 / 3</span></span><span class="chev">›</span></button></div></div>
    <div class="label"><code>.wstrip .ws</code> — неделя одним взглядом: <code>.done</code> засчитано, <code>.tried</code> сдано ниже 70% (можно пересдать), без класса — ещё нет</div><div class="lpanel plan"><div class="wstrip"><span class="ws done">✓</span><span class="ws tried">↺</span><span class="ws">📝</span><span class="ws">📚</span><span class="ws">📚</span><small>Неделя: 1 из 5</small></div><p class="hint wlead" style="margin-bottom:0">Неделя полная, когда сданы 3 теста на 70%+ и пройдено 2 урока. Один зачётный тест в день.</p></div>
    <div class="label"><code>.lpanel.kpi</code> — «План месяца»: <code>.kbar</code> с чертой порога (<code>u</code>), <code>.prow2</code> — части процента, <code>.warn</code> — предупреждение, <code>.kl</code> — что это значит</div><div class="lpanel kpi warn"><div class="lph serif"><span>План месяца</span><small>74% · нужно 80%</small></div><span class="bar kbar"><i style="width:74%"></i><u style="left:80%"></u></span><div class="prow2"><span>Недели (3 теста и 2 урока)</span><b>79%</b></div><div class="prow2"><span>Экзамен месяца</span><b>ещё не сдан</b></div><div class="prow2"><span>Качество тестов</span><b>100%</b></div><div class="prow2"><span>Регулярность</span><b>100%</b></div><p class="note kwarn">Внимание: до конца месяца 2 дн., план выполнен на 74% из 80%.</p><p class="hint kl">Пробный месяц: ничего не списывается. Так выглядел бы минус: −6% KPI обучения.</p></div>
    <div class="label"><code>.astop</code>, <code>.lpanel.asitem</code> с <code>.seg.asseg</code> — «Проверки KPI» тренера: время и живой итог, пункт чек-листа (<code>.asstar</code> — важный пункт), баллы 1–5 или «Пропуск»; <code>.lpanel.myas</code> — своя проверка сотрудника (<code>.aspct</code> — процент)</div><div class="lpanel astop"><span>${ic('clock')} Время проверки: <b>4:12</b></span><span>Итог: <b>43 / 45 = 96%</b></span></div><div class="lpanel asitem"><div class="asq"><small>3. Аллергены<span class="asstar">${ic('star-fill')}</span></small>Знание аллергенов и состава десертов/блюд</div><div class="seg asseg"><button>1</button><button>2</button><button>3</button><button class="on">4</button><button>5</button><button>Пропуск</button></div></div><div class="lpanel myas"><div class="lph serif"><span>Моя проверка KPI</span><small>Аттестация навыков → Barista · 3 ноября</small></div><p class="aspct u-m0">86%</p><span class="bar"><i style="width:86%"></i></span><p class="hint u-mb0">43 из 50 баллов</p></div>
    <div class="label"><code>.mode.exam.slim</code> — экзамен месяца одной строкой; <code>details.bdgs</code> — свёрнутые значки</div><div class="modes"><button class="mode exam slim"><span class="mi ico gold">${ic('trophy')}</span><span class="mt"><b class="serif">Экзамен месяца</b><em>🦉 +5 / +10 / +15 за 80 / 90 / 100%</em></span><span class="chev">›</span></button></div><details class="lpanel bdgs" style="margin-top:var(--sp-3)"><summary><span>Значки · 2 / 6</span><span class="bico">👣🎯</span></summary><div class="badges"><div class="bdg on"><span>👣</span><b>Первый шаг</b><small>Первый тест</small></div><div class="bdg on"><span>🎯</span><b>В яблочко</b><small>Тест без ошибок</small></div><div class="bdg"><span>☕</span><b>Знаток напитков</b><small>10 тестов на 90%+</small></div></div></details>
    <div class="label"><code>.modes</code> / <code>.mode</code> — строки с иконкой, названием, описанием и счётчиком</div><div class="modes"><button class="mode"><span class="mi ico blue">${ic('cards')}</span><b>Карточки</b><span>Вспомни рецепт</span><em>20 в наборе</em><span class="chev"></span></button><button class="mode"><span class="mi ico green">${ic('checklist')}</span><b>Тест</b><span>Варианты ответа</span><em>10 вопросов · ⏱ 15 с</em><span class="chev"></span></button></div>
    <div class="label"><code>.lpanel.lesson</code> — текст урока (его название — только большой заголовок экрана): <code>h4.sec</code>, <code>.lp</code>, <code>.ll</code> (список), <code>.ltab</code> (таблица), <code>.note</code></div><div class="lpanel lesson"><p class="lp">В мировом производстве на арабику приходится 70 %.</p><ul class="ll"><li><b>Арабика</b> — более кислая</li><li><b>Робуста</b> — более горькая</li></ul><table class="ltab"><thead><tr><th></th><th>Арабика</th><th>Робуста</th></tr></thead><tbody><tr><th scope="row">Кофеин</th><td>1–1,5 %</td><td>2–3 %</td></tr></tbody></table><div class="note">Арабика — Эфиопия, робуста — Центральная Африка.</div></div>
    <div class="label"><code>.lpanel</code> — панель</div><div class="lpanel"><div class="lph">Твой прогресс</div><div class="prow2"><span>Напитки</span><b>12 / 56</b></div><span class="bar"><i style="width:22%"></i></span><div class="hint">Тестов ещё не было</div></div>

    <h3>Содержимое листа</h3><p class="why">Фото до края листа, ✕ на матовом кружке, название под фото, факты строкой. Состав — список: заготовка — карамельная строка с шевроном, открывает её. Шаги — список с номерами в бледных кружках. Заметка — бледная плашка без полосы. Ссылки на позиции — чипы-ссылки.</p>
    <div class="label"><code>.spec .p</code> — факты одной строкой, как в App Store: серая подпись над значением, волосяные линии между (система v2)</div><div class="spec"><div class="p"><b>Посуда</b>330 мл</div><div class="p"><b>Подача</b>Горячий</div><div class="p"><b>Старт продаж</b>1 ноября</div></div>
    <div class="label"><code>h4.sec</code>, <code>table.ing</code>, <code>.note</code>, <code>.hint</code></div><h4 class="sec" style="margin-top:0">Состав</h4>
    <table class="ing"><tr><td>Эспрессо (одинарный)</td><td class="q">18 г</td></tr><tr><td><span class="prep-link">Шоколадный соус</span></td><td class="q">70 г</td></tr></table>
    <h4 class="sec">Приготовление</h4><ol class="steps"><li>Измельчи 18 г кофе под эспрессо помол.</li><li>Приготовь эспрессо: на выходе ~30–40 г, время 25–30 сек.</li></ol>
    <div class="note">Заметка: сироп хранится 7 дней при +2…+5 °C.</div><p class="hint">Вспомогательный текст — серый, 12 px.</p>
    <div class="label"><code>.chchip</code> / <code>.uchip</code> — ссылки на позиции</div><div class="usedin"><span class="chchip">☕ Lotus Latte</span><span class="uchip"><b>6 г</b> Signature Bliss</span></div>

    <h3>Тест</h3><p class="why">Вопрос на белом блоке, варианты — отдельными строками с кружком состояния <code>.mk</code> слева: пустой — не выбран, акцент — отмечен (галочка или номер, <code>.pos</code>), зелёный — верно, красный — неверно; остальные приглушены. Таймер — тонкая полоса, в последние 5 секунд красная.</p>
    <div class="qcard" style="margin-bottom:var(--sp-3)"><div class="qtext">Сколько молока в Lotus Latte?</div></div>
    <div class="qtrow" style="margin-top:0"><span class="qtimer"><i style="width:60%"></i></span><b>9</b></div>
    <div class="opts"><button class="opt"><b class="mk"></b>180 мл</button><button class="opt right"><b class="mk">${ic('check')}</b>220 мл</button><button class="opt wrong"><b class="mk">${ic('x')}</b>250 мл</button><button class="opt dim" disabled><b class="mk"></b>300 мл</button></div>
    <div class="label" style="margin-top:var(--sp-4)"><code>.opt.sel</code> + <code>.pos.mk</code> — отмечено, ещё не проверено</div>
    <div class="opts"><button class="opt sel"><b class="pos mk">${ic('check')}</b>Отмеченный вариант</button><button class="opt sel"><b class="pos mk">2</b>Второй по порядку</button><button class="opt"><b class="mk"></b>Не отмечен</button></div>
    <div class="label" style="margin-top:var(--sp-4)">После проверки порядка: верная и неверная позиция</div>
    <div class="opts"><button class="opt right" disabled><b class="pos mk">1</b>Стоит на своём месте</button><button class="opt wrong" disabled><b class="pos mk">2</b>Должен быть вторым</button></div>
    <div class="label" style="margin-top:var(--sp-4)"><code>.linput</code> — ответ числом, код сотрудника</div>
    <div class="qnum"><input class="linput" type="text" inputmode="decimal" placeholder="Число" value="70" aria-label="Число"><input class="linput right" type="text" value="70" disabled aria-label="Верно"><input class="linput wrong" type="text" value="71" disabled aria-label="Неверно"></div></section>

  <section id="s-plan"><h2>История перехода</h2><p class="why">Каждый этап — отдельный PR. Логика, данные и тексты не меняются, только вид. Переход закончен (v1.117): макет, основа (роли, стили текста, иконки, этот справочник), навигация, панели и списки, кнопки, фильтры, бейджи и тест, уборка. Этап 6 (v1.120) — полировка по итогам разбора. Таблица осталась как история: что чем заменено.</p>
    <div class="tblw"><table class="map"><thead><tr><th>Компонент</th><th>Заменяет</th><th>Каким станет</th><th>Этап</th></tr></thead>
    <tbody>${MAP.map(([a,b,c,n])=>`<tr><td>${a}</td><td><code>${b}</code></td><td>${c}</td><td>${n<=DONE?`<span class="stage done">${n} · сделано</span>`:n}</td></tr>`).join('')}</tbody></table></div></section>
  `;
  const root=document.getElementById('sg'); root.innerHTML=html;
  document.getElementById('icg').innerHTML=Object.keys(ICONS).map(k=>`<div>${ic(k)}${ICN[k]||k}<code>${k}</code></div>`).join('');
  const sw=document.getElementById('sw');
  const paint=()=>{const cs=getComputedStyle(document.documentElement);
    sw.innerHTML=ROLES.map(([g,why,rows])=>`<div class="label" style="font-size:var(--fs-body);color:var(--label);margin-top:var(--sp-5)">${g}</div><p class="why" style="margin-top:0">${why}</p><div class="sw">${rows.map(([t,u])=>`<div><i style="background:var(--${t})"></i><span><code>--${t}</code>${u}<small>${cs.getPropertyValue('--'+t).trim()}</small></span></div>`).join('')}</div>`).join('');
    document.getElementById('g-theme').textContent=THEME()==='dark'?'Светлая тема':'Тёмная тема';
    document.getElementById('g-ts').textContent='текст '+Math.round(parseFloat(cs.getPropertyValue('--ts')||1)*100)+'%';};
  paint();
  document.getElementById('g-theme').onclick=()=>{const d=THEME()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',d);try{localStorage.setItem('sensum_theme',d)}catch(e){}paint();};
  const STEPS=[0.88,1,1.12,1.24,1.35]; const cur=()=>{const z=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ts'))||1;return Math.max(0,STEPS.findIndex(x=>Math.abs(x-z)<.01))};
  const setz=i=>{i=Math.min(STEPS.length-1,Math.max(0,i));document.documentElement.style.setProperty('--ts',STEPS[i]);try{localStorage.setItem('sensum_textsize',STEPS[i])}catch(e){}paint();};
  document.getElementById('g-m').onclick=()=>setz(cur()-1); document.getElementById('g-p').onclick=()=>setz(cur()+1);
  document.documentElement.dataset.sgReady='1';
}).catch(()=>{document.getElementById('sg-load').textContent='Не удалось загрузить index.html. Откройте страницу через сайт, а не из файла.';});
</script>
