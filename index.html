<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script>(function(){try{var t=localStorage.getItem("sensum_theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3a2317">
<title>Sensum & Bakery — Справочник бариста</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sensum">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<style>
:root{
  --espresso:#3a2317; --espresso2:#4d3020; --caramel:#b5723a; --caramel-d:#8f571f;
  --crema:#e7d3b3; --cream:#faf5ee; --card:#ffffff; --ink:#2c2019; --muted:#76685b;
  --line:#ece1d3; --hot:#c56a2d; --cold:#3d84a8; --shadow:0 6px 22px rgba(58,35,23,.10);
  --new:#c0392b; --bg2:#faf3ea; --note-bg:#fff7ee; --note-border:#f0dcc2;
  --grabber:rgba(58,35,23,.25); --header-sub:#e7d3b3; --search-ink:#2c2019; --search-muted:#76685b;
  --chip-active:#3a2317;
  --ok:#2e7d4f; --ok-bg:#e9f5ed; --bad-bg:#fdeceb;
  /* badges and buttons with white text: AA contrast (4.5:1) in both themes */
  --b-fix:#a26634; --b-news:#397c9d; --b-hot:#b15f28; --b-cold:#397c9d; --b-ok:#2b8452; --b-new:#c0392b;
  /* design tokens — type scale after the iOS text styles, 4-pt spacing, radii, minimum tap target */
  --fs-c2:11px; --fs-c1:12px; --fs-fn:13px; --fs-sub:15px; --fs-callout:16px; --fs-body:17px; --fs-t3:20px; --fs-t2:22px; --fs-t1:28px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;
  --r-sm:10px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-pill:999px;
  --tap:44px;
}
:root[data-theme="dark"]{
  --espresso:#f1e2c9; --espresso2:#e3cfae; --caramel:#c98a4f; --caramel-d:#e0a05e;
  --crema:#3c2c1d; --cream:#181009; --card:#241a11; --ink:#ecdfcd; --muted:#a89178;
  --line:#3a2c1d; --hot:#d97a3d; --cold:#5aa0c4; --shadow:0 6px 22px rgba(0,0,0,.4);
  --new:#e0574a; --bg2:#241a11; --note-bg:#2c2013; --note-border:#4a3620;
  --grabber:rgba(241,226,201,.3);
  --ok:#5cb685; --ok-bg:#1c3326; --bad-bg:#3b1f1b;
  --b-fix:#a26634; --b-news:#397c9d; --b-hot:#b15f28; --b-cold:#397c9d; --b-ok:#2b8452; --b-new:#c54c41;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;line-height:inherit;color:inherit}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
  background:var(--cream);color:var(--ink);line-height:1.45;
  display:flex;flex-direction:column;height:100vh;overflow:hidden}
.scroll-area{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.serif{font-family:Georgia,"Times New Roman",serif}
header{position:sticky;top:0;z-index:30;background:linear-gradient(160deg,#3a2317,#4d3020);
  color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand h1{font-family:Georgia,serif;font-size:var(--fs-t3);margin:0;letter-spacing:.3px;font-weight:600;white-space:nowrap}
.brand .sub{font-size:var(--fs-c1);color:var(--header-sub);opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navdot{position:absolute;top:2px;right:calc(50% - 20px);width:9px;height:9px;background:var(--new);border-radius:50%;
  border:2px solid var(--card);display:none}
.chtype{display:inline-block;font-size:var(--fs-c2);font-weight:700;letter-spacing:.3px;padding:3px 10px;border-radius:var(--r-pill)}
.chtype.fix{background:var(--b-fix);color:#fff}
.chtype.news{background:var(--b-news);color:#fff}
.search{margin-top:10px;position:relative}
.search input{width:100%;border:0;border-radius:var(--r-md);padding:11px 12px 11px 38px;font-size:var(--fs-callout);
  background:rgba(255,255,255,.96);color:var(--search-ink);outline:none}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;
  color:var(--search-muted);font-size:20px;cursor:pointer;padding:4px 8px;display:none}
.filters{background:var(--cream);position:sticky;top:var(--stick,0);z-index:20;padding:10px 0 6px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips+.chips{margin-top:2px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--espresso2);
  padding:7px 13px;border-radius:var(--r-pill);font-size:var(--fs-fn);font-weight:500;cursor:pointer;transition:.15s}
.chip.on{background:var(--chip-active);color:#fff;border-color:var(--chip-active)}
.chip.temp-hot.on{background:var(--hot);border-color:var(--hot)}
.chip.temp-cold.on{background:var(--cold);border-color:var(--cold)}
.count{padding:8px 16px 2px;font-size:var(--fs-c1);color:var(--muted)}
.wrap{padding:6px 12px 20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:820px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;
  display:flex;flex-direction:column;position:relative;transition:transform .12s}
.card:active{transform:scale(.975)}
.card .ph{position:relative;aspect-ratio:1/1;background:var(--crema);overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .ph.noimg{display:flex;align-items:center;justify-content:center}
.card .ph.noimg span{font-family:Georgia,serif;font-size:30px;color:#fff;opacity:.9}
.tbadge{position:absolute;left:8px;top:8px;font-size:var(--fs-c2);font-weight:700;letter-spacing:.4px;
  padding:3px 8px;border-radius:var(--r-sm);color:#fff;text-transform:uppercase}
.tbadge.hot{background:var(--b-hot)} .tbadge.cold{background:var(--b-cold)}
.newr{position:absolute;left:8px;top:8px;background:var(--b-new);color:#fff;font-size:var(--fs-c2);font-weight:700;
  letter-spacing:.3px;padding:3px 8px;border-radius:var(--r-sm);text-transform:uppercase;z-index:2}
.kbadge{position:absolute;left:8px;top:8px;font-size:var(--fs-c2);font-weight:700;padding:3px 8px;border-radius:var(--r-sm);
  color:#fff;background:rgba(58,35,23,.55);text-transform:uppercase;letter-spacing:.3px}
.fav{position:absolute;right:6px;top:6px;border:0;background:rgba(255,255,255,.85);border-radius:50%;
  width:30px;height:30px;font-size:16px;line-height:1;cursor:pointer;color:#c9a24a}
.fav.on{color:#e0a900}
.card .body{padding:9px 11px 12px}
.card h3{font-family:Georgia,serif;font-size:var(--fs-sub);margin:0 0 3px;font-weight:600;line-height:1.2}
.card .meta{font-size:var(--fs-c1);color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(30,18,12,.55);z-index:50;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);touch-action:none}
.overlay.show{display:flex}
.sheet{background:var(--cream);width:100%;max-width:560px;max-height:92vh;border-radius:var(--r-xl) var(--r-xl) 0 0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grabzone{position:sticky;top:0;z-index:5;display:flex;justify-content:center;padding:9px 0 5px;
  background:var(--cream);box-shadow:0 2px 6px rgba(58,35,23,.08);touch-action:none;cursor:grab}
.grabber{width:38px;height:5px;border-radius:var(--r-pill);background:var(--grabber)}
.sheet.dragging{transition:none!important}
@media(min-width:560px){.overlay{align-items:center}.sheet{border-radius:var(--r-xl);max-height:88vh}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.hero{position:relative;aspect-ratio:16/10;background:var(--crema)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero.noimg{display:flex;align-items:center;justify-content:center}
.hero.noimg span{font-family:Georgia,serif;font-size:54px;color:#fff;opacity:.9}
.hero .grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(30,18,12,.72),transparent 55%)}
.hero .ttl{position:absolute;left:16px;bottom:12px;right:56px;color:#fff}
.hero .ttl h2{font-family:Georgia,serif;font-size:var(--fs-t2);margin:0 0 2px;font-weight:600}
.hero .ttl .c{font-size:var(--fs-c1);opacity:.92}
.close{position:absolute;right:12px;top:12px;width:34px;height:34px;border:0;border-radius:50%;
  background:rgba(0,0,0,.4);color:#fff;font-size:20px;cursor:pointer;z-index:2}
.sheet .content{padding:14px 16px calc(26px + env(safe-area-inset-bottom))}
.spec{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.spec .p{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px;font-size:var(--fs-c1)}
.spec .p b{display:block;color:var(--caramel-d);font-size:var(--fs-c2);text-transform:uppercase;letter-spacing:.3px;font-weight:700}
h4.sec{font-family:Georgia,serif;font-size:var(--fs-sub);margin:16px 0 8px;color:var(--espresso);border-bottom:2px solid var(--crema);padding-bottom:5px}
table.ing{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow)}
table.ing td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:var(--fs-sub);vertical-align:top}
table.ing tr:last-child td{border-bottom:0}
table.ing td.q{text-align:right;white-space:nowrap;color:var(--espresso2);font-weight:600;font-variant-numeric:tabular-nums}
.prep-link{color:var(--caramel-d);font-weight:600;cursor:pointer;border-bottom:1px dashed var(--caramel)}
.prep-link::after{content:" ✦";font-size:10px;color:var(--caramel)}
.note{background:var(--note-bg);border:1px solid var(--note-border);border-left:3px solid var(--caramel);border-radius:var(--r-sm);padding:11px 13px;font-size:var(--fs-sub);color:var(--ink);margin-top:8px}
.hint{font-size:var(--fs-c1);color:var(--muted);margin-top:10px}
ol.steps{margin:8px 0 0;padding-left:20px} ol.steps li{margin:6px 0;font-size:var(--fs-sub)}
.usedin{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.uchip{background:var(--card);border:1px solid var(--line);border-radius:var(--r-pill);padding:6px 11px;font-size:var(--fs-fn);cursor:pointer;color:var(--espresso2)}
.uchip b{color:var(--caramel-d);font-variant-numeric:tabular-nums}
.uchip::before{content:"☕ "}
.store{display:flex;gap:8px;margin-top:8px;font-size:var(--fs-fn);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px}
.store .k{color:var(--caramel-d);font-weight:700;white-space:nowrap}
.emptyfav{text-align:center;color:var(--muted);padding:50px 24px;font-size:var(--fs-sub)}
.favhead{font-family:Georgia,serif;color:var(--espresso);font-size:var(--fs-body);margin:6px 4px 2px;padding-top:6px}
/* whats new */
.wn h2{font-family:Georgia,serif;color:var(--espresso);font-size:var(--fs-t3);margin:2px 0 2px}
.wn .ver{display:inline-block;background:var(--b-fix);color:#fff;font-size:var(--fs-c1);font-weight:700;border-radius:var(--r-pill);padding:3px 11px;margin-bottom:4px}
.wn .date{color:var(--muted);font-size:var(--fs-c1);margin-left:6px}
.wn ul{margin:8px 0 0;padding-left:18px} .wn li{margin:6px 0;font-size:var(--fs-sub)}
.wn .rel{margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow)}
.wn .chglink{font-size:var(--fs-c1);color:var(--muted);margin-top:10px 0 6px;text-transform:none}
.chchip{background:var(--bg2,#faf3ea);border:1px solid var(--line);border-radius:var(--r-pill);padding:6px 11px;font-size:var(--fs-fn);cursor:pointer;color:var(--espresso2);display:inline-flex;align-items:center;gap:4px}
.chchip:active{opacity:.7}
nav.tabs{flex-shrink:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 14px rgba(58,35,23,.08)}
nav.tabs button{position:relative;flex:1;border:0;background:none;padding:6px 2px;cursor:pointer;color:var(--muted);font-size:var(--fs-c2);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button .ic{font-size:19px;line-height:1}
nav.tabs button.on{color:var(--caramel-d);font-weight:600}
.view{display:none} .view.on{display:block}
footer.tag{text-align:center;font-size:var(--fs-c2);color:var(--muted);padding:10px 0 4px}
.langbtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:var(--r-sm);font-size:var(--fs-fn);font-weight:600;line-height:1;padding:6px 10px;cursor:pointer}
.hactions{display:flex;align-items:center;gap:8px}
.themebtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:var(--r-sm);font-size:15px;line-height:1;padding:6px 9px;cursor:pointer}.hero:not(.noimg) img{cursor:zoom-in}
.photoview{position:fixed;inset:0;z-index:80;background:rgba(10,6,4,.95);display:none;align-items:center;justify-content:center;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
.photoview.show{display:flex}
.photoview img{width:100%;height:100%;object-fit:contain;transform-origin:50% 50%;will-change:transform;pointer-events:none;-webkit-user-drag:none}
.pclose{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:26px;line-height:1;cursor:pointer;z-index:2;touch-action:manipulation}
.promos{padding:10px 0 2px}
.ptitle{padding:0 16px 6px;font-size:var(--fs-c1);font-weight:700;color:var(--muted);letter-spacing:.3px}
.prow{display:flex;gap:10px;overflow-x:auto;padding:0 14px 6px;scrollbar-width:none}
.prow::-webkit-scrollbar{display:none}
.promo{flex:0 0 232px;display:flex;flex-direction:column;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:11px 13px 12px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
.promo:active{transform:scale(.975)}
.promo.now{border-color:var(--caramel);background:linear-gradient(135deg,var(--card),var(--note-bg))}
.promo .pn{font-size:var(--fs-sub);font-weight:600;line-height:1.2}
.promo .ps{font-size:var(--fs-c1);color:var(--muted)}
.promo .pp{font-size:var(--fs-sub);font-weight:700;color:var(--caramel-d);margin-top:2px}
.promo .pt{font-size:var(--fs-c1);color:var(--espresso2)}
.promo .pb{font-size:var(--fs-c1);font-weight:600;color:var(--caramel-d)}
.pst{align-self:flex-start;margin-top:6px;font-size:var(--fs-c2);font-weight:700;padding:3px 9px;border-radius:var(--r-md);background:var(--line);color:var(--espresso2)}
.pst.on{background:var(--b-ok);color:#fff}
.spot{display:flex;gap:12px;align-items:center;margin:10px 14px 2px;padding:10px;background:linear-gradient(135deg,var(--card),var(--note-bg));border:1.5px solid var(--caramel);border-radius:var(--r-lg);box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
.spot:active{transform:scale(.98)}
.spot img{width:84px;height:84px;flex:0 0 84px;border-radius:var(--r-md);object-fit:cover}
.spot .sx{min-width:0;display:flex;flex-direction:column;gap:3px}
.spot .sb{align-self:flex-start;background:var(--b-new);color:#fff;font-size:var(--fs-c2);font-weight:700;letter-spacing:.3px;padding:2px 8px;border-radius:var(--r-sm)}
.spot .sn{font-size:var(--fs-body);font-weight:600;line-height:1.15}
.spot .si{font-size:var(--fs-c1);color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.spot .sf{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:2px}
.spot .sf .pst{margin-top:0}
.spot .sgo{font-size:var(--fs-c1);font-weight:700;color:var(--caramel-d)}
.card .ph.vph{aspect-ratio:4/3}
.vdesc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vtags{position:absolute;left:8px;bottom:8px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.vtag{font-size:var(--fs-c2);font-weight:700;padding:3px 8px;border-radius:var(--r-sm);background:rgba(255,255,255,.92);color:#3a2317}
/* «Ещё» hub + training */
.subbar{display:flex;align-items:center;gap:6px;padding:10px 12px 0}
.subbar h2{font-family:Georgia,serif;font-size:var(--fs-t3);margin:0;color:var(--espresso)}
.back{border:0;background:none;color:var(--caramel-d);font-size:var(--fs-sub);font-weight:600;line-height:1;padding:8px 6px 8px 2px;cursor:pointer}
.hub{display:grid;gap:10px}
.tile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
.tile:active{transform:scale(.985)}
.tile .ti{flex-shrink:0;width:46px;height:46px;border-radius:var(--r-md);background:var(--note-bg);border:1px solid var(--note-border);display:flex;align-items:center;justify-content:center;font-size:23px}
.tile .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tile .tt{font-family:Georgia,serif;font-size:var(--fs-body);font-weight:600;color:var(--espresso)}
.tile .td{font-size:var(--fs-fn);color:var(--muted)}
.tile .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .chev{color:var(--muted);font-size:22px;line-height:1}
.cnt{flex-shrink:0;background:var(--b-new);color:#fff;border-radius:var(--r-md);font-size:var(--fs-c2);font-weight:700;padding:3px 9px}
.bar{display:block;height:6px;border-radius:var(--r-pill);background:var(--line);overflow:hidden;margin:2px 0}
.bar i{display:block;height:100%;background:var(--caramel);border-radius:var(--r-pill);transition:width .3s}
.lpanel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.lph{font-size:var(--fs-body);font-weight:600;color:var(--espresso);margin-bottom:6px}
.prow2{display:flex;justify-content:space-between;font-size:var(--fs-fn);margin-top:8px}
.prow2 b{font-variant-numeric:tabular-nums;color:var(--espresso2)}
.lchips{display:flex;gap:7px;overflow-x:auto;margin:0 -12px 8px;padding:0 12px 2px;scrollbar-width:none}
.lchips::-webkit-scrollbar{display:none}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow);cursor:pointer;min-width:0;transition:transform .12s}
.mode:active{transform:scale(.975)}
.mode .mi{font-size:28px;line-height:1}
.mode b{font-size:var(--fs-body);color:var(--espresso)}
.mode span{font-size:var(--fs-fn);color:var(--muted)}
.mode em{font-style:normal;font-size:var(--fs-c1);font-weight:600;color:var(--caramel-d);margin-top:auto;padding-top:4px}

18 г"],["Молоко","130 мл"]],"steps":["Свари двойной ристретто (18 г) в чашку 160 мл — останови экстракцию на пару секунд раньше обычного, чтобы получить выход 30–33 г и не добавить лишнюю горечь.","Взбей 130 мл молока до очень тонкой пены (≤0,5 см).","Долей немного молока в эспрессо и прокрути до однородного цвета.","Долей остальное молоко ровной струёй, слегка оформив лёгкий латте-арт."],"tip":"Пена ≤0,5 см — иначе это латте."},{"id":"americano","name":"Café Americano","cat":"espressobar","temp":"hot","img":"americano","vessel":"240 мл","ing":[["Эспрессо (двойной)","36 г"],["Горячая вода","200 мл"]],"steps":["Свари двойной эспрессо (18 г кофе, выход 36 г).","Долей горячую воду 200 мл (90–93 °C)."],"tip":"Чтобы сохранить крему, воду можно налить первой, эспрессо — сверху."},{"id":"lungo","name":"Australian Lungo","cat":"manualbrew","temp":"hot","img":"lungo","vessel":"240 мл","ing":[["Кофе под фильтр (помол под аэропресс, EK-43 5–6)","18 г"],["Бумажный фильтр Aeropress","1 шт"]],"steps":["Измельчи 18 г кофе под фильтр-обжарку под аэропресс (EK-43, деление 5–6).","Вставь бумажный фильтр Aeropress в портафильтр, засыпь кофе, слегка утрамбуй.","Пропусти через группу эспрессо: пролив 25–30 сек, выход 200 мл в чашку 240 мл."],"tip":"Бежит быстрее 25–30 сек → помол мельче; медленно капает → крупнее."},{"id":"v60","name":"V60","cat":"manualbrew","temp":"hot","img":"v60","vessel":"270 мл","ing":[["Фильтр-кофе","18 г"],["Вода (93–94 °C)","282 г"],["Фильтр V60 (конусный)","1 шт"]],"steps":["Вставь конусный фильтр V60, пролей горячей водой, слитую воду вылей.","Засыпь 18 г кофе (помол EK-43: 10–12).","Нагрей воду до 93–94 °C.","Лей в 3 этапа (всего 282 г): 0:00 — 60 г (блум); до 1:15 — ещё 60 г; затем оставшиеся 162 г.","Дай стечь. Время: 2,5–3,5 мин."],"method":"Дрип (V60)","tip":"Уходит быстро → помол мельче; застаивается → крупнее."},{"id":"chemex","name":"Chemex","cat":"manualbrew","temp":"hot","img":"chemex","vessel":"270 мл","ing":[["Фильтр-кофе","18 г"],["Вода (93–94 °C)","282 г"],["Фильтр Chemex","1 шт"]],"steps":["Вставь фильтр Chemex, пролей горячей водой, слитую воду вылей.","Засыпь 18 г кофе (помол EK-43: 13–14, на пару делений крупнее V60).","Нагрей воду до 93–94 °C.","Лей в 3 этапа (всего 282 г): 0:00 — 60 г (блум); до 1:15 — ещё 60 г; затем оставшиеся 162 г.","Дай стечь. Время: до 4 мин."],"method":"Дрип (Chemex)","tip":"Уходит быстро → помол мельче; застаивается → крупнее."},{"id":"cezve","name":"Cezve — Türk qəhvəsi","cat":"manualbrew","temp":"hot","img":"cezve","vessel":"80 мл","ing":[["Кофе под турку (мин. помол EK-43)","8 г"],["Вода","65 мл"],["Сахар","по желанию"],["Лукум","2 шт"]],"steps":["Измельчи 8 г кофе (под турку) на минимальном помоле EK-43 — до муки.","Засыпь в джезву кофе + сахар по желанию гостя (сыпучее — первым).","Влей 65 мл холодной воды, размешай.","Поставь на песок, грей медленно, не мешая.","Как пенка начнёт подниматься — сними, не давая закипеть.","Перелей в чашку 80 мл с пенкой. Подай с 2 лукумами и водой."],"tip":"Сахар — 1–3 пакетика по желанию, кладётся с кофе до воды. Всегда уточняй у гостя."},{"id":"raf","name":"Raf","cat":"espressobar","temp":"hot","img":"raf","vessel":"330 мл","ing":[["Эспрессо (двойной)","36 г"],["Молоко","160 мл"],["Сливки","50 г"],["Тростниковый сахар","15 г"]],"steps":["В питчер добавь всё вместе: двойной эспрессо (18 г кофе, выход 36 г), молоко 160 мл, сливки 50 г, тростниковый сахар 15 г. Немного кофе оставь на арт.","Прогрей и взбей стимером до молочной пены (как латте, чуть больше).","Перелей в чашку 330 мл, нанеси кофе сверху для арта."]},{"id":"rafvanilla","name":"Raf Vanilla","cat":"espressobar","temp":"hot","img":"rafvanilla","vessel":"330 мл","ing":[["Эспрессо (двойной)","36 г"],["Молоко","160 мл"],["Сливки","50 г"],["Ванильный паудер","18 г"]],"steps":["В питчер добавь всё вместе: двойной эспрессо (18 г кофе, выход 36 г), молоко 160 мл, сливки 50 г, ванильный паудер 18 г. Немного кофе оставь на арт.","Прогрей и взбей стимером до молочной пены (как латте, чуть больше).","Перелей в чашку 330 мл, нанеси кофе сверху для арта."]},{"id":"rafcitrus","name":"Citrus Raf","cat":"espressobar","temp":"hot","img":"rafcitrus","vessel":"330 мл","ing":[["Эспрессо (двойной)","36 г"],["Молоко","160 мл"],["Сливки","50 г"],["Цитрусовый паудер","18 г"]],"steps":["В питчер добавь всё вместе: двойной эспрессо (18 г кофе, выход 36 г), молоко 160 мл, сливки 50 г, цитрусовый паудер 18 г. Немного кофе оставь на арт.","Прогрей и взбей стимером до молочной пены (как латте, чуть больше).","Перелей в чашку 330 мл, нанеси кофе сверху для арта."]},{"id":"mocha","name":"Café Mocha","cat":"espressobar","temp":"hot","img":"mocha","vessel":"330 мл","ing":[["Эспрессо (двойной)","36 г"],["Молоко","220 мл"],["Шоколадный соус","70 г"],["Взбитые сливки","50 г"]],"steps":["В чашку 330 мл добавь шоколадный соус 70 г.","Свари двойной эспрессо (18 г кофе, выход 36 г) и влей в чашку, хорошо размешай ложкой до однородной массы.","Слегка подогрей эту смесь на стимере кофемашины, чтобы напиток получился тёплым.","Взбей 220 мл молока в питчере до тонкой пены (~0,5 см), как под латте.","Влей молоко в чашку ровной струёй, оформив лёгкий латте-арт.","Спроси гостя: со взбитыми сливками (50 г) или без."]},{"id":"milkychoco","name":"Milky Chocolate","cat":"espressobar","temp":"hot","img":"milkychoco","vessel":"240 мл","ing":[["Молоко","100 мл"],["Шоколадный соус","70 г"],["Сливки","50 г"],["Маршмеллоу","2 шт"]],"steps":["В питчер добавь молоко 100 мл, шоколадный соус 70 г и сливки 50 г.","Взбей всё вместе стимером до однородной массы — с мягкой, ровной пеной без пузырей.","Перелей в чашку 240 мл.","Укрась двумя маршмеллоу."]},{"id":"mochacaramel","name":"Mocha Caramel","cat":"espressobar","temp":"hot","img":"mochacaramel","vessel":"330 мл","ing":[["Эспрессо (двойной)","36 г"],["Молоко","220 мл"],["Шоколадный соус","20 г"],["Карамельный сироп","25 г"],["Взбитые сливки","50 г"]],"steps":["В чашку 330 мл добавь шоколадный соус 20 г и карамельный сироп 25 г.","Свари двойной эспрессо (18 г кофе, выход 36 г) и влей в чашку, хорошо размешай ложкой до однородной массы.","Слегка подогрей эту смесь на стимере кофемашины, чтобы напиток получился тёплым.","Взбей 220 мл молока в питчере до тонкой пены (~0,5 см), как под латте.","Влей молоко в чашку ровной струёй, оформив лёгкий латте-арт.","Спроси гостя: со взбитыми сливками (50 г) или без."]},{"id":"spanishlatte","name":"Spanish Latte","cat":"espressobar","temp":"hot","img":"spanishlatte","vessel":"280 мл","ing":[["Эспрессо (одинарный)","18 г"],["Молоко","220 мл"],["Сгущённое молоко","30 г"]],"steps":["Свари одинарный эспрессо (18 г — половина дабл-пролива) в чашку 280 мл.","Взбей молоко 220 мл (как под латте) и влей.","Сгущёнку 30 г подай отдельно — гость добавляет по вкусу."],"tip":"Отдельно подаётся только сгущёнка; молоко уже в напитке."},{"id":"euphoria","name":"Euphoria","cat":"specialties","temp":"hot","img":"euphoria","vessel":"330 мл","ing":[["Эспрессо (двойной)","36 г"],["Молоко","160 мл"],["Сливки","50 г"],["Пряный сироп","30 г"],["Пряный паудер","1 г"],["Орех макадамия","5 г"]],"steps":["В питчер добавь вместе: двойной эспрессо (18 г кофе, выход 36 г), молоко 160 мл, сливки 50 г, пряный сироп 30 г, пряный паудер 1 г. Немного кофе оставь на арт.","Прогрей и взбей стимером до молочной пены (как латте, чуть больше).","Перелей в чашку 330 мл, нанеси кофе для арта.","Натри макадамию (5 г) на тёрке сверху."]},{"id":"illusion","name":"Illusion","cat":"specialties","temp":"hot","img":"illusion","vessel":"330 мл","ing":[["Эспрессо (одинарный)","18 г"],["Молоко","220 мл"],["Солёно-карамельный соус","35 г"],["Паудер Elizabeta","2 г"]],"steps":["Добавь солёно-карамельный соус 35 г в молоко 220 мл.","Взбей стимером — пена как у латте.","Перелей в чашку 330 мл. Свари одинарный эспрессо (18 г — половина дабл-пролива) и влей прямо в молоко.","Сверху посыпь паудером Elizabeta (2 г)."]},{"id":"universe","name":"Universe","cat":"specialties","temp":"hot","img":"universe","vessel":"330 мл","ing":[["Эспрессо  сосуд — крем: сливки 50 мл, цитрусовый паудер 10 г, солёная карамель 12 г. Взбей капучинатором до густой кремообразной формы.","Барной ложкой выложи крем поверх основы отдельным слоем.","Сверху — апельсиновый декор."],"method":"Капучинатор, 2 слоя","tip":"Крем должен лежать на поверхности отдельным слоем."}],"drinks_az":[{"id":"espresso","name":"Espresso","cat":"espressobar","temp":"hot","img":"espresso","vessel":"160 ml","ing":[["Espresso","18 q"]],"steps":["18 q qəhvəni espresso üyütməsində üyüt.","Espressonu çək: çıxış ~30–40 q, vaxt 25–30 saniyə.","Yanında bir stəkan su ilə ver."],"tip":"Klassik servis — yanında bir stəkan su."},{"id":"latte","name":"Café Latte","cat":"espressobar","temp":"hot","img":"latte","vessel":"280 ml","ing":[["Espresso (single)","18 q"],["Süd","220 ml"]],"steps":["Single espresso (18 q — dabl çəkimin yarısı) çək və 280 ml fincana tök.","220 ml südü 60–65 °C-yə qədər çırp: köpük nazik (~0,5 sm), hamar olsun.","Kontrast üçün espressonun üzərinə bir az süd əlavə et və eyni açıq-qəhvəyi rəngə qədər fırlat.","Qalan südü hamar axınla əlavə et, yüngül latte-art düzəlt."]},{"id":"cappuccino","name":"Cappuccino","cat":"espressobar","temp":"hot","img":"cappuccino","vessel":"280 ml","ing":[["Espresso (dabl)","36 q"],["Süd","200 ml"]],"steps":["Dabl espresso (18 q qəhvədən, çıxış 36 q) çək və 280 ml fincana tök.","200 ml südü 1–1,5 sm kremvari köpük alınana qədər çırp.","Kontrast üçün espressonun üzərinə bir az süd əlavə et və eyni rəngə qədər fırlat.","Qalan südü əlavə et, 1–1,5 sm köpük papağı və yüngül latte-art düzəlt."],"tip":"Quru, iri qabarcıqlı köpük yolverilməzdir."},{"id":"macchiato","name":"Espresso Macchiato","cat":"espressobar","temp":"hot","img":"macchiato","vessel":"80 ml","ing":[["Espresso (single)","18 q"],["Süd","100 ml"]],"steps":["100 ml südü steamerlə sıx, qatı köpük alınana qədər çırp — parlaq, qabarcıqsız, tamamilə hamar olsun. Köpüyü pitcherdə saxla.","Single espresso (18 q — dabl çəkimin yarısı) çək və 80 ml fincana tök."," i su ilə yu, süzülən suyu tök.","18 q qəhvəni tök (EK-43 üyütmə: 10–12).","Suyu 93–94 °C-yə qədər qızdır.","3 mərhələdə tök (cəmi 282 q): 0:00 — 60 q (blum); 1:15-ə qədər — daha 60 q; sonra qalan 162 q.","Süzülməyə qoy. Vaxt: 2,5–3,5 dəq."],"method":"Drip (V60)","tip":"Tez keçirsə → daha narın; ləng gedirsə → daha iri."},{"id":"chemex","name":"Chemex","cat":"manualbrew","temp":"hot","img":"chemex","vessel":"270 ml","ing":[["Filtr qəhvə","18 q"],["Su (93–94 °C)","282 q"],["Chemex filtri","1 əd"]],"steps":["Chemex filtrini qoy, isti su ilə yu, süzülən suyu tök.","18 q qəhvəni tök (EK-43 üyütmə: 13–14, V60-dan bir neçə bölmə iri).","Suyu 93–94 °C-yə qədər qızdır.","3 mərhələdə tök (cəmi 282 q): 0:00 — 60 q (blum); 1:15-ə qədər — daha 60 q; sonra qalan 162 q.","Süzülməyə qoy. Vaxt: 4 dəqiqəyədək."],"method":"Drip (Chemex)","tip":"Tez keçirsə → daha narın; ləng gedirsə → daha iri."},{"id":"cezve","name":"Cezve — Türk qəhvəsi","cat":"manualbrew","temp":"hot","img":"cezve","vessel":"80 ml","ing":[["Qəhvə (cezve üçün, min. üyütmə EK-43)","8 q"],["Su","65 ml"],["Şəkər","istəyə görə"],["Lokum","2 əd"]],"steps":["8 q qəhvəni (cezve üçün) EK-43-də ən narın üyütmədə — un kimi — üyüt.","Əvvəlcə cezvəyə quru hissələri tök: üyüdülmüş qəhvə + qonağın istəyinə görə şəkər.","65 ml soyuq su əlavə et və qarışdır.","Cezvəni qumun üstünə qoy və qarışdırmadan yavaş-yavaş qızdır.","Köpük qalxmağa başlayan kimi — qaynamağa qoymadan — götür.","80 ml fincana köpüklə birlikdə tök. 2 lokum və su ilə ver."],"tip":"Şəkər — istəyə görə 1–3 paket, sudan əvvəl qəhvə ilə əlavə olunur. Həmişə qonaqdan soruş."},{"id":"raf","name":"Raf","cat":"espressobar","temp":"hot","img":"raf","vessel":"330 ml","ing":[["Espresso (dabl)","36 q"],["Süd","160 ml"],["Krem","50 q"],["Qəhvəyi şəkər","15 q"]],"steps":["Bütün inqredientləri birlikdə pitcherə əlavə et: dabl espresso (18 q qəhvədən, çıxış 36 q), süd 160 ml, krem 50 q, qonur şəkər 15 q. Bir az qəhvə art üçün saxla.","Steamerdə qızdırıb süd köpüyü alınana qədər duğu kimi nazik köpüyə qədər çırpılır və latte-art düzəldilərək fincana tökülür. Çalınmış krem — qonağın istəyinə görə (Mocha, Mocha Caramel). Mocha Amaretto-da Amaretto Disaronno artıq fincanda şokolad sousu və espresso ilə birlikdə qarışdırılır, ayrıca tökülmür. Şokolad sousu ilə espresso qarışığı kofe maşınının buxar borusunda bir az qızdırılmalıdır ki, içki isti alınsın. Iced Mocha eyni məntiqlə hazırlanır (şokolad sousu + espresso hamar kütləyə qədər, süd, buzla şeyk) — dəyişiklik yoxdur."]},"changed":["mocha","mochacaramel","mochaamaretto","icedmocha"]},{"id":"c-20260824-3","date":"24.08.2026","type":"fix","title":{"ru":"Flat White — двойной ристретто вместо эспрессо","az":"Flat White — espresso əvəzinə dabl ristretto"},"items":{"ru":["Для Flat White эспрессо (18 г) варим как двойной ристретто — останавливаем экстракцию на пару секунд раньше обычного, чтобы получить выход 30–33 г и не добавлять лишнюю горечь. Дальше готовим как раньше: тонкая пена молока (≤0,5 см), контрастное вливание и лёгкий латте-арт."],"az":["Flat White üçün espresso (18 q) dabl ristretto kimi çəkilir — çıxış 30–33 q olsun deyə ekstraksiya adətdən bir neçə saniyə əvvəl dayandırılır ki, artıq acılıq olmasın. Davamı əvvəlki kimi: nazik süd köpüyü (≤0,5 sm), kontrastlı tökmə və yüngül latte-art."]},"changed":["flatwhite"]},{"id":"c-20260824-1","date":"24.08.2026","type":"fix","title":{"ru":"Milky Chocolate и Chocolate Pie — переход на шоколадный соус","az":"Milky Chocolate və Chocolate Pie — şokolad sousuna keçid"},"items":{"ru":["Milky Chocolate: вместо шоколада теперь шоколадный соус (заготовка) 70 г. Молоко, шоколадный соус и сливки добавляем в питчер вместе и взбиваем стимером до однородной массы с ровной пеной — без отдельного подогрева и размешивания ложкой. Дальше как раньше: переливаем в чашку и украшаем двумя маршмеллоу.","Chocolate Pie: вместо шоколада теперь шоколадный соус (заготовка) 50 г. В блендер — молоко, мороженое, шоколадный соус и бо́льшую часть Oreo, пробить до однородности. Сверху — взбитые сливки и декор из раскрошенного Oreo, как раньше."],"az":["Milky Chocolate: şokolad əvəzinə indi şokolad sousu (yarımfabrikat) 70 q. Süd, şokolad sousu və krem birlikdə pitcherə əlavə olunur və steamerdə hamar kütlə və bərabər köpük alınana qədər çırpılır — ayrıca qızdırma və qaşıqla qarışdırma yoxdur. Davamı əvvəlki kimi: fincana tökülür və iki marşmelou ilə bəzədilir.","Chocolate Pie: şokolad əvəzinə indi şokolad sousu (yarımfabrikat) 50 q. Blenderə — süd, dondurma, şokolad sousu və Oreo-nun böyük hissəsi, hamar olana qədər çəkilir. Üstünə — çalınmış krem və əzilmiş Oreo dekoru, əvvəlki kimi."]},"changed":["milkychoco","chocopie"]},{"id":"c-20260821-6","date":"21.08.2026","type":"fix","title":{"ru":"Взбивание сливок: Captain Irish и Coldy Mix","az":"Kremin çırpılması: Captain Irish və Coldy Mix"},"items":{"ru":["Captain Irish: сливки (50 г) взбиваем на капучинаторе и выкладываем сверху уже готового напитка (после того как ромово-кофейная смесь перелита в Brew Glass).","Coldy Mix: та же логика — после шейка и переливания в Martini Glass сливки (50 г) взбиваем на капучинаторе и добавляем сверху."],"az":["Captain Irish: krem (50 q) kapuçinatorla çırpılır və hazır içkinin (rom-qəhvə qarışığı Brew Glass-a töküldükdən sonra) üstünə qoyulur.","Coldy Mix: eyni məntiq — şeyk edib Martini Glass-a süzdükdən sonra krem (50 q) kapuçinatorla çırpılır və üstünə əlavə edilir."]},"changed":["captainirish","coldymix"]},{"id":"c-20260821-5","date":"21.08.2026","type":"fix","title":{"ru":"Espresso Macchiato — классический метод","az":"Espresso Macchiato — klassik üsul"},"items":{"ru":["Молоко (100 мл) взбиваем паром до плотной, пышной пены — глянцевой, без пузырей, идеально гладкой — и оставляем в питчере.","Варим один одинарный эспрессо (18 г) прямо в чашку 80 мл — без добавления молока в сам напиток.","Ложкой выкладываем пену горкой точно по центру: по краям остаётся видна крема, в середине — аккуратная белая шапочка.","Молоко не перемешиваем с эспрессо и не льём латте-артом — именно так, «с пятном» молочной пены, и выглядит классический Espresso Macchiato. Подаём со стаканом воды рядом.","Исключение — постоянные гости, которые привыкли к прежнему варианту с лёгким латте-артом: по их просьбе можно приготовить именно так."],"az":["Süd (100 ml) steamerlə sıx, qatı və parlaq köpük alınana qədər çırpılır — qabarcıqsız, tamamilə hamar — və pitcherdə saxlanılır.","Tək espresso (18 q) birbaşa 80 ml fincana çəkilir — içkinin özünə süd əlavə edilmir.","Qaşıqla köpük dəqiq ortaya təpəcik kimi qoyulur: kənarlarda krema görünür, ortada səliqəli ağ papaq qalır.","Süd espresso ilə qarışdırılmır və latte-art edilmir — məhz bu «ləkəli» köpük görünüşü klassik Espresso Macchiato-nun əlamətidir. Yanında bir stəkan su ilə verilir.","İstisna — əvvəlki yüngül latte-art variantına öyrəşmiş daimi qonaqlar: onların istəyi ilə məhz o üsulla da hazırlana bilər."]},"changed":["macchiato"]},{"id":"c-20260821-2","date":"21.08.2026","type":"fix","title":{"ru":"Подача Affogato","az":"Affogato-nun verilməsi"},"items":{"ru":["Эспрессо к Affogato подаётся отдельно, в соуснике — гость сам решает, сколько кофе добавить к мороженому."],"az":["Affogato-ya espresso ayrıca, sous qabında verilir — dondurmaya nə qədər qəhvə əlavə edəcəyini qonaq özü seçir."]},"changed":["affogato"]}];

let unseenChanges=0, changedSet=new Set(), newSet=new Set();
(function(){
  const seenId=lsGet('sensum_seen_change');
  if(seenId===null){ lsSet('sensum_seen_change', CHANGELOG[0]?CHANGELOG[0].id:''); unseenChanges=0; }
  else{
    const idx=CHANGELOG.findIndex(c=>c.id===seenId);
    const freshOnes = idx===-1 ? [] : CHANGELOG.slice(0, idx);
    unseenChanges=freshOnes.length;
    freshOnes.forEach(c=>{ if(c.type==='fix') (c.changed||[]).forEach(x=>changedSet.add(x)); else if(c.type==='news') (c.changed||[]).forEach(x=>newSet.add(x)); });
  }
})();
function updateAppBadge(){
  try{
    if(!('setAppBadge' in navigator))return;
    if(unseenChanges>0){ navigator.setAppBadge(unseenChanges).catch(function(){}); }
    else{ navigator.clearAppBadge().catch(function(){}); }
  }catch(e){}
}
function markChangesSeen(){
  if(!unseenChanges)return;
  unseenChanges=0; changedSet.clear();
  lsSet('sensum_seen_change', CHANGELOG[0]?CHANGELOG[0].id:'');
  const d=document.getElementById('changesdot'); if(d)d.style.display='none';
  updateAppBadge();
  renderDrinks(); renderPreps(); renderVit();
}
function upperLocale(s){ if(LANG==='az'){ return s.replace(/i/g,'İ').replace(/ı/g,'I').toUpperCase(); } return s.toUpperCase(); }
function changedChips(changed){
  if(!changed||!changed.length)return '';
  const vitIds=changed.filter(id=>vitById[id]), many=vitIds.length>3;
  let chips=changed.filter(id=>!(many&&vitById[id])).map(id=>{
    const d=drinkById[id], p=prepById[id], v=vitById[id], item=d||p||v;
    if(!item)return '';
    const icon=d?'☕':v?(VIT_ICON[id]||VIT_CAT_ICON[v.cat]):(PREP_ICON[id]||'✦');
    return `<span class="chchip" data-open="${id}">${icon} ${item.name}</span>`;
  }).filter(Boolean).join('');
  if(many)chips+=`<span class="chchip" data-gotab="vitrina">🥐 ${T('nav_vitrina')} (${vitIds.length})</span>`;
  if(!chips)return '';
  return `<div class="hint" style="margin:12px 0 4px">${T('chg_related')}</div><div class="usedin">${chips}</div>`;
}
function renderChanges(){
  const wrap=document.getElementById('changesgrid');
  if(!CHANGELOG.length){ wrap.innerHTML=`<p class="hint">${T('changes_empty')}</p>`; return; }
  wrap.innerHTML=CHANGELOG.map(c=>{
    const typeLabel=upperLocale(c.type==='news'?T('lbl_news'):T('lbl_fix'));
    const title=c.title?(c.title[LANG]||c.title.ru):'';
    const items=(c.items&&(c.items[LANG]||c.items.ru))||[];
    return `<div class="rel">
      <span class="chtype ${c.type==='news'?'news':'fix'}">${typeLabel}</span><span class="date">${c.date}</span>
      ${title?`<h3 class="serif" style="margin:6px 0 4px;font-size:15px">${title}</h3>`:''}
      <ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul>
      ${changedChips(c.changed)}
    </div>`;
  }).join('');
}

/* ---- drink cards ---- */
function drinkCard(d){
  const im=img(d.img);
  const ph=im?`<div class="ph"><img loading="lazy" src="${im}" alt=""></div>`
             :`<div class="ph noimg" style="background:linear-gradient(135deg,#b5723a,#8f571f)"><span>${initial(d.name)}</span></div>`;
  const badge = newSet.has(d.id)?`<span class="newr">${T('lbl_newitem')}</span>`:(changedSet.has(d.id))?`<span class="newr">${T('lbl_updated')}</span>`:`<span class="tbadge ${d.temp}">${d.temp==='hot'?'HOT':'COLD'}</span>`;
  return `<div class="card" data-open="${d.id}">${ph}${badge}
    <button class="fav ${favs.has(d.id)?'on':''}" data-fav="${d.id}">${favs.has(d.id)?'★':'☆'}</button>
    <div class="body"><h3 class="serif">${d.name}</h3><div class="meta">${CATS[d.cat]} · ${d.vessel}</div></div></div>`;

function drinkMatch(d){
  if(state.temp!=='all'&&d.temp!==state.temp)return false;
  if(state.cat!=='all'&&d.cat!==state.cat)return false;
  if(state.qDrinks){const q=state.qDrinks.toLowerCase();
    const hay=(d.name+' '+CATS[d.cat]+' '+d.ing.map(i=>i[0]).join(' ')).toLowerCase();
    if(!hay.includes(q))return false;}
  return true;
}
function renderDrinks(){
  const l=drinks.filter(drinkMatch);
  document.getElementById('grid').innerHTML=l.map(drinkCard).join('');
  document.getElementById('count').textContent=l.length+' '+(LANG==='ru'?plural(l.length,'напиток','напитка','напитков'):'içki');

function plural(n,a,b,c){const t=Math.abs(n)%100,o=n%10; if(t>10&&t<20)return c; if(o>1&&o<5)return b; if(o===1)return a; return c;}

/* ---- detail sheets ---- */
function ingRows(list){
  return list.map(([n,q])=>{const pid=prepFor(n);
    const nm=pid?`<span class="prep-link" data-openitem="${pid}">${n}</span>`:n;
    return `<tr><td>${nm}</td><td class="q">${q}</td></tr>`;}).join('');

function openItem(id){ if(drinkById[id])openDrink(id); else if(prepById[id])openPrep(id); else if(vitById[id])openVit(id); }
/* ---- spotlight: a new drink pinned above «Напитки» until `end`; sales start on `start` (local dates, YYYY-MM-DD) ---- */
const SPOTLIGHT=[{"id":"lotuslatte","start":"2026-11-01","end":"2026-11-30"}];
function isoToday(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
function spotFor(id){const t=isoToday();return SPOTLIGHT.find(s=>s.id===id&&t<=s.end)||null;}
function dayMonth(iso){const [,m,d]=iso.split('-').map(Number);return `${d} ${T('months').split(',')[m-1]}`;}
let spotHTML=null;
function renderSpot(){
  const el=document.getElementById('spot-drinks'); if(!el)return;
  const t=isoToday(), s=SPOTLIGHT.find(x=>t<=x.end&&drinkById[x.id]), d=s&&drinkById[s.id];
  let h='';
  if(d&&!state.qDrinks&&drinkMatch(d)){ /* hidden while searching or when the filters exclude it */
    const on=t>=s.start, im=img(d.img), ing=d.ing.slice(0,4).map(i=>i[0].replace(/\s*\(.*?\)/g,'')).join(' · ');
    h=`<div class="spot" data-open="${d.id}">${im?`<img src="${im}" alt="">`:''}
      <div class="sx"><span class="sb">${upperLocale(T('lbl_newitem'))}</span>
        <div class="sn serif">${d.name}</div><div class="si">${ing}</div>
        <div class="sf"><span class="pst${on?' on':''}">${LT(on?'spot_on':'spot_soon',{d:dayMonth(s.start)})}</span><span class="sgo">${T('spot_open')} ›</span></div></div></div>`;
  }
  if(h!==spotHTML){spotHTML=h;el.innerHTML=h;}
}
/* ---- promotions ---- */
function promoStatus(p){
  const n=new Date(), day=n.getDay(), m=n.getHours()*60+n.getMinutes();
  const tm=t=>{const a=t.split(':');return (+a[0])*60+(+a[1]);}, f=tm(p.from), e=tm(p.to);
  if(p.days.indexOf(day)<0)return{k:'day',t:p.daysOnly};
  if(m>=f&&m<e)return{k:'now',t:T('promo_now')};
  if(m<f)return{k:'later',t:T('promo_later').replace('{t}',p.from)};
  return{k:'ended',t:T('promo_ended')};
}
function promoCard(p){
  const st=promoStatus(p);
  return `<div class="promo${st.k==='now'?' now':''}" data-promo="${p.id}">
    <div class="pn serif">${p.icon} ${p.name}</div><div class="ps">${p.sub}</div>
    <div class="pp">${p.price}</div><div class="pt">${p.timeText} · ${p.daysText}</div>
    ${p.branches?`<div class="pb">📍 ${p.branches}</div>`:''}
    <span class="pst${st.k==='now'?' on':''}">${st.t}</span></div>`;
}
/* active now first, then the ones starting later today (soonest first), then ended today or not today; ties keep data order */
const PROMO_RANK={now:0,later:1,ended:2,day:2};
function promosSorted(){
  return promos.map((p,i)=>({p,i,k:promoStatus(p).k}))
    .sort((a,b)=>PROMO_RANK[a.k]-PROMO_RANK[b.k]||(a.k==='later'?a.p.from.localeCompare(b.p.from):0)||a.i-b.i)
    .map(x=>x.p);
}
let promoOrder='';
function renderPromos(){
  const l=promosSorted(); promoOrder=l.map(p=>p.id).join();
  const h=l.length?`<div class="promos"><div class="ptitle">${T('promo_title')}</div><div class="prow">${l.map(promoCard).join('')}</div></div>`:'';
  ['promos-drinks','promos-vit'].forEach(id=>{const e=document.getElementById(id);if(e)e.innerHTML=h;});
}
function tickPromos(){
  if(promosSorted().map(p=>p.id).join()!==promoOrder)return renderPromos(); /* a promo started or ended: reorder */
  promos.forEach(p=>{const st=promoStatus(p);
    document.querySelectorAll('.promo[data-promo="'+p.id+'"]').forEach(c=>{
      c.classList.toggle('now',st.k==='now');
      const b=c.querySelector('.pst'); b.classList.toggle('on',st.k==='now'); b.textContent=st.t;});});
}
function openPromo(id){
  const p=promos.find(x=>x.id===id); if(!p)return; const st=promoStatus(p);
  const chip=pid=>{const it=drinkById[pid]||vitById[pid];return it?`<span class="chchip" data-openitem="${pid}">${it.name}</span>`:'';};
  const parts=p.parts.map(pt=>`<h4 class="sec">${pt.title}</h4><div class="usedin">${pt.ids.map(chip).join('')}${(pt.extra||[]).map(x=>`<span class="chchip" style="cursor:default">${x}</span>`).join('')}</div>`).join('');
  let spec=`<div class="p"><b>${T('promo_price')}</b>${p.price}</div><div class="p"><b>${T('promo_time')}</b>${p.timeText}</div><div class="p"><b>${T('promo_days')}</b>${p.daysText}</div>`;
  if(p.branches)spec+=`<div class="p"><b>${T('promo_branches')}</b>${p.branches}</div>`;
  document.getElementById('sheetInner').innerHTML=`
    <div class="hero noimg" style="background:linear-gradient(135deg,#b5723a,#7d4a1e)"><span style="font-size:62px">${p.icon}</span><div class="grad"></div>
      <div class="ttl"><h2 class="serif">${p.name}</h2><div class="c">${p.sub}</div></div>
      <button class="close" data-close>×</button></div>
    <div class="content">
      <div class="spec">${spec}</div>
      <span class="pst${st.k==='now'?' on':''}" style="margin:2px 0 4px">${st.t}</span>
      ${parts}
      ${(p.notes||[]).map(n=>`<div class="note">${n}</div>`).join('')}
    </div>`;
  showOverlay();
}
function vitAlg(v){
  const a=v.alg||{has:[],may:[]}, lab=k=>ALG[k]||k, byOrd=(x,y)=>ALG_ORDER.indexOf(x)-ALG_ORDER.indexOf(y);
  const has=[...a.has].sort(byOrd).map(lab), may=[...a.may].sort(byOrd).map(lab);
  let h='';
  if(has.length)h+=`<div><b>${T('alg_has')}:</b> ${has.join(', ')}</div>`;
  if(may.length)h+=`<div style="margin-top:4px"><b>${T('alg_may')}:</b> ${may.join(', ')}</div>`;
  if(!has.length&&!may.length)h+=`<div>${T('alg_none')}</div>`;
  (v.anote||[]).forEach(n=>{h+=`<div class="hint" style="margin-top:6px">${n}</div>`;});
  return `<h4 class="sec">${T('sec_allergens')}</h4><div class="note" style="margin-top:0">${h}</div><p class="hint">${T('alg_hint')}</p>`;
}
/* spec chip; labels go through upperLocale (AZ İ/ı) instead of the CSS uppercase */
function specChip(label,val){return `<div class="p"><b style="text-transform:none">${upperLocale(label)}</b>${val}</div>`;}
const decComma=x=>String(x).replace('.',',');
function vitFacts(v){
  const c=[];
  if(v.wt)c.push(specChip(T('lbl_weight'),`${v.wt} ${T('u_g')}`));
  if(v.stor)c.push(specChip(T('lbl_storage'),LT('stor_range',{a:v.stor[0],b:v.stor[1]})));
  if(v.life){const [n,u]=v.life, w=T('u_'+u).split(',');
    c.push(specChip(T('lbl_shelf'),`${n} ${w.length===3?plural(n,w[0],w[1],w[2]):w[0]}`));}
  return c;
}
function vitNut(v){
  if(v.kcal==null&&!v.nut)return '';
  const c=[];
  if(v.kcal!=null)c.push(specChip(T('lbl_kcal'),`${decComma(v.kcal)} ${T('u_kcal')}`));
  if(v.nut)['lbl_protein','lbl_fat','lbl_carbs'].forEach((k,i)=>c.push(specChip(T(k),`~${decComma(v.nut[i])} ${T('u_g')}`)));
  return `<h4 class="sec">${T('sec_nutrition')}</h4><div class="spec">${c.join('')}</div>`;
}
function openVit(id){
  const v=vitById[id]; if(!v)return; const im=v.img?img(v.img):null, ic=VIT_ICON[v.id]||VIT_CAT_ICON[v.cat];

function lockBodyScroll(){
  /* the page itself never scrolls (html/body are overflow:hidden) — only #scrollArea
     does, so locking it is a plain overflow toggle: no root-scroller rubber-band
     quirks to fight, and scrollTop is preserved automatically while hidden.
     touch-action:none is added on top as a hard guarantee against native touch-scroll
     on some WebKit versions, since the overlay already covers the full screen anyway. */
  const sa=document.getElementById('scrollArea');
  sa.style.overflow='hidden'; sa.style.touchAction='none';
}
function unlockBodyScroll(){

}

/* drag-to-dismiss (свайп рукой вниз с любой точки карточки, независимо от прокрутки) */
(function(){
  const sheet=document.getElementById('sheet');
  let active=false, armed=false, startY=0, dy=0;
  const ARM_THRESHOLD=8;
  function onDown(e){
    if(e.target.closest('.close'))return;
    active=true; armed=false; startY=e.clientY; dy=0;
  }
  function onMove(e){
    if(!active)return;
    if(!armed){
      const rawDy=e.clientY-startY;
      if(rawDy>0){
        /* claim the gesture as early as possible (even below the arm threshold) so
           native rubber-band scrolling never gets a chance to take over on iOS —
           any downward drag closes the card, from any point, at any scroll position */
        e.preventDefault();
        if(rawDy>ARM_THRESHOLD){
          armed=true; startY=e.clientY; dy=0;
          sheet.classList.add('dragging');
          try{ sheet.setPointerCapture(e.pointerId); }catch(err){}
        }
      }
      return;
    }
    dy=e.clientY-startY; if(dy<0)dy=0;
    e.preventDefault();
    sheet.style.transform='translateY('+dy+'px)';
  }
  function onUp(){
    if(!active)return;
    active=false;
    if(!armed)return;
    armed=false;
    sheet.classList.remove('dragging');
    const threshold=Math.min(140, sheet.clientHeight*0.28);
    if(dy>threshold){
      sheet.style.transition='transform .2s ease';
      sheet.style.transform='translateY(100%)';
      setTimeout(()=>{ hideOverlay(); sheet.style.transition=''; sheet.style.transform=''; }, 180);
    } else {
      sheet.style.transition='transform .22s cubic-bezier(.2,.8,.2,1)';
      sheet.style.transform='translateY(0)';
      setTimeout(()=>{ sheet.style.transition=''; }, 230);
    }
    dy=0;
  }
  sheet.addEventListener('pointerdown', onDown);
  sheet.addEventListener('pointermove', onMove, {passive:false});
  sheet.addEventListener('pointerup', onUp);
  sheet.addEventListener('pointercancel', onUp);
})();

/* photo viewer: pinch / drag / double-tap zoom on the photo only */
(function(){
  const pv=document.getElementById('photoView'), im=pv.querySelector('img');
  const MAX=5; let s=1,tx=0,ty=0,g=null,moved=false,lastTap=0; const pts=new Map();
  function fit(){const vw=pv.clientWidth,vh=pv.clientHeight,nw=im.naturalWidth||vw,nh=im.naturalHeight||vh,k=Math.min(vw/nw,vh/nh);return{vw,vh,w:nw*k,h:nh*k};}
  function apply(){const f=fit(),mx=Math.max(0,(f.w*s-f.vw)/2),my=Math.max(0,(f.h*s-f.vh)/2);
    tx=Math.max(-mx,Math.min(mx,tx));ty=Math.max(-my,Math.min(my,ty));
    im.style.transform='translate('+tx+'px,'+ty+'px) scale('+s+')';}
  function reset(){s=1;tx=0;ty=0;im.style.transform='';}
  function mid(){const a=[...pts.values()];return a.length===2?{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}:{x:a[0].x,y:a[0].y,d:0};}
  function begin(){const m=mid();g={x:m.x,y:m.y,d:m.d,s:s,tx:tx,ty:ty};}
  function zoomAt(ns,px,py,b){const cx=pv.clientWidth/2,cy=pv.clientHeight/2;ns=Math.max(1,Math.min(MAX,ns));const k=ns/b.s;
    tx=(px-cx)-k*(b.x-cx-b.tx);ty=(py-cy)-k*(b.y-cy-b.ty);s=ns;}
  window.openPhoto=function(src){reset();im.src=src;pv.classList.add('show');};
  window.closePhoto=function(){pv.classList.remove('show');pts.clear();g=null;reset();};
  pv.addEventListener('pointerdown',e=>{
    if(e.target.closest('.pclose'))return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    try{pv.setPointerCapture(e.pointerId);}catch(err){}
    if(pts.size===1)moved=false; begin();
  });
  pv.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)||!g)return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const m=mid();
    if(pts.size>1||Math.hypot(m.x-g.x,m.y-g.y)>8)moved=true;
    if(pts.size>=2&&g.d>0){zoomAt(g.s*m.d/g.d,m.x,m.y,g);apply();}
    else if(s>1){tx=g.tx+(m.x-g.x);ty=g.ty+(m.y-g.y);apply();}
  });
  function up(e){
    if(!pts.has(e.pointerId))return;
    const tap=pts.size===1&&!moved&&e.type==='pointerup';
    const x=e.clientX,y=e.clientY;
    pts.delete(e.pointerId);
    if(pts.size>0)begin(); else g=null;
    if(pts.size===0&&s<1.05)reset();
    if(!tap)return;
    const now=Date.now();
    if(now-lastTap<300){
      lastTap=0;
      im.style.transition='transform .2s ease';
      if(s>1)reset(); else{zoomAt(2.5,x,y,{x:x,y:y,s:1,tx:0,ty:0});apply();}
      setTimeout(()=>{im.style.transition='';},220);
    }else{
      lastTap=now;
      if(s===1){const f=fit();if(Math.abs(x-f.vw/2)>f.w/2||Math.abs(y-f.vh/2)>f.h/2)closePhoto();}
    }
  }
  pv.addEventListener('pointerup',up);
  pv.addEventListener('pointercancel',up);
})();

/* -- question generators -- */
const QRX=/^(\d+(?:[.,]\d+)?)\s*(г|мл|шт|q|ml|əd)$/, DECOR=/декор|dekor/i;
function parseQ(q){const m=QRX.exec((q||'').trim());return m?{n:parseFloat(m[1].replace(',','.')),u:m[2],comma:m[1].includes(',')}:null;}
function niceNum(n,u){if(u==='шт'||u==='əd')return Math.max(1,Math.round(n));if(n>=100)return Math.round(n/10)*10;if(n>=20)return Math.round(n/5)*5;if(n>=3)return Math.round(n);return Math.round(n*2)/2;}
function fmtNum(n,comma){const s=String(Math.round(n*10)/10);return comma?s.replace('.',','):s;}
function ingPool(){return [...drinks,...preps].flatMap(x=>x.ing||[]);}
function ingFreq(){const f={};ingPool().forEach(([n])=>{const k=n.toLowerCase();f[k]=(f[k]||0)+1;});return f;}
function firstWord(s){return (s.toLowerCase().match(/[a-zа-яёəıöüçşğ]+/i)||[''])[0];}
function mkQ(type,x,text,correct,wrong,explain,im){
  if(!wrong||wrong.length<3)return null;
  return {type,id:x.id,isPrep:!!x.kind,text,correct,opts:shuffle([correct,...wrong.slice(0,3)]),explain,img:im||null};
}
function distinctNames(list,exclude,n){
  const out=[],seen=new Set(exclude.map(s=>s.toLowerCase()));
  for(const s of list){const k=s.toLowerCase();if(!seen.has(k)){seen.add(k);out.push(s);if(out.length>=n)break;}}
  return out;
}
function genDose(x){
  for(const [n,q] of shuffle(x.ing.filter(([n,q])=>!DECOR.test(n)&&parseQ(q)))){
    const p=parseQ(q), seen=new Set([p.n]), out=[];
    /* first: real doses of the same ingredient elsewhere (the confusions that actually happen) */
    shuffle(ingPool().filter(([m])=>m.toLowerCase()===n.toLowerCase()).map(([,qq])=>parseQ(qq)))
      .forEach(r=>{if(r&&r.u===p.u&&!seen.has(r.n)&&out.length<2){seen.add(r.n);out.push(r.n);}});
    for(const k of shuffle([0.5,0.6,0.75,1.25,1.4,1.5,2])){if(out.length>=3)break;const v=niceNum(p.n*k,p.u);if(v>0&&!seen.has(v)){seen.add(v);out.push(v);}}
    for(let s=1;out.length<3&&s<20;s++)[p.n+s,p.n-s].forEach(v=>{if(out.length<3&&v>0&&!seen.has(v)){seen.add(v);out.push(v);}});
    const q2=mkQ('dose',x,LT('q_dose',{item:x.name,ing:n}),q,out.map(v=>fmtNum(v,p.comma)+' '+p.u),`${n} — ${q}`);
    if(q2)return q2;
  }
  return null;
}
function genComp(x){
  const cands=x.ing.filter(([n])=>!DECOR.test(n)); if(!cands.length)return null;
  const f=ingFreq(), right=shuffle(cands).sort((a,b)=>(f[a[0].toLowerCase()]||0)-(f[b[0].toLowerCase()]||0))[0][0];
  const own=x.ing.map(i=>i[0]), ownW=new Set(own.map(firstWord));
  const group=x.kind?preps:drinks, same=group.filter(o=>o!==x&&(x.kind?o.kind===x.kind:o.cat===x.cat));
  const names=[...shuffle(same),...shuffle(group.filter(o=>o!==x))].flatMap(o=>o.ing.map(i=>i[0]))
    .filter(n=>!DECOR.test(n)&&!ownW.has(firstWord(n)));
  return mkQ('comp',x,LT('q_comp',{item:x.name}),right,distinctNames(names,own,3),own.filter(n=>!DECOR.test(n)).join(', '));
}
function genPhoto(x){
  if(x.kind||!x.img||!img(x.img))return null;
  const pool=[...shuffle(drinks.filter(d=>d.cat===x.cat)),...shuffle(drinks.filter(d=>d.temp===x.temp)),...shuffle(drinks)]
    .filter(d=>d!==x&&imgHash(d.img)!==imgHash(x.img)).map(d=>d.name); /* some drinks share one photo under different file names (e.g. the Raf family); the hash in the name is the content */
  return mkQ('photo',x,LT('q_photo'),x.name,distinctNames(pool,[x.name],3),x.name,x.img);
}
function genVessel(x){
  if(x.kind)return null;
  return mkQ('vessel',x,LT('q_vessel',{item:x.name}),x.vessel,distinctNames(shuffle(drinks.map(d=>d.vessel)),[x.vessel],3),`${T('lbl_vessel')}: ${x.vessel}`);
}
function genShelf(x){
  if(!x.kind||!x.shelf||x.shelf==='—')return null;
  return mkQ('shelf',x,LT('q_shelf',{item:x.name}),x.shelf,distinctNames(shuffle(preps.map(p=>p.shelf).filter(s=>s!=='—')),[x.shelf],3),`${T('lbl_shelf')}: ${x.shelf}`);
}
function genStorage(x){
  if(!x.kind||!x.storage)return null;
  return mkQ('storage',x,LT('q_storage',{item:x.name}),x.storage,distinctNames(shuffle(preps.map(p=>p.storage).filter(Boolean)),[x.storage],3),`${T('lbl_storage')}: ${x.storage}`);
}
function genUsed(x){
  if(!x.kind)return null;
  const used=(x.usedin||[]).map(u=>u[2]).filter(id=>drinkById[id]); if(!used.length)return null;
  const trig=x.trig&&x.trig!=='§нет§'?x.trig:null;
  /* a drink that mentions the prep in its ingredients is never offered as a wrong answer, even if usedin forgot it */
  const bad=drinks.filter(d=>!used.includes(d.id)&&!(trig&&d.ing.some(([n])=>n.toLowerCase().includes(trig)))).map(d=>d.name);
  const right=drinkById[pick(used)].name;
  return mkQ('used',x,LT('q_used',{item:x.name}),right,distinctNames(shuffle(bad),[right],3),used.map(id=>drinkById[id].name).join(', '));
}
const GEN={dose:genDose,comp:genComp,photo:genPhoto,vessel:genVessel,shelf:genShelf,storage:genStorage,used:genUsed};
function weighted(w){let t=w.reduce((s,a)=>s+a[1],0)*Math.random();for(const [k,v] of w){if((t-=v)<0)return k;}return w[0][0];}
function buildQuiz(items,scope=L.scope,n=10){
  const N=Math.min(n,items.length*3), qs=[], keys=new Set();
  const W=scope==='preps'?[['dose',4],['comp',2],['shelf',3],['used',3],['storage',1]]:[['dose',4],['comp',3],['photo',3],['vessel',1]];
  let order=shuffle(items), oi=0;
  for(let guard=0;qs.length<N&&guard<500;guard++){
    if(oi>=order.length){order=shuffle(items);oi=0;}
    const x=order[oi++], q=GEN[weighted(W)](x); if(!q)continue;
    const k=q.type+':'+q.id+':'+q.correct; if(keys.has(k))continue;
    keys.add(k); qs.push(q);
  }
  return qs;
}

  if(!RESULTS_URL||!LS.me||statsBusy)return;

  api({action:'me',code:LS.me.code}).then(r=>{
    statsBusy=false;
    if(r&&r.ok&&typeof r.xp==='number'){LS.stats=Object.assign(r,{at:Date.now()});L.noGame=false;saveLearn();}
    else if(r&&r.ok){L.noGame=true;}  /* the sheet runs a script older than v5: no game yet, tests work as before */

    else return;

  },()=>{statsBusy=false;});
}

/* -- actions -- */
function startCards(){
  const items=learnItems(); if(!items.length)return;
  /* weakest first (Leitner box), random inside a box */
  const deck=shuffle(items).sort((a,b)=>boxOf(a)-boxOf(b)).slice(0,20);
  L.fc={deck:deck.map(x=>x.id),isPrep:L.scope==='preps',i:0,flipped:false,know:[],again:[],requeued:new Set()};
  L.view='cards'; renderLearn(); toTop();
}
function flipCard(){
  const el=document.querySelector('#learnroot .fc');
  const show=()=>{L.fc.flipped=true;renderLearn();const n=document.querySelector('#learnroot .fc');
    if(n){n.classList.add('turn');requestAnimationFrame(()=>requestAnimationFrame(()=>n.classList.remove('turn')));}};
  if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches){L.fc.flipped=true;renderLearn();return;}
  el.classList.add('turn'); setTimeout(show,140);
}
function rateCard(know){
  const f=L.fc, id=f.deck[f.i], x=itemById(id,f.isPrep), k=boxKey(x);
  LS.box[k]=know?Math.min(5,(LS.box[k]||0)+1):0; saveLearn();
  if(know){if(!f.know.includes(id)&&!f.again.includes(id))f.know.push(id);}
  else{if(!f.again.includes(id))f.again.push(id); f.know=f.know.filter(i=>i!==id);
    if(!f.requeued.has(id)){f.requeued.add(id);f.deck.push(id);}}
  f.i++; f.flipped=false;
  L.view=f.i>=f.deck.length?'cardsdone':'cards'; renderLearn(); toTop();
}
function startQuiz(fixed){
  /* with a results sheet connected, a test counts only when we know who took it */
  if(RESULTS_URL&&!LS.me){L.view='home';L.needId=true;L.idMsg='';renderLearn();toTop();const c=document.getElementById('lcode');if(c)c.focus();return;}
  const qs=fixed?shuffle(fixed).map(q=>Object.assign({},q,{opts:shuffle(q.opts)})):buildQuiz(learnItems());
  if(!qs.length)return;
  beginQuiz(qs,fixed?'mix':L.scope,fixed&&L.qz?(L.qz.kind==='exam'?T('r_retry'):L.qz.scope):scopeLabel());
}
/* «Экзамен месяца»: drinks and preps together, one attempt a month (also kept on the phone, so an aborted one counts) */
function startExam(){
  if(!RESULTS_URL||!LS.me||examDone()||!confirm(T('exam_confirm')))return;
  const qs=shuffle(buildQuiz(trainable(drinks),'drinks',EXAM_N.drinks).concat(buildQuiz(trainable(preps),'preps',EXAM_N.preps)));
  LS.examMonth=monthNow(); saveLearn();
  beginQuiz(qs,'exam',T('exam_title'));
}
function beginQuiz(qs,kind,scope){
  const now=Date.now();
  L.qz={qs,i:0,picked:null,score:0,mistakes:[],timeouts:0,away:0,t0:now,deadline:now+QUIZ_SEC*1000,scope,kind,xp0:LS.stats?LS.stats.xp:null};
  if(RESULTS_URL&&LS.me)L.qz.rec={id:newId(),code:LS.me.code,scope,kind,total:qs.length,lang:LANG,ver:APP_VERSION,t0:now};
  liveSave(L.qz);
  L.view='quiz'; renderLearn(); toTop();
}
/* i: the option picked, or -1 when the time ran out, -2 when the app was left while the question was open */
function answer(i){
  const z=L.qz; if(!z||z.picked!==null)return; z.picked=i;
  const q=z.qs[z.i];
  if(i>=0&&q.opts[i]===q.correct)z.score++;
  else{if(i===-1)z.timeouts++; else if(i===-2)z.away++;
    z.mistakes.push({text:q.text,your:i>=0?q.opts[i]:T(i===-1?'q_timeout':'q_away'),correct:q.correct,id:q.id,q});
    /* a wrong answer sends the item back to the start of the flashcard queue */
    const x=itemById(q.id,q.isPrep); if(x){LS.box[boxKey(x)]=0;saveLearn();}}
  liveSave(z); renderLearn();
}
function nextQ(){
  const z=L.qz; z.i++; z.picked=null; z.deadline=Date.now()+QUIZ_SEC*1000;
  if(z.i<z.qs.length){renderLearn();toTop();return;}
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  z.result={score:z.score,total:z.qs.length,scope:z.scope,mistakes:z.mistakes,
    secs:Math.round((Date.now()-z.t0)/1000),timeouts:z.timeouts,away:z.away,
    date:`${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`};
  LS.quiz.unshift({score:z.score,total:z.qs.length,scope:z.scope,date:z.result.date}); LS.quiz=LS.quiz.slice(0,30);
  if(z.rec){liveSave(z);const r=liveSend(z.rec,false);z.result.sendId=r.id;SEND[r.id]='wait';}
  saveLearn();
  L.view='result'; renderLearn(); toTop();
  flushOutbox();
}

/* -- honesty of a test: 15 s per question, leaving the app counts as a wrong answer, leaving the test as aborted -- */
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function mmss(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
/* the attempt as it will be sent, kept in LS.live while it runs: a test closed half-way still reaches the sheet as aborted */
function liveSave(z){
  if(!z||!z.rec)return;
  Object.assign(z.rec,{score:z.score,timeouts:z.timeouts,away:z.away,upd:Date.now(),
    mistakes:z.mistakes.map(m=>({q:m.text,a:m.your,c:m.correct}))});
  LS.live=z.rec; saveLearn();
}
function liveSend(rec,aborted){
  const end=rec.upd||Date.now(), {t0,upd,...r}=rec;
  Object.assign(r,{ts:end,secs:Math.max(0,Math.round((end-t0)/1000)),aborted});
  LS.outbox.push(r); LS.live=null; saveLearn();
  return r;
}
function quizRunning(){return L.view==='quiz'&&!!L.qz;}
/* every way out of a running test asks first; questions left unanswered count as wrong */
function quizGuard(){
  if(!quizRunning())return true;
  if(!confirm(T('q_abort_ask')))return false;
  const z=L.qz; L.qz=null; L.view='home';
  if(z.rec){liveSave(z);liveSend(z.rec,true);flushOutbox();}
  renderLearn(); toTop();
  return true;
}
function quizTick(){
  const z=L.qz; if(L.view!=='quiz'||!z||z.picked!==null)return;
  const left=z.deadline-Date.now();
  if(left<=0){answer(-1);return;}
  const row=document.getElementById('qtrow'); if(!row)return;
  row.classList.toggle('low',left<=5000);
  document.getElementById('qtbar').style.width=(left/(QUIZ_SEC*10))+'%';
  document.getElementById('qtsec').textContent=Math.ceil(left/1000);
}
setInterval(quizTick,200);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&L.view==='quiz'&&L.qz&&L.qz.picked===null)answer(-2);});

/* -- sending results to the trainer's sheet -- */
const SEND={};  // attempt id -> 'wait' | 'sent' | 'queued' | 'rejected' | 'examdone'
const REWARD={};  // attempt id -> {xp, owls:[{why, n}]} as counted by the sheet
let flushing=false;
function api(params,body){
  if(RESULTS_URL==='demo')return new Promise(r=>setTimeout(()=>r(body?{ok:true}:{ok:true,name:T('id_demo'),branch:'Central Park'}),400));
  /* text/plain keeps it a simple request: Apps Script answers without a CORS preflight */
  const req=body?fetch(RESULTS_URL,{method:'POST',body:JSON.stringify(body)}):fetch(RESULTS_URL+'?'+new URLSearchParams(params));
  return req.then(r=>r.json());
}
function showSend(){const r=L.qz&&L.qz.result, el=document.getElementById('sendstat');
  if(L.view==='result'&&r&&el){el.outerHTML=sendStatus(r);} else if(L.view==='home'&&state.tab==='learn')renderLearn();}
async function flushOutbox(){
  if(!RESULTS_URL||flushing||!LS.outbox.length)return;
  flushing=true; let sent=false;
  for(const item of LS.outbox.slice()){
    let res;
    try{res=await api(null,item);}catch(e){SEND[item.id]='queued';break;}  /* offline: keep the rest for later */
    if(res&&res.ok){SEND[item.id]='sent';sent=true;if(res.xp!=null)REWARD[item.id]={xp:res.xp,owls:res.owls||[]};}
    else if(res&&res.error==='exam_done'){SEND[item.id]='examdone';}
    else if(res&&res.error==='unknown_code'){SEND[item.id]='rejected';LS.me=null;}
    else{SEND[item.id]='queued';break;}
    LS.outbox=LS.outbox.filter(x=>x.id!==item.id); saveLearn();
  }
  flushing=false; showSend();
  if(sent)fetchStats();
}
function login(){
  const el=document.getElementById('lcode'), code=(el?el.value:'').replace(/\D/g,'');
  const say=m=>{L.idMsg=m;const s=document.getElementById('idstat');if(s)s.textContent=m;};
  if(!/^\d{4,8}$/.test(code)){say(T('id_bad'));return;}
  say('…');
  api({action:'whoami',code}).then(r=>{
    if(r&&r.ok){LS.me={code,name:r.name,branch:r.branch};LS.stats=null;L.needId=false;L.idMsg='';saveLearn();renderLearn();flushOutbox();}
    else say(T('id_unknown'));
  },()=>say(T('id_offline')));
}
if(LS.live&&LS.live.id&&LS.live.t0)liveSend(LS.live,true); else if(LS.live){LS.live=null;saveLearn();}
window.addEventListener('online',flushOutbox);
flushOutbox();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)flushOutbox();});
document.getElementById('learnroot').addEventListener('click',e=>{
  const b=e.target.closest('[data-l]'); if(!b)return;
  const a=b.dataset.l;
  if(a==='scope'){L.scope=b.dataset.v;L.cat='all';L.kind='all';renderLearn();}
  else if(a==='cat'){L.cat=b.dataset.v;renderLearn();}
  else if(a==='kind'){L.kind=b.dataset.v;renderLearn();}
  else if(a==='cards')startCards();
  else if(a==='quiz')startQuiz();
  else if(a==='flip')flipCard();
  else if(a==='know'||a==='again')rateCard(a==='know');
  else if(a==='ans')answer(+b.dataset.i);
  else if(a==='next')nextQ();
  else if(a==='retry')startQuiz(L.qz.mistakes.map(m=>m.q));
  else if(a==='exit'&&quizRunning())quizGuard();
  else if(a==='home'||a==='exit'){L.view='home';L.fc=null;L.qz=null;renderLearn();toTop();}
  else if(a==='login')login();
  else if(a==='logout'){LS.me=null;LS.stats=null;L.idMsg='';saveLearn();renderLearn();}
  else if(a==='exam')startExam();
  else if(a==='board'){L.board=b.dataset.v;renderLearn();}
});
document.getElementById('learnroot').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lcode')login();});

/* init */
renderSubbars();
renderDrinks(); renderPreps(); renderVit(); renderPromos(); renderFav(); updateAppBadge();
setInterval(()=>{tickPromos();renderSpot();},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tickPromos();renderSpot();}});
