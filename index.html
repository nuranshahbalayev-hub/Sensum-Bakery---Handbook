нги, все возможные виды съёмок и т. д.).","Экспорт.","Изучение дизайнерского ландшафта.","Проведение тимбилдингов в стенах мастерской SENSUM для сторонних компаний (потенциальных клиентов).","Контент-съёмка для бренд-групп."]}]},{"id":"br-coffee","cat":"BR","topic":"BR-2","title":"SENSUM Specialty Coffee","blocks":[{"p":"Мы предлагаем сильный бренд: работаем со всемирно известными поставщиками и опираемся на качественную продукцию местного производства на привлекательных условиях, специально разработанных для каждого канала сбыта. Наш ассортимент будет постоянно расти и оптимизироваться под изменения рынка с учётом потребностей конечных потребителей и интересов клиентов."},{"h":"Уникальное достоинство услуг"},{"ul":["Мы предоставляем кофе класса Specialty.","Мы проводим тренинги международного класса по программе SCA.","Мы можем показать партнёрам производство и отвести их в сервис, где они увидят, как обращаются с их оборудованием."]},{"h":"Гурманы"},{"p":"С быстрым ростом кофейной отрасли появилась категория покупателей — ценители и истинные гурманы этого напитка."},{"h":"На одной волне"},{"p":"Бариста и обслуживающий персонал всё чаще становятся главным «продающим» звеном в компании. Они не просто варят кофе и подносят его, но и поддерживают разговор с гостями: обсуждают не только кофе, но и погоду за окном, чувствуют клиента и «подходят» к нему сугубо индивидуально."},{"h":"Каналы"},{"ul":["Бизнес-кафе","Шоу-рум","Дистрибуция брендов","Цех обжарки кофе"]}]},{"id":"br-roast","cat":"BR","topic":"BR-2","title":"Цех обжарки и техническое обслуживание","blocks":[{"h":"Обжаренное зерно"},{"ul":["Обжаренный кофе для вашего дома и офиса.","Подбор индивидуальных профилей обжарки для вашего бизнеса.","Возможность индивидуального пакетирования под вашим брендом.","Большой выбор упаковок, включая пакеты из перерабатываемого материала.","Молотый кофе в любых объёмах для дома, офиса или бизнеса."]},{"h":"Зелёное зерно"},{"table":{"head":["Категория","Оценка"],"rows":[["Регулярное зерно","80–85"],["Микролоты","85–89"],["Уникальный и экспериментальный кофе","90+"]]}},{"h":"Техническое обслуживание"},{"ul":["Установка и отладка оборудования","Диагностика оборудования","Ремонт профессионального оборудования","Ремонт суперавтоматических и автоматических кофемашин","Профессиональная очистка кофемашин и кофемолок","Декальцинация"]}]},{"id":"br-academy","cat":"BR","topic":"BR-2","title":"Академия SENSUM Education","blocks":[{"p":"Мы проводим курсы повышения квалификации и профессиональных навыков для специалистов в области искусства, кофейной индустрии, флористики, туризма и организации мероприятий. Признанные эксперты и наставники разных отраслей делятся знаниями и учат тонкостям работы, необходимым для хороших результатов."},{"h":"Три направления обучения"},{"ul":[{"b":"Кофе","t":" — обучение персонала по внутренним курсам и по модулям Specialty Coffee Association, регулярные семинары и лекции. Специалисты научат всему: от тонкостей обжарки зёрен до навыков технической поддержки оборудования."},{"b":"Флористика","t":" — признанные эксперты станут проводником в мир красоты и гармонии: композиции воспринимаются не только как произведение искусства, но и как коммерческий продукт для флористического бизнеса."},{"b":"Фото-арт","t":" — узкопрофильные специалисты арт-студии помогут познакомиться с новыми возможностями технической визуализации идей. Двери открыты для всех, кто готов учиться и реализовывать свой потенциал."}]},{"h":"Знания, энергия, эмоции"},{"p":"Знания (IQ), энергия (VQ) и эмоции (EQ) — значимые составляющие успеха. Путь к нему начинается с желания открыться переменам и познать себя заново."}]},{"id":"br-floristry","cat":"BR","topic":"BR-2","title":"SENSUM Floristry","blocks":[{"p":"Мы открываем двери в новый флористический мир, создав полную энциклопедию характеристик всех цветов и их значений. Живые эксклюзивные композиции и гербарий с учётом характера клиента, оформление пространства срезанными, горшечными и искусственными растениями, ландшафтное проектирование."},{"h":"Почему мы"},{"ul":["Персональный подход к каждому клиенту: цветочные композиции с учётом намерений клиента и особенностей характера получателя.","Нестандартный подход: композиции и букеты на основе авторских историй, стереотипов и философии, которые прилагаются к букету в виде печатной продукции.","Креативное решение с помощью гербария (сухоцветов): он не требует особого ухода и прослужит долгие годы.","Итоговый продукт в упаковочном сете: знак качества, вкладыш по уходу, Кризал (жидкая подкормка) и транспортировочная сумка.","Проверенные и надёжные поставщики.","Личный куратор, который берёт на себя ответственность за организацию и ведение значимых дат в установленный период."]},{"note":"Всё, что остаётся вам, — свободно распоряжаться своим временем."},{"h":"Услуги"},{"ul":["Оформление частных мероприятий","Свадебные букеты","Упаковка подарков","Индивидуальная сборка гербарных композиций","Оформление бутиков"]},{"h":"Флористический консьерж"},{"ul":["Ведение базы значимых дат клиента в установленный период по контракту.","Индивидуальный подбор цветов будущих композиций по Энциклопедии характеристик.","Разработка стилевого построения будущих концептуальных композиций.","Подготовка тем индивидуальных историй и писем на выбор клиента.","Концепция и стилистика оформления мероприятий с учётом пожеланий клиента: площадки, техническое обеспечение, интертеймент, видеосъёмка и монтаж, дизайн.","Сборка корпоративного пакета и его составляющих.","Презентация озеленения помещений (тематически, сезонно, событийно) с последующим уходом.","Разработка идей и концепции масштабных мероприятий.","Бесплатная консультация по компетентным вопросам."]},{"h":"Цветовые гаммы"},{"ul":[{"b":"Красная","t":" — алый, коралловый, марсала"},{"b":"Оранжевая","t":" — морковный, терракотовый, янтарный"},{"b":"Жёлтая","t":" — бледно-жёлтый, лимонный, масляный"},{"b":"Зелёная","t":" — лесной зелёный, мята, оливковый"},{"b":"Синяя","t":" — королевский синий, морская волна, голубой"},{"b":"Фиолетовая","t":" — индиго, сиреневый, сливовый"},{"b":"Белая","t":" — бриллиантовый, белый дым, кокос"},{"b":"Чёрная","t":" — серый, фантомный, чёрный"}]}]},{"id":"br-tour-event-photo","cat":"BR","topic":"BR-2","title":"Тур-консьерж, Events и Photo Art","blocks":[{"h":"Nostalgia Tour-Concierge"},{"p":"Путешествия создают новые воспоминания и меняют наше представление о мире. Мы учитываем индивидуальные предпочтения каждого, чтобы сделать путешествие незабываемой историей, уходим от привычного маршрута и открываем мир заново. Твой отдых начинается со звонка в SENSUM!"},{"h":"Universal Event"},{"p":"Индивидуальный подход к организации значимых мероприятий — задача не из простых, но наша команда не сторонится сложностей. Мы воплощаем невероятные идеи и превосходим ожидания, опираясь на знания и опыт, совмещённые с безграничным воображением: фестивали, костюмированные представления, мастер-классы."},{"ul":[{"b":"Государственные проекты","t":" — большая ответственность, оправданная высоким уровнем подготовки каждого этапа по грамотно составленному плану работ. Задачи любой сложности и масштаба выполняются в кратчайшие сроки профессиональной командой SENSUM."}]},{"h":"Memory Photo-Art"},{"p":"Арт-студия помогает реализовать смелые фантазии и создать незабываемые воспоминания. Тематические фотопроекты позволяют соприкоснуться с искусством перевоплощения: поразительные образы, дополненные значимыми деталями."},{"ul":["Контент-съёмка для корпораций и торговых групп нужна, чтобы привлечь внимание целевой аудитории и поддерживать имидж бренда клиента."]}]},{"id":"br-priorities","cat":"BR","topic":"BR-3","title":"Три приоритета: комплексное, долгосрочное, уникальное","blocks":[{"h":"Комплексное"},{"p":"Использование всех или большей части услуг и товаров сегмента."},{"ol":["Заведение под ключ и оборудование для кофе.","Привлечение посредством продукта (кофе, цветы, фото).","Цветочное оформление на ивентах, витринистика, корпоративный интерьер и декор.","Готовый фотообзор для корпоративов.","Государственные мероприятия, открытия, форумы."]},{"h":"Долгосрочное"},{"p":"Годовые контракты на товары и услуги сегмента."},{"ol":["Экспорт, тендеры на кофе, сервис.","Многоуровневые академические курсы.","Консьерж и торговые группы.","Контент для корпораций и торговых групп для поддержания имиджа.","Подарки и ежегодные фестивали."]},{"h":"Уникальное"},{"p":"Использование ноу-хау каждого сегмента."},{"ol":["Возможность индивидуального рецепта кофе.","Возможность создать букет на основании совокупности отличительных черт характера получателя.","Флористический консьерж: оптимизация времени и уникальность букета независимо от периода получения.","Возможность создавать уникальные образы с уникальным реквизитом: одни предметы собраны по всему миру, другие созданы руками мастеров."]}]},{"id":"br-growth","cat":"BR","topic":"BR-3","title":"Стратегия роста","blocks":[{"p":"Цели стратегии роста бренда: от непрерывного развития до вклада в развитие страны."},{"ul":["Непрерывное развитие.","Представление страны на разнообразных платформах.","Создание ассоциаций во всех сегментах на государственном уровне.","Мировой знак качества.","Расширение географии бренда.","Выявление новых стандартов качества как эталона.","Создание новых сегментов, связанных с философией бренда.","Экономическое и социальное развитие страны."]}]}],"lcats_ru":{"CF":{"ic":"🌱","t":"Кофе","d":"От зерна до чашки: происхождение, обработка, обжарка, эспрессо, молоко, заваривание"},"SV":{"ic":"🤝","t":"Сервис и продажи","d":"Общение с гостем, приём заказа, апселлинг и кросс-селлинг, конфликты"},"SN":{"ic":"🧼","t":"Санитария и работа в баре","d":"Гигиена, порядок в баре, FIFO, работа с гостями"},"BR":{"ic":"⭐","t":"Бренд SENSUM","d":"Миссия, принципы, направления и стратегия SENSUM"}},"lessons_az":[{"id":"cf-origin","cat":"CF","topic":"CF-1","title":"Əfsanə və mənşəyi","blocks":[{"p":"Geniş yayılmış əfsanəyə görə, kofe ağacının xüsusiyyətlərini təxminən IX əsrdə efiopiyalı çoban Kaldim (Kaldi) kəşf etmişdir."},{"h":"Arabika"},{"ul":["Vətəni Efiopiyadır (Cənubi Sudanın bir hissəsi də daxil olmaqla).","Yəmən — VI–XIII əsrlər arasında.","Hollandiya, Seylon (Şri-Lanka) — 1680-ci il.","Fransa, Burbon adası — 1715-ci il.","Sonrakı yayılması — XIX–XX əsrlər."]},{"h":"Robusta"},{"ul":["Vətəni Qvineya və Konqodur, Mərkəzi Afrika.","Hollandlar onu ilk dəfə 1900-cü ildə Yava adasında becərməyə başlayıblar."]},{"note":"Yadda saxlayın: arabikanın vətəni Efiopiya, robustanın vətəni Mərkəzi Afrikadır."}]},{"id":"cf-farm","cat":"CF","topic":"CF-1","title":"Ferma, meyvə və məhsul yığımı","blocks":[{"h":"Finka, ferma, fazenda"},{"p":"Bu, kofe giləmeyvələrinin becərildiyi və (və ya) ilkin emal edildiyi yerdir."},{"ul":["Əkin sahələrinin 70 %-dən çoxu kiçik istehsaldır, onların hər ikincisi 5 hektardan çox deyil.","Dünyanın ən böyük ferması 5500 hektar sahəyə malikdir.","Əksər fermerlər minimum resursla maksimum kofe istehsal etməyə çalışırlar.","Çox az fermer elmi yanaşmadan istifadə edir və kofenin dad profilini dəyişmək üçün infrastruktura vəsait yatırır."]},{"h":"Fermer kooperativi"},{"p":"Fermerlər müəyyən sahələrdə resurslarını birləşdirirlər. Kooperativ aşağıdakılarla məşğul olur:"},{"ul":["kiçik lotların birləşdirilməsi;","giləmeyvənin ilkin emalı;","qurutma;","ixraca hazırlıq və ixrac."]},{"h":"Meyvənin quruluşu — dənədən üst dəriyə doğru"},{"ol":["Dənə (üzərində uzunlamasına girinti var)","Gümüş dəri","Perqament qabığı (perçment)","Pektin qatı (muselyaj)","Mezokarp — meyvə pulpası","Eksokarp — üst dəri"]},{"p":"Dənənin mutasiyaları: piberi (Peaberry) və trianqlslar (Triangles)."},{"h":"Məhsul yığımı"},{"ul":[{"b":"Seçmə (pikinq)","t":" — yalnız yetişmiş giləmeyvələr əllə yığılır."},{"b":"Soyma (stripinq)","t":" — budaqdan bütün giləmeyvələr birdəfəyə yığılır."},{"b":"Mexaniki","t":" — giləmeyvələri maşın yığır."}]}]},{"id":"cf-species","cat":"CF","topic":"CF-2","title":"Arabika və Robusta","blocks":[{"table":{"head":["","Arabika","Robusta"],"rows":[["Hündürlük","800–2300 m, dağlıq ərazi","800 m-ə qədər, düz ərazi"],["İdeal temperatur","15–24 °C","22–30 °C"],["İdeal yağıntı","1000–1200 mm","1800–2200 mm"],["Dad","daha turş","daha acı"],["Dənənin ölçüsü","8–12 mm","5–8 mm"],["Dənənin forması","oval, uzunsov, yastı, S-formalı kəsik","yumru, hündür, uclu kənarlar, düz kəsik"],["Yetişmə dövrü","6–9 ay","9–11 ay"],["Xəstəliyə davamlılıq","daha az davamlı","daha davamlı"],["Kofein","1–1,5 %","2–3 %"]]}},{"note":"Dünya istehsalında arabikanın payı 70 %-dir, qalan 30 % robustanın payına düşür."}]},{"id":"cf-altitude","cat":"CF","topic":"CF-2","title":"Hündürlük və dad","blocks":[{"p":"Kofe nə qədər yüksəkdə yetişdirilirsə, onun turşuluğu və şirinliyi bir o qədər aydın olur. Hündürlük adətən dəniz səviyyəsindən metrlə (masl) göstərilir."},{"ul":["Çox aşağı — 600 masl","Aşağı — 750 masl","Orta yuxarı — 900 masl","Yuxarı — 1200 masl","Çox yuxarı — 1500 masl"]},{"h":"Hündürlüklə nə dəyişir"},{"ul":[{"b":"Müsbət turşular.","t":" Kofe nə qədər yüksəkdə yetişdirilsə, fincanda sitrik, alma və fosfor turşuları bir o qədər çox olur."},{"b":"Şəkərlər.","t":" Region nə qədər hündürdürsə, gecə bir o qədər soyuq olur. Bitki hüceyrə quruluşunu qorumaq üçün daha çox şəkər saxlayır və kofe daha şirin olur."},{"b":"Xlorogen turşusu (acılıq).","t":" Hündürlük nə qədər aşağıdırsa, o bir o qədər çox olur. Qovurma zamanı xinin və kofe turşularına parçalanır (acı-turş dad)."},{"b":"Lipidlər.","t":" Hündürlük nə qədər aşağıdırsa, lipidlər bir o qədər çox olur, buna görə müsbət turşuluq daha az hiss olunur."}]}]},{"id":"cf-process","cat":"CF","topic":"CF-3","title":"Emal və fermentasiya","blocks":[{"p":"Yığılmış giləmeyvələr seçilir və təsnif edilir, sonra ənənəvi üsullardan biri ilə emal olunur. Emal üsulu kofenin bədəninə, şirinliyinə, turşuluğuna və dad profilinə təsir edir."},{"h":"Emal üsulları"},{"ul":["Təbii (natural)","Yuma","Mexaniki yuma","Xani","Sulu xalinq"]},{"h":"Fermentasiya"},{"ul":["Aerob","Anaerob","Karbon dioksidin maserasiyası","Yarı karbon dioksid maserasiyası"]},{"note":"Unutmayın! Fermentasiya təbii və qaçılmaz prosesdir. Dad potensialını açmaq üçün ona mümkün qədər nəzarət etmək lazımdır: şirinlik, turşuluq və bədən əlavə etmək. Yanlış fermentasiya məhsulu korlaya bilər: dadda kimyəvi çalar yaranır, şirinlik və turşuluq daha az xarakterik olur."},{"h":"Kofeinsizləşdirmə"},{"ul":["Ənənəvi üsul","İsveçrə üsulu"]}]},{"id":"cf-defects","cat":"CF","topic":"CF-3","title":"Yaşıl dənənin qüsurları","blocks":[{"p":"Qüsurlar üç yerdə yaranır: ağacda, məhsul yığımı zamanı və emal zamanı. Hər birinin öz görünüşü, səbəbi və fincandakı dadı var."},{"h":"Ağacda yaranan qüsurlar"},{"ul":[{"b":"Tam qara dənə","t":" — səthi qara; səbəb — giləmeyvəni zədələyən göbələk; dad — ağır acılıq, ferment, fenol."},{"b":"Həşəratlar tərəfindən zədələnmiş","t":" — sferik deşiklər (giriş və çıxış); səbəb — brokka; dad — yüngüldən ağıra qədər acılıq."},{"b":"Tünd qəhvəyi dənə","t":" — qəhvəyi, demək olar ki, qara; səbəb — yetişməmiş donmuş giləmeyvə; dad — ağır «meyvə dadı»."},{"b":"Şel","t":" — anormal forma; səbəb — inkişaf qüsuru; dad — az turşuluq, boş, sulu."},{"b":"Qırış-qırış dənə","t":" — səthi qırışlıdır; səbəb — inkişaf qüsuru, su və qida çatışmazlığı; dad — az turşuluq, boş."}]},{"h":"Məhsul yığımı zamanı yaranan qüsurlar"},{"ul":[{"b":"Yetişməmiş dənə","t":" — boz-yaşıl, qırışlı; səbəb — yetişməmiş giləmeyvə; dad — az turşuluq, «meyvəlik», acılıq."},{"b":"Ağ dənə","t":" — ağımtıl; səbəb — yetişməmiş, yerdən yığılmış giləmeyvə; dad — az turşuluq, acılıq, düyü-taxıl dadı."},{"b":"Tünd yaşıl dənə","t":" — tünd yaşıl; səbəb — yüksək temperaturda qurudulmuş yetişməmiş dənə; dad — büzücü turşuluq, kəskin qoxu."},{"b":"Fenol","t":" — ağır acı qoxu; səbəb — yetişmənin ekstremal şəraiti; dad — sərt kimyəvi acılıq."},{"b":"Rio / Riado","t":" — kəsdikdə tibbi qoxu; səbəb — ağacda qalıb həddindən artıq yetişmiş giləmeyvə; dad — kimyəvi, tibbi, yod."}]},{"h":"Emal zamanı yaranan qüsurlar"},{"ul":[{"b":"Deformasiya olunmuş dənə","t":" — dənə parçaları; səbəb — pis tənzimlənmiş avadanlıq; dad — boş, yastı."},{"b":"Turşumuş dənə","t":" — səthi qəhvəyi-qırmızı; səbəb — nəzarətsiz fermentasiya; dad — xam küflü kartof, ferment, acılıq."},{"b":"Stinker («iyli dənə»)","t":" — gözlə demək olar ki, görünmür; dad — iyrənc acılıq."},{"b":"Kənar material","t":" — perqament, kaskara, daşlar, çubuqlar; səbəb — düzgün aparılmamış təmizləmə; dad — çirkli, fenol, torpaq, ferment; avadanlıq zədələnə bilər."},{"b":"Göbələk","t":" — dənənin üzərində; səbəb — qurutma və ya saxlama şəraiti pozulub; dad — küflü, kif, «rütubətli zirzəmi»."},{"b":"Rezin","t":" — gözlə müəyyən etmək olmur; dad — rezin, kükürd."},{"b":"Qapalı qoxulu dənə","t":" — sarı-qəhvəyi; səbəb — patioda həddindən artıq qurudulub; dad — yastı, boş, köhnə."}]}]},{"id":"cf-market","cat":"CF","topic":"CF-4","title":"İxrac, istehsal və qiymətlər","blocks":[{"h":"İxrac üçün necə qablaşdırılır"},{"ul":["Biq-bəq — 1 ton","Cut və ya sizal — 59, 60, 69 və ya 70 kq","GrainPro — 30, 35, 60, 69 və ya 70 kq","Vakuum qablaşdırma — 10–40 kq"]},{"p":"Kofe təyyarə ilə, dəniz və quru yolla daşınır."},{"h":"Kim istehsal edir"},{"ul":["Braziliya — dünya kofesinin təxminən 40 %-i.","Vyetnam — təxminən 20 %.","Digər ölkələr — təxminən 40 %.","Arabika dünya istehsalının 70 %-ni, robusta 30 %-ni təşkil edir."]},{"h":"Bu hansı kofedir"},{"ul":["Birja (commodity) kofesi — təxminən 66 %.","Sertifikatlaşdırılmış (RFA, orqanik və s.) — təxminən 24 %.","Speşalti — təxminən 10 %."]},{"h":"Qiymət necə formalaşır"},{"ul":["Birja kofesi «C» fyuçersinin qiymətləri ilə satılır: Nyu-York — arabika, London — robusta.","Speşalti treyderlərin qiymət siyahısı olur. Hər lot üçün mənşə, region, ad, dənənin ölçüsü (screen), emalın növü və adı, profil, qiymət (score), əsas deskriptor və qiymət göstərilir."]}]},{"id":"cf-specialty","cat":"CF","topic":"CF-4","title":"Kommersiya və speşalti kofe","blocks":[{"ul":[{"b":"Kommersiya kofesi (conventional)","t":" — istehsalçı üçün daha çox rəqəmlər və əsas ehtiyacların həllidir, istehlakçı üçün adi vərdiş və kofein mənbəyi. Kütləvi olaraq dadlı və maraqlı içki sayılmır."},{"b":"Xüsusi kofe (speşalti)","t":" — ilk növbədə istehsala bütün mərhələlərdə və zəncirin bütün iştirakçıları tərəfindən xüsusi yanaşmadır. Fərqli daddan əlavə, məlumat mənbəyidir, suallar və cavablar yaradır, insanları ətrafında toplayır."}]},{"note":"İstehsalçı, məhsul və istehlakçı bir-birinin əksi və davamıdır. Xüsusi məhsul və xüsusi insanlar xüsusi atmosfer yaradır!"},{"h":"Ümumi keyfiyyət qiymətləndirməsi"},{"table":{"head":["Xal","Qiymətləndirmə"],"rows":[["90–100","mükəmməl"],["85–89,99","əla (speşalti)"],["80–84,99","çox yaxşı (speşalti)"],["80-dən aşağı","speşalti keyfiyyətindən aşağı"]]}},{"h":"Nə qiymətləndirilir"},{"ul":["Dənənin ölçüsü (skrin).","Qüsurlar.","Kappinq üzrə ümumi qiymət."]},{"note":"Speşalti kofe nümunəsində 350 q-a bir dənə də birincili qüsur düşməməlidir, ikincili qüsurlar isə 5-dən çox olmamalıdır."}]},{"id":"cf-green","cat":"CF","topic":"CF-4","title":"Yaşıl kofe və izlənilmə","blocks":[{"p":"Bölmənin şüarı: keyfiyyət və kəmiyyət üzrə ümumi məqsədləri bölüşərək güclü iş icmaları yaradın."},{"h":"Üç çeşid"},{"ul":[{"b":"Terras («yer»)","t":" — kofenin yetişdiyi bölgənin ən saf mahiyyətini çatdırır."},{"b":"Constellations («bürclər»)","t":" — xarakter və şəxsiyyətlə seçilən fincan profilli kofe."},{"b":"Uniques («unikallar»)","t":" — kofenin texniki tərəfini göstərir və emosional tərəfini çatdırır."}]},{"h":"İzlənilmə (traceability)"},{"p":"Hər lot haqqında aşağıdakılar məlumdur:"},{"ul":[{"b":"Coğrafiya və terroir","t":" — mənşə yeri, relyef, iqlim, hündürlük."},{"b":"Emal və dənənin fiziki göstəriciləri","t":" — növ və çeşid, emalın adı, ölçü, rəng, rütubət, suyun aktivliyi və fiziki vəziyyəti göstərən digər parametrlər."},{"b":"Orqanoleptik profil və deskriptorlar","t":" — lotun texniki təsviri, dad-aroma xüsusiyyətləri və atributların intensivliyi."}]}]},{"id":"cf-roast","cat":"CF","topic":"CF-5","title":"Qovurma","blocks":[{"p":"Kofenin suda həll olması üçün onu qovururlar: qovurma kofenin potensialını açır. Qovurma vaxt, temperatur, hava axını dəyişməklə və rəngə nəzarət etməklə idarə olunur."},{"ul":[{"b":"Roster","t":" — kofe dənələrini qovurmaq üçün avadanlıq."},{"b":"Qovurma profili","t":" — vaxt və temperatur qrafiki."}]},{"h":"Qovurma mərhələləri"},{"ol":["Qurutma","Sarılıq","İlk krek","İnkişaf","İkinci krek","Soyutma"]},{"note":"Tünd qovurmada kofenin həcmi iki dəfə artıra bilər."},{"h":"Dənədə nə baş verir"},{"p":"Dadı quru distillə, karamelizasiya, Mayar reaksiyası və turşuların əmələ gəlməsi yaradır. Qovurma dərəcəsindən turşuluq, bədən, şirinlik, terroir və aroma asılıdır."},{"h":"Qovuranın ölçüsü"},{"ul":["Mikro roster — ayda ən çox 10 000 kq.","Orta roster — ayda 10 000 kq-dan çox.","Böyük roster — ayda 100 000 kq-dan çox."]},{"h":"Satış kanalları"},{"p":"Dənənin seçimi, qovurma tərzi və son məhsulun növü bazarın inkişafından və satış kanallarından asılıdır."},{"ul":[{"b":"Pərakəndə (retail)","t":" — birbaşa son istehlakçıya satış. Bunun üçün çox vaxt sadə dənə seçilir və maksimum inkişafla qovrulur."},{"b":"HoReCa","t":" — xidmət sektorunun seqmenti və satış nöqtəsində birbaşa istehlak ilə satış kanalı. Kofenin keyfiyyəti və mürəkkəbliyi müəssisənin formatından və hazırlama üsullarından asılı olaraq çox fərqlənir."}]},{"h":"Qovurma qüsurları"},{"ul":["Baked — bişmiş dənə","Light — açıq","Fast — tez qovrulmuş","Underdeveloped — inkişafsız","Scorched — təmasla yanma","Tipped — hava ilə yanma","Burnt — yanmış"]}]},{"id":"cf-fresh","cat":"CF","topic":"CF-5","title":"Deqazasiya və təzəlik","blocks":[{"h":"Deqazasiya"},{"p":"Bu, təzə qovrulmuş kofenin saxlanması zamanı gedən prosesdir. Qovurma zamanı çox qaz, əsasən karbon dioksid əmələ gəlir. O dənələrdə «bağlı» qalır və tədricən çıxır."},{"h":"Təzəliyə nə təsir edir"},{"ul":["İşıq","Oksigen","İstilik","Nəmlik"]},{"h":"Necə saxlamaq lazımdır"},{"ul":["Dənələri qapalı paketdə saxlayın: hava, nəm, işıq, istilik və kənar qoxulardan qorunmuş şəkildə.","Dənə bunkerinin və doza kamerasının qapaqlarını bağlı saxlayın.","İdeal olaraq dənələri qovurmadan sonra bir ay ərzində, ən gec üç aya qədər istifadə edin.","Təzə üyüdülmüş kofeni üyütmədən sonra mümkün qədər tez istifadə edin.","Sərin yerdə saxlayın."]}]},{"id":"cf-equip","cat":"CF","topic":"CF-6","title":"Dəmləmə üsulları və avadanlıq","blocks":[{"h":"Dəmləmə üsulları"},{"ul":["Qravitasiya (damcı), məsələn V60","Vakuum filtrasiya","İmmersiya","Təzyiq, məsələn espresso","Qaynatma, məsələn cezva","Kombinasiyalar: immersiya + dekantasiya, immersiya + təzyiq, immersiya + qravitasiya"]},{"h":"Espresso maşınları"},{"ul":[{"b":"Lever (əl ilə)","t":" — qolla idarə olunur."},{"b":"Yarımavtomat","t":" — elektron nasos suyu kofedən keçirir, barista isə axını əllə başladır və dayandırır."},{"b":"Avtomat","t":" — proqramlaşdırılmış su miqdarını keçirir; lazımi həcm proqramlaşdırılan düymələrdən biri ilə seçilir."},{"b":"Tam avtomat","t":" — bir düyməni basmaqla istənilən içki, o cümlədən latte və kapuçino hazırlanır."}]},{"h":"Kofe üyüdənlər"},{"ul":["Espresso üçün kofe üyüdənlər: birbaşa axınlı və dozatorlu.","Mağaza və laboratoriya kofe üyüdənləri də var."]},{"h":"Üyüdücü dişlilər"},{"ul":["Konik","Yastı (paralel)","Roller","İkiqat üyütmə də var."]}]},{"id":"cf-espresso","cat":"CF","topic":"CF-7","title":"Espresso, üyütmə dərəcəsi və EBF","blocks":[{"p":"Espresso — dəmləmə üsuludur: incə üyüdülmüş kofe portafiltrdə sıxılır və içindən təzyiq altında isti su keçirilir. Nəticədə qatılaşdırılmış içki alınır."},{"p":"Elmi baxımdan espresso kofe ekstraktından başqa bir şey deyil, onun hazırlanması isə ekstraksiyadır."},{"h":"Üyütmə dərəcəsi"},{"p":"Ən iridən ən xırdaya qədər üyütmə:"},{"ol":["soyuq dəmləmə və immersiya üsulları;","damcı (qravitasiya) üsulları;","incə filtr;","espresso;","cezva (ibrik) — ən xırda."]},{"h":"EBF — Espresso Brew Formula"},{"ul":["Doza — portafiltrdəki üyüdülmüş kofenin miqdarı.","İçki çıxışı — fincandakı mayenin çəkisi."]},{"p":"EBF, % = doza × 100 / içkinin çəkisi"},{"p":"Brew ratio = içkinin çəkisi / doza"},{"p":"Nümunə: doza 18 q, çıxış 36 q. EBF = 18 × 100 / 36 = 50 %, brew ratio = 36 / 18 = 2."},{"h":"Bu nə üçün lazımdır"},{"ul":["Espressonun sıxlığını və istifadə olunan kofenin həllolma qabiliyyətini göstərir.","Resepti təkrarlamağı və ya dəyişdirməyi asanlaşdırır."]},{"note":"Sensum-da ikiqat espresso — 18 q doza və 36 q çıxışdır."}]},{"id":"cf-extract","cat":"CF","topic":"CF-7","title":"Ekstraksiya, güc və espressonun dadı","blocks":[{"ul":[{"b":"Ekstraksiya","t":" — dad komponentlərinin bərk haldan maye halına keçməsi."},{"b":"Güc (% TDS)","t":" — maye kofedə bütün həll olmuş maddələrin faizi (Total Dissolved Solids). Suya nisbətən nə qədər yüksəkdirsə, içki bir o qədər güclüdür."}]},{"p":"Ekstraksiya dərəcəsi, % = içki çıxışı (q) × TDS (%) / kofe dozası (q)"},{"ul":["Ən yaxşı dad üçün ekstraksiya 18–22 % olmalıdır.","Qovrulmuş kofenin suda həll olan maddələrinin maksimum miqdarı təxminən 30–35 %-dir.","Hazır içkinin 98,5 %-i sudan ibarətdir."]},{"h":"Ekstraksiyanın balansı"},{"table":{"head":["","Nə hiss olunur"],"rows":[["Az çıxarış","kəskin turşuluq, şorluq, şirinlik yoxdur, qısa son dad"],["Balans","xoş turşuluq, şirinlik, şirəlilik, saflıq, uzun son dad"],["Artıq çıxarış","acılıq, quruluq, boşluq"]]}},{"h":"Espressonun sensor aspektləri"},{"ul":[{"b":"Aroma","t":" — dad qönçələrimizi oyadan uçucu birləşmələr: şokoladlı, çiçəkli, meyvəli."},{"b":"Dad","t":" — bütün dad hisslərinin birləşmiş qavrayışı: turş, acı, şirin, duzlu, umami."},{"b":"Bədən","t":" — dilin hiss etdiyi çəki: yüngül, orta, sıx."},{"b":"Tekstura","t":" — maye dili əhatə edərkən yaranan hiss: sulu, qaymaqlı, şirəli."}]},{"h":"Qovurma və espressonun dadı"},{"ul":["Açıq qovurma daha çox turşuluq verir.","Tünd qovurma daha çox acılıq verir.","Orta qovurma bunların arasındadır."]}]},{"id":"cf-milk","cat":"CF","topic":"CF-8","title":"Süd","blocks":[{"h":"Südün tərkibi"},{"ul":["Su — təxminən 88 %","Laktoza — 3,6–5,5 %","Zülallar — 3–5 %","Yağlar — 3–5 %","Minerallar — 0,6–0,9 %"]},{"ul":[{"b":"Laktoza","t":" — süd şəkəri, şirinliyə cavabdehdir."},{"b":"Zülal","t":" — onun molekulları sabit köpük əmələ gətirir."},{"b":"Yağ","t":" — köpüyün elastikliyinə cavabdehdir və toxunma hissinə təsir edir."}]},{"h":"Süd nə vaxt xarab olur"},{"ul":["Bakteriyalar südün turşuluğunu artırır. Nəhayət, zülallar və yağlar parçalanır və süd gigiyenik səbəblərə görə yararsız olur.","Belə süd köpüklənmir.","Espressonun turşuluğu çox vaxt əvəzedicilərdən hazırlanmış südü qatılaşdırır.","Xarab olma səbəbləri: yararlılıq müddətinin bitməsi və ya südün yüksək temperaturda saxlanması."]},{"h":"Köpükləndirmə temperaturu"},{"ul":["SCA standartına görə süd 55–65 °C-də köpükləndirilir.","İcazə verilən maksimum temperatur 70 °C-dir."]}]},{"id":"cf-brew","cat":"CF","topic":"CF-9","title":"Dəmləmə: resept və su","blocks":[{"h":"Əsas elementlər"},{"ul":["Su və kofenin nisbəti (brew ratio)","Üyütmə dərəcəsi","Dəmləmə vaxtı","Suyun temperaturu","Turbulentlik","Suyun keyfiyyəti","Filtrin materialı"]},{"h":"Ekstraksiyanı necə idarə etmək olar"},{"table":{"head":["","Ekstraksiyanı artırmaq","Ekstraksiyanı azaltmaq"],"rows":[["Üyütmə","daha xırda","daha iri"],["Su","daha çox","daha az"],["Kofe","daha az","daha çox"],["Turbulentlik","daha çox","daha az"],["Temperatur","daha yüksək","daha aşağı"]]}},{"h":"Su və kofenin nisbəti"},{"p":"Verilmiş güc üçün kofe dozasına nə qədər su (ml) lazımdır. Solda daha zəif (55 q/l), sağda daha güclü (70 q/l)."},{"table":{"head":["Doza","55 q/l","60 q/l","65 q/l","70 q/l"],"rows":[["15 q","273","250","231","214"],["18 q","327","300","277","257"],["19 q","345","317","292","271"],["20 q","364","333","308","286"],["21 q","382","350","323","300"]]}},{"h":"Su"},{"table":{"head":["","Optimal","Qəbul edilən"],"rows":[["Qoxu","təmiz, qoxusuz",""],["Rəng","təmiz, şəffaf",""],["Xlor","0 mq/l",""],["TDS","150 mq/l","75–250 mq/l"],["Kalsium sərtliyi","4 dənə, yaxud 68 mq/l","1–5 dənə, yaxud 17–85 mq/l"],["Qələvilik","40 mq/l","40 mq/l-ə yaxın"],["pH","7,0","6,5–7,5"],["Natrium","10 mq/l","10 mq/l-ə yaxın"]]}},{"h":"Temperatur"},{"p":"Temperatur nə qədər yüksəkdirsə, ekstraksiya bir o qədər sürətli gedir. Temperatur həm də nəyin çıxarıldığına təsir edir, buna görə müxtəlif temperaturlarda dad fərqli olur. SCA 93 °C ± 3 °C tövsiyə edir."},{"h":"Turbulentlik"},{"p":"Bu, kofe hissəciklərinin su ilə qarşılıqlı təsirinin artmasıdır. Onu yaradır:"},{"ul":["qaşıqla qarışdırmaq: ekstraksiyanı artırır, lakin nəzarət etmək çətindir;","suyun töküldüyü hündürlük: nə qədər yüksəkdirsə, qarşılıqlı təsir bir o qədər güclüdür;","qaynama."]},{"h":"Filtrlər"},{"ul":["Kağız: fincan daha təmiz və şəffaf olur.","Parça: fincan daha zəngin olur.","Metal: içkinin sıxlığı artır, lakin saflıq itir."]},{"h":"Dəmləmənin analizi"},{"ul":[{"b":"Güc","t":" — fincanda həll olmuş kofe maddələrinin konsentrasiyası. Bu, qovurma profili və ya kofeinin miqdarı deyil."},{"b":"Həll olan maddələrin çıxışı (ekstraksiya)","t":" — üyüdülmüş kofenin dəmlənməsi nəticəsində həll etdiyimiz maddələrin faizi."}]},{"note":"Optimal ekstraksiya faizi və optimal güc ilə dəmləmə balanslı adlanır. SCA tövsiyəsi: həll olan maddələrin çıxışı 18–22 %, konsentrasiya 1,15–1,45 %."}]},{"id":"cf-sensory","cat":"CF","topic":"CF-10","title":"Sensor analizi və kappinq","blocks":[{"p":"Sensor analizi — kofenin orqanoleptik xüsusiyyətlərinin, dad və aroma keyfiyyətlərinin, potensialının müəyyən edildiyi və qiymətləndirildiyi dadma prosesidir."},{"h":"Nə üçün istifadə olunur"},{"ul":["Yaşıl kofenin seçilməsi və keyfiyyətinə nəzarət","Yeni məhsulun hazırlanması","Qovurma profillərinin axtarışı və hazırlanması","Son məhsulun keyfiyyətinə nəzarət","İstehlakçılar tərəfindən qəbul","Ünsiyyət"]},{"h":"Beş əsas dad"},{"ul":[{"b":"Turş","t":" — sitrus turşusu"},{"b":"Acı","t":" — kofein, xlorogen turşuları"},{"b":"Şirin","t":" — saxaroza, fruktoza"},{"b":"Duzlu","t":" — natrium xlorid"},{"b":"Umami","t":" — monosodium glutamat (MSG)"}]},{"note":"Kofenin qovrulması prosesində ilk 5 dəqiqə ərzində 20-dən çox turşu əmələ gəlir."},{"h":"Kappinq protokolu"},{"ul":["Nümunənin qovrulma müddəti — 8–12 dəqiqə.","Orta qovurma dərəcəsi: Agtron şkalası üzrə 60–65, Colorette üzrə 90–105.","Kappinq qovurmadan 8–24 saat sonra aparılır.","Üyütmə filtrdən bir az iridir. Başlamazdan ən geci 15 dəqiqə əvvəl üyüdülür.","Hər nümunə üçün 4–5 fincan.","150 ml suya 8,25 q kofe.","Fincanlar — şüşə və ya keramika, həcmi 200–260 ml, diametri 75–90 mm.","Qaşıqlar — gümüş və ya paslanmayan polad, 4–5 ml.","Su təmiz, şəffaf, dadsız və qoxusuz olmalıdır: TDS 75–250 ppm (1 mq/l = 1 ppm), pH 7,0–7,5, temperatur 93 °C.","Su üstdən birbaşa üyüdülmüş kofenin üzərinə, fincandan fincana bərabər tökülür."]}]},{"id":"sv-first","cat":"SV","topic":"SV-1","title":"İlk təəssürat və salamlaşma","blocks":[{"p":"İlk təəssürat qonaqla təmasın ilk saniyələrində formalaşır. Səmimi gülümsəmə və mehriban salamlaşma isti atmosfer yaradır, göz təması isə etibar doğurur və göstərir ki, siz qonağı həqiqətən görürsünüz, sadəcə işinizi görmürsünüz."},{"p":"Bədən dili sözlər qədər çox şey deyir: açıq duruş, çarpazlanmamış əllər, gövdənin qonağa tərəf dönməsi. Ötürdüyünüz enerji və həvəs qonağın əhvalını yaxşılaşdırır."},{"h":"İlk təəssüratın əsas elementləri"},{"ul":[{"b":"Gülümsəmə","t":" — səmimi, isti: qonağın ilk görməli olduğu budur."},{"b":"Göz təması","t":" — qonağın gözlərinə baxın: bu hörmət və diqqət göstərir."},{"b":"Salamlaşma","t":" — gün vaxtından asılı olaraq “Sabahınız xeyir!”, “Gününüz xeyir!”, “Axşamınız xeyir!”."},{"b":"Açıq duruş","t":" — əllərinizi çarpazlamayın, qonaqdan üz çevirməyin."},{"b":"Enerji","t":" — gün ağır keçsə belə, diri və müsbət olun."}]},{"note":"Barista kofe məkanının simasıdır. Qonağın yenidən gəlməsi, dostlarına tövsiyə etməsi və ziyarət zamanı nə qədər xərcləməsi kassadakı ünsiyyətdən asılıdır."}]},{"id":"sv-listen","cat":"SV","topic":"SV-1","title":"Aktiv dinləmə və qonağa suallar","blocks":[{"p":"Aktiv dinləmək qonaq danışarkən sadəcə susmaq deyil. Bu, təkcə sözlərə yox, bədən dilinə, səs tonuna və əhvala da diqqətdir. Qonağın nə dediyinə və nəyi deməməsinə fikir verin. Yorğun görünürsə, ona güclü qəhvə lazım ola bilər. Əhvalı yaxşıdırsa və tələsmirsə, yeni nəsə dadmağı təklif etmək olar."},{"h":"Açıq suallar"},{"p":"Açıq sual “bəli” və ya “xeyr” yox, ətraflı cavab tələb edir. “Qəhvə istəyirsiniz?” əvəzinə “Bu gün hansı qəhvəni üstün tutursunuz?” və ya “Qəhvənizə nə əlavə edək?” soruşun. Beləcə qonağın seçimini daha yaxşı başa düşər və ona məhz lazım olanı təklif edə bilərsiniz."},{"h":"Empatiya"},{"p":"Empatiya özünü başqasının yerinə qoymaq və onun hisslərini anlamaq bacarığıdır. Qonaq kədərlidirsə, başa düşün, sevinclidirsə, əhvalını bölüşün. Empatiya emosional bağ yaradır və ünsiyyəti insani edir."},{"h":"Aktiv dinləmə texnikaları"},{"ul":[{"b":"Diqqətlilik","t":" — sözləri dinləyin, bədən dilinə və səs tonuna fikir verin."},{"b":"Açıq suallar","t":" — “Hansı qəhvəni üstün tutursunuz?”, “İçkinizə nə əlavə edək?”"},{"b":"Dəqiqləşdirmə","t":" — “Düzgün başa düşdümmü ki, badam südlü latte istəyirsiniz?”"},{"b":"Empatiya","t":" — “Görürəm, gününüz gərgin keçib. Qoy sizin üçün xüsusi nəsə hazırlayım.”"}]}]},{"id":"sv-types","cat":"SV","topic":"SV-1","title":"Qonaq tipləri və fərdi yanaşma","blocks":[{"p":"Hər qonaq unikaldır və ona fərdi yanaşmaq lazımdır. Bununla belə, qonaqların dörd tipik növünü ayırd etmək olar."},{"ul":[{"b":"“Tələsən”","t":" — tələsir və sifarişi mümkün qədər tez almaq istəyir. Yanaşma: sürət və minimum sual; gözləmə tələb etməyən hazır məhsul (sendviç, qəlyanaltı) təklif edin. İfadə: “Həmişəki lattenizdir? Bir dəqiqəyə hazırdır!”"},{"b":"“Qərarsız”","t":" — nə istədiyini bilmir və ya kofe məkanına ilk dəfə gəlib. Yanaşma: kömək, istiqamətləndirici suallar, konkret tövsiyələr. İfadə: “Spanish Latte-mizi və ya klassik kapuçinonu dadın, çox populyardır!”"},{"b":"“Daimi”","t":" — müntəzəm gəlir. Yanaşma: üstünlükləri yadda saxlayın, adı ilə müraciət edin. İfadə: “Salam, İvan! Həmişəki kimi, ikiqat espresso?” Bu, qayğı hissi yaradır və daimi qonaqlar bunu çox qiymətləndirir."},{"b":"“Maraqlanan”","t":" — qəhvə ilə maraqlanır, dənələr, hazırlama üsulları və yeniliklər haqqında bilmək istəyir. Yanaşma: dənələrin mənşəyi, qovurma, yeni içkilər haqqında danışın. Bu, həm satışı artırır, həm də qonaqla bağı möhkəmləndirir."}]}]},{"id":"sv-triggers","cat":"SV","topic":"SV-2","title":"Psixoloji tetiklər","blocks":[{"p":"Psixoloji tetiklər insanların qərarlarına təsir edən mexanizmlərdir. Onları anlayıb tətbiq etdikdə satışlar nəzərə çarpacaq dərəcədə artır."},{"ul":[{"b":"Defisit","t":" — insanlar məhdud və ya tezliklə bitəcək şeyi daha çox qiymətləndirir. “Bu bizim mövsümi içkimizdir, yalnız ayın sonuna qədər mövcuddur!”, “Bu desertdən cəmi bir neçə porsiya qalıb”."},{"b":"Sosial sübut","t":" — insanlar başqalarının etdiyini etməyə meyllidir. “Bu gün bir çox qonaqlarımız bu latte-ni seçir”, “Bu bizim ən populyar desertimizdir”."},{"b":"Avtoritet","t":" — ekspertlərə etibar. “Baristamız tövsiyə edir…”, “Mən şəxsən bu içkini çox sevirəm”, “Barista kimi bu blendi dadmağı tövsiyə edirəm”."},{"b":"Qarşılıqlılıq","t":" — insanlar yaxşılığa yaxşılıqla cavab verməyə meyllidir. Kiçik kompliment və ya əlavə xidmət (məsələn, yeni içkinin pulsuz dequstasiyası) qonağı alışa həvəsləndirir. “Yeni peçenyemizi dadın, sınaq üçün pulsuzdur!”"},{"b":"Kontrast","t":" — insanlar hər şeyi müqayisədə qiymətləndirir. Əvvəlcə daha bahalı, sonra adi variantı desəniz, adi variant daha əlçatan görünür. “Əlavə şotlu kapuçinomuz və adi kapuçinomuz var.” Qonaq premium variant istəsə, onu da götürəcək."}]}]},{"id":"sv-upsell","cat":"SV","topic":"SV-2","title":"Apsell və kross-sell","blocks":[{"h":"Apsell"},{"p":"Apsell (upselling) qonağa seçdiyi məhsulun daha bahalı, təkmilləşdirilmiş və ya daha böyük variantını təklif etməkdir. Məqsəd orta çeki artırmaq və qonağın ehtiyacını daha yaxşı ödəməkdir."},{"ul":["İçkinin daha böyük həcmi","Əlavələr: şərbət, əlavə espresso şotu, alternativ süd","Daha bahalı dənə sortundan içki"]},{"ul":[{"b":"Əlavə şot","t":": “Əlavə espresso şotu əlavə etmək istərdinizmi? Bu, içkinizə daha çox güc və aroma verər.”"},{"b":"Alternativ süd","t":": “Bizdə alternativ süd var, məsələn badam, yulaf və hindistan cevizi südü — əlavə ödənişsiz!”"}]},{"h":"Kross-sell"},{"p":"Kross-sell (cross-selling) əsas alışı tamamlayan əlavə məhsulların təklif edilməsidir. Kofe məkanında bu, əsas sifarişə desert, xəmir məmulatı, sendviç, qəlyanaltı və ya başqa içkidir."},{"ul":[{"b":"Qəhvəyə — xəmir məmulatı və ya desert","t":": “Kapuçinonuza təzə kruassanımız çox yaraşar!”, “Latte-nizə fırmə desertimizi götürmək istərdinizmi? Qəhvə ilə mükəmməl uyğun gəlir.”"},{"b":"Qəhvəyə — sendviç","t":": “Səhər yeməyi üçün dadlı sendviçlərimiz var, qəhvənizə əlavə etmək istərdinizmi?”"},{"b":"Soyuq içkiyə — qəlyanaltı və ya su","t":": “Soyuq latte-nizə peçenyelərimiz çox yaraşar.”, “Bir şüşə su götürmək istərdinizmi? Belə istidə susuz qalmamaq vacibdir.”"}]},{"h":"Unikal içkilərimiz"},{"p":"Başqa yerdə tapa bilməyəcəyiniz müəllif içkiləri. Onları mütləq qonaqlara təklif edin, xüsusilə sınaqları sevənlərə, və həvəslə danışın."},{"ul":[{"b":"Illusion","t":" — qeyri-adi dad kombinasiyalı sirli içki"},{"b":"Spanish Latte","t":" — qatılaşdırılmış südlü latte"},{"b":"Universe","t":" — parlaq dad notlu içki"},{"b":"Jasmine Latte","t":" — jasminli zərif latte"},{"b":"Ginger Latte","t":" — zəncəfilli isidici latte"},{"b":"Euphoria","t":" — dadından eyforiya bəxş edən içki"}]},{"h":"Effektiv təkliflərin prinsipləri"},{"ul":[{"b":"Təbiilik","t":" — təklif məntiqli və təkidsiz olmalıdır."},{"b":"Qonaq üçün dəyər","t":" — yalnız çekinizi yox, qonağın təcrübəsini həqiqətən yaxşılaşdıran şeyi təklif edin."},{"b":"Məhsulu bilmək","t":" — təkliflər yerinə düşsün deyə menyunu yaxşı bilin."},{"b":"Qonağı oxumaq","t":" — qonağın əhvalına və ehtiyaclarına fikir verin."},{"b":"Təzyiq göstərməyin","t":" — qonaq imtina edibsə, təkid etməyin."}]}]},{"id":"sv-questions","cat":"SV","topic":"SV-2","title":"“Düzgün” suallar","blocks":[{"p":"Sualın formulası təklifin uğuruna çox təsir edir. “Bəli” və ya “xeyr” cavabı olan qapalı suallar çox vaxt imtina ilə nəticələnir. Açıq suallar qonağı düşünməyə və seçməyə sövq edir."},{"table":{"head":["Qapalı (pis)","Açıq (yaxşı)"],"rows":[["“Başqa nəsə?”","“Qəhvənizə nə əlavə edək?”"],["“Desert istəyirsiniz?”","“Bu gün hansı desert əhvalınızı qaldırar?”"],["“Şərbətlə?”","“Yeni karamel şərbətimizi sınamaq istərdinizmi?”"]]}},{"h":"Konkret variantlar təklif edin"},{"p":"Konkret seçim qonağın qərarını asanlaşdırır və alış ehtimalını artırır."},{"ul":[{"b":"Pis","t":": “Qəhvənizə nəsə istəyirsiniz?”"},{"b":"Yaxşı","t":": “Latte-nizə Belçika şokoladlı kruassan və ya tiramisu çox yaxşı uyğun gəlir. Hansını seçirsiniz?”"}]},{"h":"Təklifi əsaslandırın"},{"ul":[{"b":"Pis","t":": “Kruassan istəyirsiniz?”"},{"b":"Yaxşı","t":": “Kruassanımız təzəcə sobadan çıxıb, çölü xırtıldayan, içi yumşaqdır. Kapuçino ilə əla uyğun gəlir!”"}]},{"h":"Təsviri dildən istifadə edin"},{"p":"Sadə adlar əvəzinə iştah oyadan sözlərdən istifadə edin."},{"ul":[{"b":"Pis","t":": “Desert istəyirsiniz?”"},{"b":"Yaxşı","t":": “Zərif tiramisumuzu dadmaq istərdinizmi? Ağızda əriyir!”"}]}]},{"id":"sv-tips","cat":"SV","topic":"SV-1","title":"Satışı daha nə artırır","blocks":[{"h":"Məhsulu bilmək"},{"p":"Barista menyunu, içkilərin tərkibini, dənələrin xüsusiyyətlərini və hazırlanma üsullarını yaxşı bilməlidir. Onda qonaqların suallarına inamla cavab verir və yerinə düşən tövsiyələr edir."},{"ul":[{"b":"Hər içkinin tərkibi","t":" — inqrediyentlər və nisbətlər."},{"b":"Dənələrin mənşəyi","t":" — haradandır və dadı necədir."},{"b":"Hazırlanma üsulları","t":" — hər içki necə hazırlanır."},{"b":"Alternativlər","t":" — süd, şərbət, ölçü variantları hansılardır."},{"b":"Aksiyalar və xüsusi təkliflər","t":" — hazırda hansılar qüvvədədir (məlumat kitabçasının “Aksiyalar” bölməsinə baxın)."}]},{"h":"Təmizlik və nizam"},{"p":"Təmiz kassa və iş yeri etibar doğurur. Nizamsızlıq qonaqları çəkindirir və kofe məkanında keyfiyyətə fikir verilmədiyi təəssüratı yaradır."},{"ul":["Kassanı müntəzəm silin.","Barın üstündən qırıntıları, ləkələri, zibili yığışdırın.","Alətləri (sürahiləri, temperləri) təmiz saxlayın.","Hər şey öz yerində olmalıdır."]},{"h":"Vizual merçandayzinq"},{"p":"İnsanlar gözləri ilə alır: desertlərin, qəlyanaltıların və əlavə məhsulların iştahaaçan düzülüşü satışı nəzərəçarpacaq dərəcədə artırır."},{"ul":[{"b":"Göz səviyyəsində düzülüş","t":" — ən populyar və ya sərfəli məhsullar."},{"b":"İşıqlandırma","t":" — yaxşı işıq məhsulları cəlbedici edir."},{"b":"Vitrinlərin təmizliyi","t":" — vitrinlər təmiz və şəffaf olmalıdır."},{"b":"Müxtəliflik","t":" — müxtəlif məhsullar təklif edin."},{"b":"Qiymət etiketləri","t":" — aydın və başa düşülən."}]},{"h":"Aksiyalar və loyallıq proqramı"},{"ul":["Qonaqlara cari aksiyalar və xüsusi təkliflər haqqında fəal danışın: onlar fayda hissi yaradır və alışı stimullaşdırır.","Qonaqlara loyallıq proqramına qoşulmağı təklif edin: o, təkrar ziyarətləri stimullaşdırır və icmaya aidlik hissi yaradır."]}]},{"id":"sv-order","cat":"SV","topic":"SV-3","title":"Sifarişin qəbulu A-dan Z-ə","blocks":[{"p":"Salamlaşma və sifarişin qəbulu ən vacib andır: o, bütün ünsiyyətin tonunu müəyyən edir. Addımlar bu ardıcıllıqla gedir."},{"ol":[{"b":"Salamlaşma","t":" — gülümsəyərək və göz təması ilə, gün vaxtına uyğun: “Sabahınız xeyir! Sizə necə kömək edə bilərəm?”, “Gününüz xeyir! Nə sifariş edəcəksiniz?”, “Axşamınız xeyir! Sizi görməyə şadam!”"},{"b":"Aktiv dinləmə","t":" — sifarişi diqqətlə dinləyin, sözünü kəsməyin; içkinin ölçüsünə, süd növünə, şərbətə fikir verin."},{"b":"Dəqiqləşdirmə","t":" — səhvlərin qarşısını almaq üçün: “Adi südlü latte, düzdür?”, “Standart ölçülü kapuçino, düzdür?”, “Şəkərsiz americano, belədir?”"},{"b":"Apsell və ya kross-sell təklifi","t":" — “Latte-nizə şərbət əlavə etmək istərdinizmi? Bu, onu daha da dadlı edər!”, “Kapuçinonuza təzə kruassanımız çox yaraşar!”"},{"b":"Sifarişin təsdiqi","t":" — qonağın cavabından sonra bütün sifarişi təsdiqləyin: “Beləliklə, badam südlü latte və kruassan. Başqa nəsə?”"},{"b":"Sifariş qəbulunun tamamlanması","t":" — qonaq başqa nəsə istəmirsə, ödənişə keçin: “Əla! Sizdən [məbləğ].”"}]},{"h":"Dialoq nümunəsi"},{"ul":[{"b":"Barista","t":": “Sabahınız xeyir! Sizə necə kömək edə bilərəm?” (gülümsəmə, göz təması)"},{"b":"Qonaq","t":": “Latte, zəhmət olmasa.”"},{"b":"Barista","t":": “Hansı südlə: adi, badam, yulaf və ya hindistan cevizi?”"},{"b":"Qonaq","t":": “Adi ilə.”"},{"b":"Barista","t":": “Yaxşı! Latte-nizə təzə kruassanımızı götürərsinizmi? Təzəcə sobadan çıxıb!”"},{"b":"Qonaq","t":": “Bəli, götürürəm.”"},{"b":"Barista","t":": “Beləliklə, adi südlü latte və kruassan. Başqa nəsə?”"}]},{"note":"Apsell və ya kross-sell təklifi sifarişin yekun təsdiqindən əvvəl edilir."}]},{"id":"sv-pay","cat":"SV","topic":"SV-3","title":"Ödəniş, gözləmə və sifarişin təqdimatı","blocks":[{"h":"Ödəniş və gözləmə"},{"p":"Bu mərhələ sürətli, eyni zamanda mehriban olmalıdır."},{"ol":[{"b":"Məbləği deyin","t":" aydın və dəqiq: “Sizdən [məbləğ].”, “Cəmi [məbləğ].”"},{"b":"Ödənişi qəbul edin","t":" nağd və ya kartla. Kartla olarsa, terminalın düzgün işlədiyinə əmin olun. Nağd olarsa, qaytarma pulunu və çeki verin."},{"b":"Təşəkkür edin","t":" ödənişə görə: “Təşəkkür edirəm!”, “Minnətdaram!”"},{"b":"Gözləmə haqqında məlumat verin","t":" — sifarişi harada və nə vaxt götürmək olar: “Sifarişiniz bir neçə dəqiqəyə hazır olacaq. Təhvil piştaxtasının yanında gözləyə bilərsiniz.”"},{"b":"Əlaqəni qoruyun","t":", qonaq adi haldan çox gözləyirsə: “Sifarişiniz demək olar ki, hazırdır, bir dəqiqə!”, “Gözləməyə görə üzr istəyirik, içkinizi xüsusi diqqətlə hazırlayırıq.”"}]},{"h":"Sifarişin təqdimatı"},{"p":"Bu, qonaqla son təmasdır və ilk təmas qədər müsbət olmalıdır."},{"ol":[{"b":"Dəvət","t":" — adı deyilibsə, qonağı adı ilə çağırın və ya sifarişi təsvir edin: “İvan, latte və kruassanınız hazırdır!”"},{"b":"Təqdimat","t":" — sifarişi verin və hər şeyin düzgün olduğuna əmin olun: “Buyurun latte və kruassanınız. Zəhmət olmasa, hər şeyin yerində olduğunu yoxlayın.”"},{"b":"Arzu","t":" — “Nuş olsun!”, “Qəhvənizdən zövq alın!”, “Gününüz xeyirli olsun!”"},{"b":"Təşəkkür və vidalaşma","t":" — “Gəldiyiniz üçün təşəkkürlər! Sizi yenidən görməyə şad olarıq!”, “Görüşənədək!”"}]}]},{"id":"sv-conflict","cat":"SV","topic":"SV-3","title":"Münaqişəli vəziyyətlər","blocks":[{"p":"Münaqişələr hər biznesdə olur və onları düzgün həll etmək vacibdir. Əsas qayda — sakitliyi qorumaq və empatiya göstərməkdir."},{"ol":[{"b":"Sakit qalın","t":" — qonaq haqsız olsa belə, səsinizi qaldırmayın və mübahisə etməyin."},{"b":"Qonağı dinləyin","t":" — danışmasına imkan verin, sözünü kəsməyin: “Başa düşürəm”, “Çox üzr istəyirəm”, “Görürəm ki, narahatsınız”."},{"b":"Üzr istəyin","t":" — səhv sizin olmasa belə, kofe məkanı adından üzr istəyin: “Belə olduğuna görə çox üzr istəyirəm.”, “Narahatlığa görə bağışlayın.”"},{"b":"Həll yolu təklif edin","t":" — içkinin dəyişdirilməsi, pulun qaytarılması və ya kompliment: “Qoy sizə yeni içki hazırlayım.”"},{"b":"Tez hərəkət edin","t":" — problem nə qədər tez həll olunarsa, bir o qədər yaxşıdır; qonağı gözlətməyin."},{"b":"Təşəkkür edin","t":" qonağa əks əlaqəyə görə: “Bu barədə bizə xəbər verdiyiniz üçün təşəkkürlər. Yaxşılaşdırmaq üçün çalışacağıq.”"}]},{"h":"Nümunələr"},{"ul":[{"b":"Qəhvə soyuqdur","t":": “Çox üzr istəyirəm! Qoy indi sizə yeni, isti qəhvə hazırlayım.” Barista sakit qalır, üzr istəyir və dərhal həll yolu təklif edir."},{"b":"Sifariş qarışdırılıb","t":": “Mən badam südlü latte sifariş etmişdim, bu isə adi südlüdür!” Barista üzr istəyir, düzgün içki hazırlayır və üzrxahlıq olaraq kompliment təklif edə bilər."},{"b":"Uzun gözləmə","t":": “Çoxdan gözləyirəm! Sifarişim haradadır?” Barista üzr istəyir, sifarişi yoxlayır, sürətləndirir və səbrə görə təşəkkür edir."}]}]},{"id":"sv-scenarios","cat":"SV","topic":"SV-3","title":"Praktik ssenarilər","blocks":[{"p":"Təlimdən beş vəziyyət: barista nə edir və bu niyə işləyir."},{"ul":[{"b":"Səhər işə tələsir","t":" — barista sifarişi tez qəbul edir, gözləmə tələb etməyən kross-sell (hazır sendviç) təklif edir və tez təqdim edir. Qonaq sürətdən razı qalır."},{"b":"Kofe məkanına ilk dəfə gəlib, nə sifariş edəcəyini bilmir","t":" — barista istiqamətləndirici suallar verir (“Güclü qəhvə, yoxsa daha yumşaq nəsə üstün tutursunuz?”), konkret tövsiyələr edir, sonra apsell (şərbət) və kross-sell (xəmir məmulatı) təklif edir."},{"b":"Daimi qonaq","t":" — barista adı ilə salamlayır, “həmişəki kimi” təklif edir və sosial sübutla yeni desert əlavə edir: “Bir çox qonaqlarımız artıq dadıb və heyrandırlar”."},{"b":"Maraqlanan qonaq","t":" — barista məhsulu bildiyini göstərir: dənələrin mənşəyi və qovurma haqqında danışır, dadı daha yaxşı hiss etmək üçün ikiqat espresso və ona uyğun əlavə təklif edir."},{"b":"Adi americano sifariş etdi","t":" — barista üç tetiki birləşdirir: defisit (“yalnız ayın sonuna qədər mövcuddur”), sosial sübut (“bir çox qonaqlar heyrandır”) və avtoritet (“şəxsən mən onu çox sevirəm”), sonra desert təklif edir. Orta çek artır."}]}]},{"id":"sv-checklist","cat":"SV","topic":"SV-3","title":"Barista üçün çek-list","blocks":[{"h":"Növbənin əvvəlində"},{"ul":["Kassanın və iş yerinin təmizliyini yoxlamaq","Bütün məhsulların və inqrediyentlərin olduğunu yoxlamaq","Cari aksiyalar və xüsusi təkliflərlə tanış olmaq","Müsbət əhval-ruhiyyəyə köklənmək"]},{"h":"İş zamanı"},{"ul":["Hər qonağı gülümsəyərək və göz təması ilə salamlamaq","Qonağın sifarişini aktiv dinləmək","Sifarişin detallarını dəqiqləşdirmək","Apsell və ya kross-sell təklif etmək","Sifarişi təsdiqləmək","Ödənişə görə təşəkkür etmək","Gözləmə haqqında məlumat vermək","Sifarişi nuş olsun arzusu ilə təqdim etmək","Ziyarətə görə təşəkkür edib yenidən dəvət etmək"]},{"h":"Münaqişə zamanı"},{"ul":["Sakit qalmaq","Qonağı dinləmək","Üzr istəmək","Həll yolu təklif etmək","Tez hərəkət etmək","Əks əlaqəyə görə təşəkkür etmək"]},{"h":"Növbənin sonunda"},{"ul":["İş yerini yığışdırmaq","Günün uğurlarını və səhvlərini təhlil etmək","Növbəti növbəyə hazırlaşmaq"]}]},{"id":"sn-hygiene","cat":"SN","topic":"SN-1","title":"Gigiyena və təhlükəsizlik","blocks":[{"note":"Çarpaz çirklənmə qidanın havadan, insandan, digər qidalardan, alətlərdən və ya iş səthlərindən mikroblarla çirklənməsidir!"},{"h":"Qaydalar"},{"ul":["Tez-tez istifadə olunan alətlər (temper, sürahi, təmizləyicilər) əlverişli yerlərdə yerləşdirilir.","Qızdırıcıdakı fincanlar, nəlbəkilər və qaşıqlar iş sahəsinin yanında yerləşdirilir.","Buxarlayıcı, bar səthi və portafiltr üçün dəsmallar təyin olunmuş yerlərdə saxlanılır.","Tökülmüş mayeni dərhal silin, təmizlik iş prosesi zamanı aparılır.","Bara girməzdən əvvəl və yemək, içmək, siqaret çəkdikdən sonra əlləri yuyun.","Bədəni, paltarı və önlüyü təmiz saxlayın, şəxsi gigiyena qaydalarına riayət edin.","Fincanların və sürahilərin kənarlarına toxunmayın.","Avadanlıqdan təhlükəsiz istifadə edin və təmizləyin, istehsalçının göstərişlərinə uyğun olaraq.","Kimyəvi maddələrdən təhlükəsiz istifadə edin, istehsalçının göstərişlərinə uyğun olaraq."]}]},{"id":"sn-bar","cat":"SN","topic":"SN-1","title":"Barda iş və FIFO","blocks":[{"p":"Xidmət sektoru kollektiv biznesdir. O, işin dəqiq təşkilini və komanda üzvləri arasında vəzifələrin bölüşdürülməsini tələb edir: sifarişlərin qəbulundan qonaqların ödənilməsinə qədər."},{"note":"Hər kəsin məqsədi eynidir — yüksək səviyyəli müştəri xidməti!"},{"ul":["Gülümsəyin və qonaqlarla göz təması qurun!","Avadanlığınızı və məhsullarınızı tanıyın!","Növbələri həmkarlarınıza təhvil verin və onlara anlayışla yanaşın!","İş yerinizi təmiz saxlayın!","FIFO (First In, First Out) qaydasına mütləq əməl edin: əvvəl daxil olan məhsul birinci istifadə olunur."]}]},{"id":"sn-guests","cat":"SN","topic":"SN-1","title":"Qonaqlarla iş: şikayət","blocks":[{"p":"Qonaq narazıdırsa, beş addım üzrə hərəkət edin."},{"ol":["Qonağın dediklərini dinləyin.","Dərhal və səmimi şəkildə üzr istəyin.","Qonağa vəziyyəti düzəltmək üçün nə edəcəyinizi deyin.","Vəziyyəti düzəltmək üçün müvafiq tədbirlər görün.","Qonağın razı qaldığına əmin olun və iş yerindəki prosedurları nəzərdən keçirin (lazım olduqda addımları qeyd edin)."]}]},{"id":"br-about","cat":"BR","topic":"BR-1","title":"SENSUM nədir","blocks":[{"p":"SENSUM özündə bir neçə istiqaməti cəmləşdirən brenddir. Bu istiqamətlərin hər biri bir-birinə xidmət edir. Brendin əsasında keyfiyyət, fərdi yanaşma, sistemlilik və unudulmaz hisslər və əhval-ruhiyyə bəxş edən yeni meyllərin tətbiqi durur."},{"h":"Adın mənası"},{"p":"Məna (lat.), duyğu (fr.), hiss (eng.). Brendin əsas missiyası — məna və hisslər bəxş etməkdir."},{"h":"Altı istiqamət"},{"ul":[{"b":"Significant Coffee","t":" — qəhvə fərdi zövqün incə nüanslarının fəlsəfəsi kimi: dənələrin qovrulmasından hazır məhsula qədər, hazır həllər və peşəkar qəhvə avadanlıqlarının satışı."},{"b":"Evolution Akademiya","t":" — incəsənət, qəhvə sənayesi, floristika, turizm və tədbirlərin təşkili sahəsində ixtisasartırma kursları."},{"b":"Nostalgia Tur-Konsyerj","t":" — yeni xatirələr yaradan səyahətlər; hər qonağın fərdi istəkləri nəzərə alınır."},{"b":"Satisfaction Floristika","t":" — müştərinin xarakterini nəzərə alan canlı eksklüziv kompozisiyalar və herbari, məkanın tərtibatı, landşaft layihələndirməsi."},{"b":"Universal Tədbirlərin təşkili","t":" — əhəmiyyətli tədbirlərin təşkili: festivallar, kostyumlu tamaşalar, master-klaslar."},{"b":"Memory Foto-Art","t":" — art-studiya: tematik foto layihələr və unudulmaz obrazlar."}]},{"note":"İstiqamətlərin adlarının ilk hərfləri SENSUM sözünü əmələ gətirir."}]},{"id":"br-mission","cat":"BR","topic":"BR-1","title":"Missiya, siyasət və kredo","blocks":[{"h":"Missiya"},{"p":"Brendin “əvvəlcə niyyət” şüuruna söykəndiyi barədə dəqiq anlayış yaratmaq, məhsul haqqında maarifləndirmək və məlumat vermək ki, müştəri tam məlumatlı və öz seçiminin sahibi olsun. Keyfiyyət uğurun əsas mühərrikidir, xidmətlərin çoxşaxəliliyi və müxtəlif çeşidli məhsullar isə müştərinin vaxtını optimallaşdırmağa imkan verir."},{"note":"Əsas missiya — məna və hisslər verməkdir! Emosiyalar, əhval-ruhiyyə, yanaşma, daimi innovasiya."},{"h":"Siyasət"},{"note":"Heç bir şərt altında brendin missiyasına xəyanət etməmək!"},{"h":"Brendin dayandığı üç əsas sütun"},{"ul":[{"b":"Təhlil","t":" — yalnız daimi təhlil yeni təkliflər üçün bizə silahlanmağa imkan verəcək."},{"b":"Şəbəkə və kommunikasiya","t":" — şəbəkə nə qədər böyükdürsə, brendin siyasət və yeniliklərini çatdırmaq üçün imkanlar bir o qədər çoxdur; işçilər arasında peşəkar kommunikasiya nəticənin məhsuldarlığını artırır."},{"b":"Unikallıq","t":" — yalnız məhsul və xidmətin unikallığı brendi eksklüzivliyə çatdıra bilər."}]},{"h":"Şirkətin kredosu"},{"p":"Yalnız istedad, bilik və uğur sinerjisi nəticələrin alınmasına gətirib çıxarır!"},{"ul":[{"b":"İstedad","t":" — üzərində çox dayanmayacaqsan və uzağa getməyəcəksən."},{"b":"Bilik","t":" — yeni tendensiyaların öyrənilməsi, öz üzərində daimi işləmək."},{"b":"Uğur","t":" — hərəkətin gedişatı və vaxtı."}]}]},{"id":"br-principles","cat":"BR","topic":"BR-1","title":"SENSUM-un yeddi prinsipi","blocks":[{"p":"Prinsiplərə riayət edərək, biz müştərilərimizdə qalıcı təsir buraxan və onlara xüsusi və bənzərsiz hiss etmələrinə kömək edən unikal və mənalı təəssüratlar yaratmağa çalışırıq."},{"ol":[{"b":"Mümkünsüz heç nə yoxdur!","t":" Biz inanırıq ki, mümkünsüz heç nə yoxdur və sərhədləri və məhdudiyyətləri aşmağa yönəlmişik."},{"b":"Həqiqət yalnız ünsiyyətdən doğur!","t":" Biz ünsiyyətə və əməkdaşlığa böyük əhəmiyyət veririk, çünki yalnız açıq və dürüst dialoq vasitəsilə həqiqi anlaşma və uğur əldə etmək olar."},{"b":"İşığı izləyərək öz rəngini seçirsən!","t":" Biz fərdiliyi və özünü ifadə etməyi təşviq edirik, müştərilərimizə öz unikal yollarını və kimliklərini müəyyən etməyə kömək edirik."},{"b":"Stəkan hər zaman doludur: yarısı maye, yarısı isə hava ilə!","t":" Biz etdiyimiz hər şeydə tarazlığı və harmoniyanı qorumağa çalışırıq: bütün elementlər harmoniyada olanda müsbət emosiya və əhval-ruhiyyə yaranır."},{"b":"Hər kəsin zamanı qiymətlidir!","t":" Müştərilərimizin vaxtını dəyərləndiririk və işimizin bütün aspektlərində səmərəliliyi və dəqiqliyi təmin etməyə çalışırıq."},{"b":"Hər şeyin bir cavabı var!","t":" Müştərilərimiz üçün cavablar və həll yolları tapmaq üçün bütün imkanları araşdırırıq."},{"b":"Güc birlikdədir!","t":" Biz komanda səyinin gücünü qəbul edirik və bütün müştərilərimiz, təchizatçılarımız və partnyorlarımızla tərəfdaşlıq əlaqələri qurmağa çalışırıq."}]}]},{"id":"br-service","cat":"BR","topic":"BR-1","title":"Keyfiyyətli xidmət","blocks":[{"p":"Hər bir işçi xidmətin əsas xüsusiyyətlərini təsvir edən seqment meneceri tərəfindən tərtib edilmiş proqrama uyğun olaraq təlim keçməlidir. Dress kod, danışıq nitqindən başlayaraq, məsuliyyət daşıdığı brend və məhsul və ya xidmət haqqında tam məlumatlılıqla bitir. Yalnız xidmət və kreativ yeniliklər brendi rəqiblərdən fərqləndirir."},{"ul":[{"b":"Bacarıqlar","t":" — istehlakçı ilə birbaşa təmasda olan işçi natiqlik bacarığına malik olmalıdır."},{"b":"Məlumat","t":" — hər bir işçi şirkətin siyasəti, məqsədləri və dəyərləri, brendin konsepsiyası haqqında tam məlumata malik olmalıdır."},{"b":"Məsuliyyət","t":" — öz məsuliyyət sahəsinin tam başa düşülməsi. “Bu mənim məsuliyyət sahəmdə deyil” ifadəsi qəbul edilmir: hər səhv şirkət üçün pul itkisi deməkdir. İşdə tam iştirak və komanda işində həmkarlarla əməkdaşlıq."}]}]},{"id":"br-customer","cat":"BR","topic":"BR-1","title":"Alıcıların tələbatları və təchizatçıların seçimi","blocks":[{"note":"Dürüstlük uzunmüddətli əlaqənin açarıdır! Qırmızı qırmızı olmalıdır və 35 sm — nə az, nə çox!"},{"h":"Alıcıların tələbatları necə ödənilir"},{"ol":["İstehlakçının (hədəf auditoriyasının) daimi təhlilini aparmaq və verilənlər bazasını doldurmaq: bu hərəkətlər yaxınlaşmağa və etibar qazanmağa kömək edir.","Aydın şəkildə yazılmış qiymət siyahıları, yolüstü adaptasiya olmadan, bütün hallar üçün əvvəlcədən yazılmış “yeməklər”.","Müştərilərdən lazımi məlumatları optimallaşdırılmış şəkildə əldə etmək üçün anketlər və sorğu formaları hazırlamaq."]},{"h":"Hər seqment nəyi müəyyən edir"},{"ul":[{"b":"Məqsəd","t":" — seqmentin müəyyən bir müddət üçün məqsədi nədir; komanda ilə dəqiq şəkildə yazmaq."},{"b":"Emosiyalar","t":" — müştəridən və ya sifarişçidən hansı emosiyaları gözləyirsiniz."},{"b":"Təklif","t":" — bizi rəqiblərdən fərqləndirən xidmətlərin siyahısı."},{"b":"Rəylər","t":" — bütün rəyləri qeyd etmək və sonradan düzəliş üçün bütün mənfi olanları qeyd etmək."}]},{"h":"Təchizatçı və tərəfdaşların seçiminə incə yanaşma"},{"p":"Əgər yüksək keyfiyyəti, eksklüzivliyi təbliğ ediriksə, “tapmadıq”, “təchizatçı yanıldı”, “çox bahalıdır” kimi ifadələrdən istifadə etmək haqqımız yoxdur. Hər bir seqment seçim üçün prioritetləri müəyyən etməli və lazım gəldikdə satınalma şöbəsinə məlumat verməli və ya onunla əməkdaşlıq etməlidir."},{"ul":["Seçim meyarları: təklif, alternativ, baza."]}]},{"id":"br-kpi","cat":"BR","topic":"BR-1","title":"KPI və strateji plan","blocks":[{"p":"Hər ilin noyabr ayında mütləq növbəti il üçün strateji plan tərtib edilməlidir. Planın prinsipi bunun üzərində qurulur: məqsədlər, təkliflər, hərəkətlər və nəticələr. Həm hədəflər üçün müəyyən edilmiş həcmlər baxımından gözlənilən gəlirin, həm də təklifin təşviqi üçün zəruri xərclərin pullaşdırılması məcburidir."},{"h":"Planın prioritetləri"},{"ul":[{"b":"Təhlil","t":" — istehlakçının xeyrinə bütün istiqamətlərdə hərtərəfli təhlil aparmaq."},"İnkişaf strategiyası və mənfəət bölgüsü.",{"b":"İşə sistemli yanaşma","t":" — həm seqmentlər daxilində, həm də seqmentlər arasında iş axını protokollarını, fəaliyyət iş planlarını, iş axınının hərəkətini və nümayəndəlik strukturlarını yaratmaq."},{"b":"Korporativ etika","t":" — həmkarları ilə ünsiyyət üsulları; görünüş etikası (biznes smart); korporativ məktubların göndərilməsi etikası və biliyi; vaxtın optimallaşdırılması, özünüzün və həmkarlarınızın."},{"b":"Sabitlik və məsuliyyət","t":" bütün proses boyunca."},{"b":"SMART","t":" — işçi təlimatı SMART konsepsiyaları üzrə: spesifiklik, tarazlıq, ardıcıllıq, reallıq, dəqiqlik (aydın deadline)."},{"b":"İnnovasiyalar","t":" — heç bir şeydə təkrarlanmamaq və hər yeni istehlakçı, hər yeni məhsul və xidmətlə inkişaf etmək."}]},{"h":"Alıcı ilə necə işləyirik"},{"ol":["Alıcının gözləntiləri və təqdim olunan məhsul arasında dəqiq balans yaratmaq.","Hər bir alıcını təqdim olunan məhsulun konsepsiyası barədə məlumatlandırmaq.","Məhsulun keyfiyyətinin nədə olduğunu və nəticəyə qədər hansı əməyin sərf olunduğunu izah etmək.","Hər istehlakçının onu unikal edən müstəsna keyfiyyətlərə malik xüsusi biri olduğunu göstərmək.","Alıcının vaxtına və vəsaitinə qənaət etmək.","Alıcılarımıza fərdiliyini üzə çıxarmaqda kömək etmək və bunun yollarını izah etmək.","Hazır kompleks həll təqdim etmək.","İstehlakçının qərarsızlığını və yeniliklərə qarşı etimadsızlığını aradan qaldırmaqla, yeni yanaşma təklif etmək.","Heç bir şeydə təkrarlanmamaq və hər yeni istehlakçı, məhsul və xidmətlə inkişaf etmək."]}]},{"id":"br-complex","cat":"BR","topic":"BR-2","title":"Kompleks son məhsul","blocks":[{"p":"Brendin siyasəti və strukturu həm seqment daxilində, həm də seqmentlərin məcmusunda inteqrasiya olunmuş yanaşma üzərində qurulub. Mürəkkəb məhsulların, xidmətlərin və biznes həllərinin yaradılması brendi uğurun zirvəsinə çatdıracaq."},{"h":"Kompleks yanaşma proqramları"},{"ul":["Tam təşkil olunmuş kofe müəssisəsi.","Təlimdən sonra işlə təmin olunma, SENSUM şirkəti daxil olmaqla.","Fiziki şəxslər (ad günü buketi, ad gününün tərtibatı, bayram tərtibatı və s.) və hüquqi şəxslər üçün floristik konsyerj.","Brend qrupları üçün xidmətlər kompleksi: brend qruplarının siyahısı və onların xidmətlər üzrə emalı, daha sonra brendin aparılması (güllər, kofe fasilələri, tədbirlər, timbildinq, bütün mümkün çəkiliş növləri və s.).","İxrac.","Landşaft dizaynının öyrənilməsi.","Emalatxana daxilində digər şirkətlər (potensial müştərilərimiz) üçün timbildinq təşkili.","Brend qrupları üçün kontent çəkilişi."]}]},{"id":"br-coffee","cat":"BR","topic":"BR-2","title":"SENSUM Specialty Coffee","blocks":[{"p":"Biz dünyaca məşhur təchizatçılarla işləyərək yerli istehsalın keyfiyyətli məhsullarından istifadə edən güclü bir brend təklif edirik. Məhsul portfelimiz daimi olaraq artacaq və bazarın dəyişikliklərini nəzərə alaraq son müştəri tələbləri və müştərilərimizin marağına uyğunlaşdırılacaq."},{"h":"Xidmətlərin unikal üstünlüyü"},{"ul":["Biz “Specialty” sinifinə aid kofe təqdim edirik.","Biz SCA proqramı çərçivəsində beynəlxalq səviyyəli təlimlər veririk.","Biz tərəfdaşlara istehsalatı göstərə və onları servisə apararaq, onların avadanlıqlarının necə istifadə olunduqlarını görmək imkanı yarada bilərik."]},{"h":"Qurmanlar"},{"p":"Kofe sənayesinin sürətli inkişafı ilə əlaqədar olaraq, bu içkiyə qiymət verən və əsl qurmanlar kateqoriyası meydana çıxdı."},{"h":"Bir dalğada"},{"p":"Barista və xidmət personalı daha çox şirkətin əsas “satış” bəndinə çevrilirlər. Onlar sadəcə kofe hazırlamır və çatdırmır, həm də qonaqlarla söhbətlər apararaq yalnız kofe haqqında deyil, həm də pəncərədən kənarda havanı müzakirə edirlər, müştərini tamamilə hiss edir və “tək-tək” yanaşırlar."},{"h":"Kanallar"},{"ul":["Biznes kafe","Şou-rum","Brendlərin distribyutorluğu","Kofe qovurma sexi"]}]},{"id":"br-roast","cat":"BR","topic":"BR-2","title":"Qovurma sexi və texniki dəstək","blocks":[{"h":"Qovrulmuş dənə"},{"ul":["Eviniz və ofisiniz üçün qovrulmuş qəhvə.","Biznesiniz üçün fərdi kofe qovurma profillərinin seçilməsi.","Brendiniz altında fərdi qablaşdırma imkanı.","Təkrar emal edilə bilən paketlər də daxil olmaqla geniş qablaşdırma seçimi.","Eviniz, ofisiniz və ya biznesiniz üçün istənilən həcmdə üyüdülmüş kofe."]},{"h":"Yaşıl dənə"},{"table":{"head":["Kateqoriya","Qiymət"],"rows":[["Sadə dənə","80–85"],["Mikrolotlar","85–89"],["Unikal və eksperimental kofe","90+"]]}},{"h":"Texniki dəstək"},{"ul":["Avadanlıqların quraşdırılması və tənzimlənməsi","Avadanlıqların diaqnostikası","Professional avadanlıqların təmiri","Superavtomat və avtomatik kofe maşınlarının təmiri","Kofe maşınlarının və üyüdücülərin peşəkar təmizlənməsi","Dekalsifikasiya"]}]},{"id":"br-academy","cat":"BR","topic":"BR-2","title":"SENSUM Education Akademiyası","blocks":[{"p":"Biz incəsənət, qəhvə sənayesi, floristika, turizm və tədbirlərin təşkili sahəsində mütəxəssislər üçün ixtisasartırma və peşəkar bacarıq kursları təklif edirik. Müxtəlif sahələrin tanınmış ekspertləri və səriştəli mentorları biliklərini bölüşür və yaxşı nəticələr üçün lazım olan işin incəliklərini öyrədirlər."},{"h":"Üç tədris istiqaməti"},{"ul":[{"b":"Kofe","t":" — işçilərin daxili kurslar və Specialty Coffee Association modulları üzrə təlimi, müntəzəm seminarlar və mühazirələr. Mütəxəssislər sizə dənələrin qovrulmasının incəliklərindən avadanlıqlara texniki dəstək bacarıqlarına qədər hər şeyi öyrədəcəklər."},{"b":"Floristika","t":" — tanınmış ekspertlər gözəllik və harmoniya dünyasına bələdçi olacaqlar: kompozisiyalar təkcə sənət əsəri kimi deyil, həm də floristik biznes üçün kommersiya məhsulu kimi qəbul edilir."},{"b":"Foto-art","t":" — art-studiyanın yüksək ixtisaslı mütəxəssisləri ideyaların texniki vizuallaşdırılmasının yeni imkanları ilə tanış olmaqda kömək edəcəklər. Qapılar öyrənməyə və potensialını həyata keçirməyə hazır olan hər kəs üçün açıqdır."}]},{"h":"Bilik, enerji, emosiyalar"},{"p":"Bilik (IQ), enerji (VQ) və emosiyalar (EQ) uğurun ən mühüm amilləridir. Uğura aparan yol dəyişikliklərə hazır olmaq və özünü yenidən kəşf etmək istəyindən başlayır."}]},{"id":"br-floristry","cat":"BR","topic":"BR-2","title":"SENSUM Floristry","blocks":[{"p":"Biz bütün çiçəklərin xüsusiyyətlərini və mənalarını özündə əks etdirən ensiklopediyanı yaradaraq yeni floristik dünyaya qapılar açırıq. Müştərinin xarakterini nəzərə alan canlı eksklüziv kompozisiyalar və herbari, məkanın kəsilmiş, qablı və süni bitkilərlə tərtibatı, landşaft layihələndirməsi."},{"h":"Niyə biz"},{"ul":["Hər bir müştəriyə fərdi yanaşma: müştərinin niyyətini və qəbul edənin xarakterini nəzərə alaraq gül kompozisiyalarının yaradılması.","Qeyri-standart yanaşma: çap materialları şəklində buketə əlavə olunan müəllif hekayələri, stereotipləri və fəlsəfəsi əsasında kompozisiya və buketlərin yaradılması.","Herbari (quru çiçəklər) ilə yaradıcı həll: xüsusi qulluq tələb etmir və uzun illər qoruna bilər.","Son məhsulun qablaşdırma dəsti ilə təqdim edilməsi: keyfiyyət nişanı, qulluq vərəqəsi, Krizal (qida mayəsi) və daşınma çantası.","Təsdiq edilmiş və etibarlı təchizatçıların seçimi.","Müəyyən etdiyiniz müddətdə əlamətdar tarixlərin təşkili və aparılması üçün tam məsuliyyət daşıyacaq şəxsi kurator."]},{"note":"Sizə qalan tək şey vaxtınızı sərbəst idarə etməkdir."},{"h":"Xidmətlər"},{"ul":["Fərdi tədbirlərin tərtibatı","Toy buketləri","Hədiyyələrin bağlanması","Fərdi herbari kompozisiyalarının yaradılması","Butiklərin tərtib edilməsi"]},{"h":"Floristik konsyerj"},{"ul":["Müqaviləyə uyğun olaraq müəyyən edilmiş müddətdə müştəri üçün əlamətdar tarixlərin məlumat bazasının aparılması.","Xüsusiyyətlər Ensiklopediyasına əsasən gələcək kompozisiyalar üçün rənglərin fərdi seçimi.","Gələcək konseptual kompozisiyaların stilistik quruluşunun hazırlanması.","Müştərinin seçimi ilə fərdi hekayələr və məktublar üçün mövzuların hazırlanması.","Müştərinin istəkləri nəzərə alınmaqla tədbirlərin dizaynının konsepsiyası və üslubu: məkanlar, texniki dəstək, əyləncə, video çəkiliş və montaj, dizayn.","Korporativ paketin və onun komponentlərinin yığılması.","Binaların yaşıllaşdırılmasının (tematik, mövsümi, əlamətdar) təqdimatı və sonradan qulluq.","Genişmiqyaslı tədbirlər üçün ideya və konsepsiyaların hazırlanması.","Səlahiyyətli məsələlər üzrə ödənişsiz məsləhət."]},{"h":"Rəng qammaları"},{"ul":[{"b":"Qırmızı","t":" — al-qırmızı, mərcan, marsala"},{"b":"Narıncı","t":" — kök, terrakota, kəhrəba"},{"b":"Sarı","t":" — solğun sarı, limon, yağ"},{"b":"Yaşıl","t":" — meşə, nanə, zeytun"},{"b":"Göy","t":" — kral göy, dəniz dalğası, mavi"},{"b":"Bənövşəyi","t":" — indiqo, yasəmən, gavalı"},{"b":"Ağ","t":" — brilyant ağ, tüstü, kokos"},{"b":"Qara","t":" — boz, fantom, qara"}]}]},{"id":"br-tour-event-photo","cat":"BR","topic":"BR-2","title":"Tur-konsyerj, Events və Photo Art","blocks":[{"h":"Nostalgia Tur-Konsyerj"},{"p":"Səyahətlər yeni xatirələr yaradır və dünya haqqında təsəvvürümüzü dəyişir. Biz hər kəsin fərdi istəklərini nəzərə alırıq ki, səyahət unudulmaz hekayəyə çevrilsin: ənənəvi istiqamətlərdən uzaqlaşaraq dünyanı yenidən kəşf edirik. İstirahətiniz SENSUM-a zəngdən başlayır!"},{"h":"Universal Tədbirlərin təşkili"},{"p":"Əhəmiyyətli tədbirlərin təşkilinə fərdi yanaşma asan məsələ deyil, lakin komandamız çətinliklərdən çəkinmir. Biz inanılmaz ideyaları həyata keçirir və biliyə, təcrübəyə və sərhədsiz təxəyyülə əsaslanaraq gözləntiləri aşırıq: festivallar, kostyumlu tamaşalar, master-klaslar."},{"ul":[{"b":"Dövlət layihələri","t":" — tədbirin hər bir mərhələsinin yaxşı hazırlanmış iş planına uyğun yüksək səviyyədə hazırlanması böyük məsuliyyətdir. İstənilən mürəkkəb və miqyaslı tapşırıqlar SENSUM mütəxəssislərinin peşəkar komandası tərəfindən ən qısa zamanda yerinə yetirilir."}]},{"h":"Memory Foto-Art"},{"p":"Art-studiya ən cəsarətli fantaziyaları həyata keçirməyə və unudulmaz xatirələr yaratmağa kömək edir. Tematik foto layihələrdə iştirak təsirli obrazların yaradılmasında ifadə olunan obrazın canlandırılması sənətinə yaxınlaşmağa imkan verir."},{"ul":["Korporasiyalar və ticarət qrupları üçün kontent çəkilişi hədəf auditoriyanın diqqətini cəlb etmək və müştərinin brend imicini dəstəkləmək üçündür."]}]},{"id":"br-priorities","cat":"BR","topic":"BR-3","title":"Üç prioritet: kompleks, uzunmüddətli, unikal","blocks":[{"h":"Kompleks"},{"p":"Seqmentin bütün və ya əksər xidmət və məhsullarından istifadə etməklə."},{"ol":["Tam təşkil olunmuş müəssisə və kofeyə aid avadanlıqlar.","Məhsul vasitəsilə cəlbetmə (kofe, güllər, şəkillər).","Tədbirlərdə floristik tərtibat, vitrin dizaynı, korporativ interyer dekor.","Korporativlər üçün hazır fotoicmal.","Dövlət tədbirləri, açılışlar, forumlar."]},{"h":"Uzunmüddətli"},{"p":"Seqmentin məhsul və xidmətləri üçün illik müqavilələr."},{"ol":["Eksport, kofe üzrə tenderlər, xidmət.","Çoxpilləli akademik kurslar.","Konsyerj və ticarət qrupları.","Korporasiyalar və ticarət qrupları üçün imicin dəstəyi məqsədilə kontent.","Hədiyyələr və illik festivallar."]},{"h":"Unikal"},{"p":"Hər bir seqment üzrə nou-haudan istifadə."},{"ol":["Fərdi kofe resepti imkanı.","Qəbul edənin xarakterinin fərqləndirici xüsusiyyətlərinin məcmusuna əsaslanan buket yaratmaq imkanı.","Floristik konsyerj: vaxtın optimallaşdırılması və buketin alınma müddətindən asılı olmayaraq unikallığı.","Unikal rekvizitlərlə unikal obrazlar yaratmaq imkanı: bəzi əşyalar dünyanın hər yerindən toplanıb, digərləri ustaların əlləri ilə hazırlanıb."]}]},{"id":"br-growth","cat":"BR","topic":"BR-3","title":"İnkişaf strategiyası","blocks":[{"p":"Brendin inkişaf strategiyasının məqsədləri: davamlı inkişafdan ölkənin inkişafına töhfəyə qədər."},{"ul":["Davamlı inkişaf.","Ölkənin müxtəlif platformalarda təmsili.","Dövlət səviyyəsində bütün seqmentlərdə assosiasiyaların yaradılması.","Dünya keyfiyyət nişanı.","Brend coğrafiyasının genişləndirilməsi.","Yeni keyfiyyət standartlarının etalon kimi müəyyən edilməsi.","Brend fəlsəfəsi ilə bağlı yeni seqmentlərin yaradılması.","Ölkənin iqtisadi və sosial inkişafı."]}]}],"lcats_az":{"CF":{"ic":"🌱","t":"Qəhvə","d":"Dənədən fincana: mənşə, emal, qovurma, espresso, süd, dəmləmə"},"SV":{"ic":"🤝","t":"Servis və satış","d":"Qonaqla ünsiyyət, sifarişin qəbulu, apsell və kross-sell, münaqişələr"},"SN":{"ic":"🧼","t":"Sanitariya və barda iş","d":"Gigiyena, barda nizam, FIFO, qonaqlarla işləmək"},"BR":{"ic":"⭐","t":"SENSUM brendi","d":"SENSUM-un missiyası, prinsipləri, istiqamətləri və strategiyası"}},"theory_ru":[{"id":"CF-01","topic":"CF-1","lvl lduğu kimi nazik köpüyə qədər çırpılır və latte-art düzəldilərək fincana tökülür. Çalınmış krem — qonağın istəyinə görə (Mocha, Mocha Caramel). Mocha Amaretto-da Amaretto Disaronno artıq fincanda şokolad sousu və espresso ilə birlikdə qarışdırılır, ayrıca tökülmür. Şokolad sousu ilə espresso qarışığı kofe maşınının buxar borusunda bir az qızdırılmalıdır ki, içki isti alınsın. Iced Mocha eyni məntiqlə hazırlanır (şokolad sousu + espresso hamar kütləyə qədər, süd, buzla şeyk) — dəyişiklik yoxdur."]},"changed":["mocha","mochacaramel","mochaamaretto","icedmocha"]},{"id":"c-20260824-3","date":"24.08.2026","type":"fix","title":{"ru":"Flat White — двойной ристретто вместо эспрессо","az":"Flat White — espresso əvəzinə dabl ristretto"},"items":{"ru":["Для Flat White эспрессо (18 г) варим как двойной ристретто — останавливаем экстракцию на пару секунд раньше обычного, чтобы получить выход 30–33 г и не добавлять лишнюю горечь. Дальше готовим как раньше: тонкая пена молока (≤0,5 см), контрастное вливание и лёгкий латте-арт."],"az":["Flat White üçün espresso (18 q) dabl ristretto kimi çəkilir — çıxış 30–33 q olsun deyə ekstraksiya adətdən bir neçə saniyə əvvəl dayandırılır ki, artıq acılıq olmasın. Davamı əvvəlki kimi: nazik süd köpüyü (≤0,5 sm), kontrastlı tökmə və yüngül latte-art."]},"changed":["flatwhite"]},{"id":"c-20260824-1","date":"24.08.2026","type":"fix","title":{"ru":"Milky Chocolate и Chocolate Pie — переход на шоколадный соус","az":"Milky Chocolate və Chocolate Pie — şokolad sousuna keçid"},"items":{"ru":["Milky Chocolate: вместо шоколада теперь шоколадный соус (заготовка) 70 г. Молоко, шоколадный соус и сливки добавляем в питчер вместе и взбиваем стимером до однородной массы с ровной пеной — без отдельного подогрева и размешивания ложкой. Дальше как раньше: переливаем в чашку и украшаем двумя маршмеллоу.","Chocolate Pie: вместо шоколада теперь шоколадный соус (заготовка) 50 г. В блендер — молоко, мороженое, шоколадный соус и бо́льшую часть Oreo, пробить до однородности. Сверху — взбитые сливки и декор из раскрошенного Oreo, как раньше."],"az":["Milky Chocolate: şokolad əvəzinə indi şokolad sousu (yarımfabrikat) 70 q. Süd, şokolad sousu və krem birlikdə pitcherə əlavə olunur və steamerdə hamar kütlə və bərabər köpük alınana qədər çırpılır — ayrıca qızdırma və qaşıqla qarışdırma yoxdur. Davamı əvvəlki kimi: fincana tökülür və iki marşmelou ilə bəzədilir.","Chocolate Pie: şokolad əvəzinə indi şokolad sousu (yarımfabrikat) 50 q. Blenderə — süd, dondurma, şokolad sousu və Oreo-nun böyük hissəsi, hamar olana qədər çəkilir. Üstünə — çalınmış krem və əzilmiş Oreo dekoru, əvvəlki kimi."]},"changed":["milkychoco","chocopie"]},{"id":"c-20260821-6","date":"21.08.2026","type":"fix","title":{"ru":"Взбивание сливок: Captain Irish и Coldy Mix","az":"Kremin çırpılması: Captain Irish və Coldy Mix"},"items":{"ru":["Captain Irish: сливки (50 г) взбиваем на капучинаторе и выкладываем сверху уже готового напитка (после того как ромово-кофейная смесь перелита в Brew Glass).","Coldy Mix: та же логика — после шейка и переливания в Martini Glass сливки (50 г) взбиваем на капучинаторе и добавляем сверху."],"az":["Captain Irish: krem (50 q) kapuçinatorla çırpılır və hazır içkinin (rom-qəhvə qarışığı Brew Glass-a töküldükdən sonra) üstünə qoyulur.","Coldy Mix: eyni məntiq — şeyk edib Martini Glass-a süzdükdən sonra krem (50 q) kapuçinatorla çırpılır və üstünə əlavə edilir."]},"changed":["captainirish","coldymix"]},{"id":"c-20260821-5","date":"21.08.2026","type":"fix","title":{"ru":"Espresso Macchiato — классический метод","az":"Espresso Macchiato — klassik üsul"},"items":{"ru":["Молоко (100 мл) взбиваем паром до плотной, пышной пены — глянцевой, без пузырей, идеально гладкой — и оставляем в питчере.","Варим один одинарный эспрессо (18 г) прямо в чашку 80 мл — без добавления молока в сам напиток.","Ложкой выкладываем пену горкой точно по центру: по краям остаётся видна крема, в середине — аккуратная белая шапочка.","Молоко не перемешиваем с эспрессо и не льём латте-артом — именно так, «с пятном» молочной пены, и выглядит классический Espresso Macchiato. Подаём со стаканом воды рядом.","Исключение — постоянные гости, которые привыкли к прежнему варианту с лёгким латте-артом: по их просьбе можно приготовить именно так."],"az":["Süd (100 ml) steamerlə sıx, qatı və parlaq köpük alınana qədər çırpılır — qabarcıqsız, tamamilə hamar — və pitcherdə saxlanılır.","Tək espresso (18 q) birbaşa 80 ml fincana çəkilir — içkinin özünə süd əlavə edilmir.","Qaşıqla köpük dəqiq ortaya təpəcik kimi qoyulur: kənarlarda krema görünür, ortada səliqəli ağ papaq qalır.","Süd espresso ilə qarışdırılmır və latte-art edilmir — məhz bu «ləkəli» köpük görünüşü klassik Espresso Macchiato-nun əlamətidir. Yanında bir stəkan su ilə verilir.","İstisna — əvvəlki yüngül latte-art variantına öyrəşmiş daimi qonaqlar: onların istəyi ilə məhz o üsulla da hazırlana bilər."]},"changed":["macchiato"]},{"id":"c-20260821-2","date":"21.08.2026","type":"fix","title":{"ru":"Подача Affogato","az":"Affogato-nun verilməsi"},"items":{"ru":["Эспрессо к Affogato подаётся отдельно, в соуснике — гость сам решает, сколько кофе добавить к мороженому."],"az":["Affogato-ya espresso ayrıca, sous qabında verilir — dondurmaya nə qədər qəhvə əlavə edəcəyini qonaq özü seçir."]},"changed":["affogato"]}];

  else{
    const idx=CHANGELOG.findIndex(c=>c.id===seenId);
    const freshOnes = idx===-1 ? [] : CHANGELOG.slice(0, idx);

  }
})();

/* ---- spotlight: a new drink pinned above «Напитки» until `end`; sales start on `start` (local dates, YYYY-MM-DD) ---- */
const SPOTLIGHT=[{"id":"lotuslatte","start":"2026-11-01","end":"2026-11-30"}];
function isoToday(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
function spotFor(id){const t=isoToday();return SPOTLIGHT.find(s=>s.id===id&&t<=s.end)||null;}
function dayMonth(iso){const [,m,d]=iso.split('-').map(Number);return `${d} ${T('months').split(',')[m-1]}`;}
let spotHTML=null;
function renderSpot(){
  const el=document.getElementById('spot-drinks'); if(!el)return;
  const t=isoToday(), s=SPOTLIGHT.find(x=>t<=x.end&&drinkById[x.id]), d=s&&drinkById[s.id];
  let h='';
  if(d&&!state.qDrinks&&drinkMatch(d)){ /* hidden while searching or when the filters exclude it */
    const on=t>=s.start, im=img(d.img), ing=d.ing.slice(0,4).map(i=>i[0].replace(/\s*\(.*?\)/g,'')).join(' · ');
    h=`<div class="spot" data-open="${d.id}">${im?`<img src="${im}" alt="">`:''}

  }

/* ---- promotions ---- */
function promoStatus(p){
  const n=new Date(), day=n.getDay(), m=n.getHours()*60+n.getMinutes();
  const tm=t=>{const a=t.split(':');return (+a[0])*60+(+a[1]);}, f=tm(p.from), e=tm(p.to);
  if(p.days.indexOf(day)<0)return{k:'day',t:p.daysOnly};
  if(m>=f&&m<e)return{k:'now',t:T('promo_now')};
  if(m<f)return{k:'later',t:T('promo_later').replace('{t}',p.from)};
  return{k:'ended',t:T('promo_ended')};
}
function promoCard(p){
  const st=promoStatus(p);
  return `<div class="promo${st.k==='now'?' now':''}" data-promo="${p.id}">
    <div class="pn serif">${p.icon} ${p.name}</div><div class="ps">${p.sub}</div>
    <div class="pp">${p.price}</div><div class="pt">${p.timeText} · ${p.daysText}</div>
    ${p.branches?`<div class="pb">📍 ${p.branches}</div>`:''}

/* drag-to-dismiss (свайп рукой вниз с любой точки карточки, независимо от прокрутки) */
(function(){
  const sheet=document.getElementById('sheet');
  let active=false, armed=false, startY=0, dy=0;
  const ARM_THRESHOLD=8;
  function onDown(e){
    if(e.target.closest('.close'))return;
    active=true; armed=false; startY=e.clientY; dy=0;
  }
  function onMove(e){
    if(!active)return;
    if(!armed){
      const rawDy=e.clientY-startY;
      if(rawDy>0){
        /* claim the gesture as early as possible (even below the arm threshold) so
           native rubber-band scrolling never gets a chance to take over on iOS —
           any downward drag closes the card, from any point, at any scroll position */
        e.preventDefault();
        if(rawDy>ARM_THRESHOLD){
          armed=true; startY=e.clientY; dy=0;
          sheet.classList.add('dragging');
          try{ sheet.setPointerCapture(e.pointerId); }catch(err){}
        }
      }
      return;
    }
    dy=e.clientY-startY; if(dy<0)dy=0;
    e.preventDefault();
    sheet.style.transform='translateY('+dy+'px)';
  }
  function onUp(){
    if(!active)return;
    active=false;
    if(!armed)return;
    armed=false;
    sheet.classList.remove('dragging');
    const threshold=Math.min(140, sheet.clientHeight*0.28);
    if(dy>threshold){
      sheet.style.transition='transform .2s ease';
      sheet.style.transform='translateY(100%)';
      setTimeout(()=>{ hideOverlay(); sheet.style.transition=''; sheet.style.transform=''; }, 180);
    } else {
      sheet.style.transition='transform .22s cubic-bezier(.2,.8,.2,1)';
      sheet.style.transform='translateY(0)';
      setTimeout(()=>{ sheet.style.transition=''; }, 230);
    }
    dy=0;
  }
  sheet.addEventListener('pointerdown', onDown);
  sheet.addEventListener('pointermove', onMove, {passive:false});
  sheet.addEventListener('pointerup', onUp);
  sheet.addEventListener('pointercancel', onUp);
})();
