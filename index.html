/* photo viewer: pinch / drag / double-tap zoom on the photo only */
(function(){
  const pv=document.getElementById('photoView'), im=pv.querySelector('img');
  const MAX=5; let s=1,tx=0,ty=0,g=null,moved=false,lastTap=0; const pts=new Map();
  function fit(){const vw=pv.clientWidth,vh=pv.clientHeight,nw=im.naturalWidth||vw,nh=im.naturalHeight||vh,k=Math.min(vw/nw,vh/nh);return{vw,vh,w:nw*k,h:nh*k};}
  function apply(){const f=fit(),mx=Math.max(0,(f.w*s-f.vw)/2),my=Math.max(0,(f.h*s-f.vh)/2);
    tx=Math.max(-mx,Math.min(mx,tx));ty=Math.max(-my,Math.min(my,ty));
    im.style.transform='translate('+tx+'px,'+ty+'px) scale('+s+')';}
  function reset(){s=1;tx=0;ty=0;im.style.transform='';}
  function mid(){const a=[...pts.values()];return a.length===2?{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}:{x:a[0].x,y:a[0].y,d:0};}
  function begin(){const m=mid();g={x:m.x,y:m.y,d:m.d,s:s,tx:tx,ty:ty};}
  function zoomAt(ns,px,py,b){const cx=pv.clientWidth/2,cy=pv.clientHeight/2;ns=Math.max(1,Math.min(MAX,ns));const k=ns/b.s;
    tx=(px-cx)-k*(b.x-cx-b.tx);ty=(py-cy)-k*(b.y-cy-b.ty);s=ns;}
  window.openPhoto=function(src){reset();im.src=src;pv.classList.add('show');};
  window.closePhoto=function(){pv.classList.remove('show');pts.clear();g=null;reset();};
  pv.addEventListener('pointerdown',e=>{
    if(e.target.closest('.pclose'))return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    try{pv.setPointerCapture(e.pointerId);}catch(err){}
    if(pts.size===1)moved=false; begin();
  });
  pv.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)||!g)return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const m=mid();
    if(pts.size>1||Math.hypot(m.x-g.x,m.y-g.y)>8)moved=true;
    if(pts.size>=2&&g.d>0){zoomAt(g.s*m.d/g.d,m.x,m.y,g);apply();}
    else if(s>1){tx=g.tx+(m.x-g.x);ty=g.ty+(m.y-g.y);apply();}
  });
  function up(e){
    if(!pts.has(e.pointerId))return;
    const tap=pts.size===1&&!moved&&e.type==='pointerup';
    const x=e.clientX,y=e.clientY;
    pts.delete(e.pointerId);
    if(pts.size>0)begin(); else g=null;
    if(pts.size===0&&s<1.05)reset();
    if(!tap)return;
    const now=Date.now();
    if(now-lastTap<300){
      lastTap=0;
      im.style.transition='transform .2s ease';
      if(s>1)reset(); else{zoomAt(2.5,x,y,{x:x,y:y,s:1,tx:0,ty:0});apply();}
      setTimeout(()=>{im.style.transition='';},220);
    }else{
      lastTap=now;
      if(s===1){const f=fit();if(Math.abs(x-f.vw/2)>f.w/2||Math.abs(y-f.vh/2)>f.h/2)closePhoto();}
    }
  }
  pv.addEventListener('pointerup',up);
  pv.addEventListener('pointercancel',up);
})();

const LEARN_KEY='sensum_learn';
/* What belongs to a person (cards learned, lessons read, attempts, test history) lives under their code, so another code on the same phone sees its own.
   The device keeps only who is logged in and what waits to be sent. Without a login the progress goes to the «guest» bucket. */
const USER_FIELDS=['box','quiz','att','read','examMonth','stats','progTs','progDirty','progChanges','progV','progRemoteTs','today','dailyDay','lastTest'];
function userDefaults(){return {box:{},quiz:[],att:[],read:{},progChanges:{},progV:0};}
function userKey(code){return LEARN_KEY+'_u_'+(code||'_guest');}
function readJSON(k){try{const a=JSON.parse(lsGet(k)||'null');return a&&typeof a==='object'&&!Array.isArray(a)?a:null;}catch(e){return null;}}
function pickUser(o){const u={};USER_FIELDS.forEach(k=>{if(o&&k in o)u[k]=o[k];});return u;}
/* One-time wipe of everything personal on the phone (cards, lessons read, history, attempts, the queue): raise RESET_EPOCH, ship, and every phone does it once
   at its next start. The login stays. Used to end a test period: the results sheet is cleared by hand, and this keeps old progress from flowing back into it. */
const RESET_EPOCH=1;
let LS=Object.assign({me:null,outbox:[],live:null,epoch:RESET_EPOCH},userDefaults());
(function(){
  let dev=readJSON(LEARN_KEY)||{};
  if(dev.epoch!==RESET_EPOCH){
    try{for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&k.indexOf(LEARN_KEY+'_u_')===0)localStorage.removeItem(k);}}catch(e){}
    dev={me:dev.me||null,outbox:[],live:null,epoch:RESET_EPOCH};
    lsSet(LEARN_KEY,JSON.stringify(dev));
  }
  const old=pickUser(dev);
  if(Object.keys(old).length){  /* older versions kept everything under one key: it goes to the person logged in, or to the guest */
    const k=userKey(dev.me&&dev.me.code);
    if(!readJSON(k))lsSet(k,JSON.stringify(old));
    USER_FIELDS.forEach(f=>delete dev[f]);
    lsSet(LEARN_KEY,JSON.stringify(dev));
  }
  Object.assign(LS,dev,userDefaults(),pickUser(readJSON(userKey(dev.me&&dev.me.code))));
})();
if(!Array.isArray(LS.outbox))LS.outbox=[];

function saveLearn(){
  const dev={},usr={};
  Object.keys(LS).forEach(k=>{(USER_FIELDS.includes(k)?usr:dev)[k]=LS[k];});
  lsSet(LEARN_KEY,JSON.stringify(dev)); lsSet(userKey(LS.me&&LS.me.code),JSON.stringify(usr));
}
/* another person (or nobody) uses the phone: keep this one's progress under their code and load the other's */
function switchUser(me){

  LS.me=me||null;

/* Progress protocol 2 merges changes per card. Never send a stale whole-phone snapshot. */
let progBusy=false, progTimer=0, progOff=false;
function initProgressSync(){
  if(LS.progV===2)return;
  const base=LS.stats&&LS.stats.progress&&LS.stats.progress.box, changes={}, ts=LS.progTs||Date.now();
  if(LS.progDirty||(!LS.progTs&&Object.keys(LS.box).length)){
    const keys=new Set([...Object.keys(LS.box),...Object.keys(base||{})]);
    keys.forEach(k=>{
      const v=LS.box[k]||0;
      if(base){if(v!==(base[k]||0))changes[k]={v,ts};}
      else if(v>0)changes[k]={v,ts,ifAbsent:true};  // unknown old baseline: only fill missing server cards
    });
  }
  LS.progChanges=changes;LS.progV=2;
  if(Object.keys(changes).length||(Object.keys(LS.read).length&&!LS.progTs))LS.progDirty=1;
  saveLearn();
}
function progressReady(){return !!(LS.stats&&LS.stats.progressProtocol===2);}
function queueProgress(){clearTimeout(progTimer);progTimer=setTimeout(pushProgress,3000);}
function touchProgress(k){
  initProgressSync();LS.progTs=Math.max(Date.now(),(LS.progTs||0)+1);LS.progDirty=1;
  if(k)LS.progChanges[k]={v:LS.box[k]||0,ts:LS.progTs};
  saveLearn();queueProgress();
}
function applyProgress(p){
  if(!p||typeof p!=='object')return;
  initProgressSync();
  let ch=false;
  (Array.isArray(p.read)?p.read:[]).forEach(id=>{const d=p.readAt&&p.readAt[id];if(!LS.read[id]){LS.read[id]=d||1;ch=true;}else if(LS.read[id]===1&&d){LS.read[id]=d;ch=true;}});
  if((p.ts||0)<(LS.progRemoteTs||0)){if(ch)saveLearn();return;}
  const sb=p.box&&typeof p.box==='object'&&!Array.isArray(p.box)?p.box:null;
  if(sb){
    const keys=new Set([...Object.keys(LS.box),...Object.keys(sb)]);
    keys.forEach(k=>{
      if(LS.progChanges[k]&&LS.progChanges[k].ifAbsent&&Object.prototype.hasOwnProperty.call(sb,k)){delete LS.progChanges[k];ch=true;}
      if(LS.progChanges[k])return;  // keep unsent edits; merge other cards from the other device
      if(Object.prototype.hasOwnProperty.call(sb,k)){if(LS.box[k]!==sb[k]){LS.box[k]=sb[k];ch=true;}}
      else if(k in LS.box){delete LS.box[k];ch=true;}
    });
  }
  if((p.ts||0)>(LS.progTs||0)){LS.progTs=p.ts;ch=true;}
  if((p.ts||0)>(LS.progRemoteTs||0)){LS.progRemoteTs=p.ts;ch=true;}
  if(ch)saveLearn();
  if(LS.progDirty&&progressReady())queueProgress();
}
function pushProgress(){
  clearTimeout(progTimer);progTimer=0;
  initProgressSync();
  if(!RESULTS_URL||!LS.me||!LS.progDirty||progBusy||progOff||!progressReady())return;
  const code=LS.me.code, ts=LS.progTs||Date.now(), changes=Object.assign({},LS.progChanges), read=Object.keys(LS.read).filter(k=>LS.read[k]), readAt={};
  read.forEach(k=>{const v=LS.read[k];if(typeof v==='string'&&/^\d{4}-\d\d-\d\d$/.test(v))readAt[k]=v;});
  progBusy=true;
  api(null,{action:'progress',protocol:2,code,read,readAt,changes,ts}).then(r=>{
    progBusy=false;
    if(!LS.me||LS.me.code!==code)return;
    if(r&&r.ok){
      Object.keys(changes).forEach(k=>{if(JSON.stringify(LS.progChanges[k])===JSON.stringify(changes[k]))delete LS.progChanges[k];});
      LS.progDirty=Object.keys(LS.progChanges).length||Object.keys(LS.read).some(k=>LS.read[k]&&!read.includes(k))?1:0;
      saveLearn();applyProgress(r.progress);
      if(r.owls&&r.owls.length)fetchStats();  /* a lesson finished a week or a category: the owls are on the sheet */
    }
  },()=>{progBusy=false;});
}

/* Tests a week. The quota comes from the sheet's script (LS.stats.limits.test: 3, a trainee 5; LS.stats.week.test = slots used; script v5.10); without it
   (an older script) nothing is limited. The phone also counts the tests it started (LS.att), because the stats may be a few minutes old or the phone offline.

const LIMIT_GROUP={mixed:'test'};
function weekStartTs(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime();}
function attempts(){

/* t.type: one (one right option) · multi (several) · order (put in order) · num (type a number); t.ans is an index, a list of indexes, or the number */
function mkTheoryQ(t){
  const q={id:t.id,isTheory:true,tt:t.type,text:t.q,sec:THEORY_SEC[t.type]};
  if(t.type==='num')return Object.assign(q,{val:t.ans,correct:String(t.ans)});
  q.opts=shuffle(t.opts);
  if(t.type==='one')q.correct=t.opts[t.ans];
  else if(t.type==='multi'){q.set=t.ans.map(i=>t.opts[i]);q.correct=q.set.join(', ');}
  else{q.seq=t.ans.map(i=>t.opts[i]);q.correct=q.seq.map((o,i)=>(i+1)+'. '+o).join(' → ');}

function buildTheoryQuiz(items,n=10){

/* -- question generators -- */
const QRX=/^(\d+(?:[.,]\d+)?)\s*(г|мл|шт|q|ml|əd)$/, DECOR=/декор|dekor/i;
function parseQ(q){const m=QRX.exec((q||'').trim());return m?{n:parseFloat(m[1].replace(',','.')),u:m[2],comma:m[1].includes(',')}:null;}
function niceNum(n,u){if(u==='шт'||u==='əd')return Math.max(1,Math.round(n));if(n>=100)return Math.round(n/10)*10;if(n>=20)return Math.round(n/5)*5;if(n>=3)return Math.round(n);return Math.round(n*2)/2;}
function fmtNum(n,comma){const s=String(Math.round(n*10)/10);return comma?s.replace('.',','):s;}
function ingPool(){return [...drinks,...preps].flatMap(x=>x.ing||[]);}
function ingFreq(){const f={};ingPool().forEach(([n])=>{const k=n.toLowerCase();f[k]=(f[k]||0)+1;});return f;}
function firstWord(s){return (s.toLowerCase().match(/[a-zа-яёəıöüçşğ]+/i)||[''])[0];}
function mkQ(type,x,text,correct,wrong,explain,im){
  if(!wrong||wrong.length<3)return null;
  return {type,id:x.id,isPrep:!!x.kind,isVit:!!x.alg,text,correct,opts:shuffle([correct,...wrong.slice(0,3)]),explain,img:im||null};
}
function distinctNames(list,exclude,n){
  const out=[],seen=new Set(exclude.map(s=>s.toLowerCase()));
  for(const s of list){const k=s.toLowerCase();if(!seen.has(k)){seen.add(k);out.push(s);if(out.length>=n)break;}}
  return out;
}
function genDose(x){
  for(const [n,q] of shuffle(x.ing.filter(([n,q])=>!DECOR.test(n)&&parseQ(q)))){
    const p=parseQ(q), seen=new Set([p.n]), out=[];
    /* first: real doses of the same ingredient elsewhere (the confusions that actually happen) */
    shuffle(ingPool().filter(([m])=>m.toLowerCase()===n.toLowerCase()).map(([,qq])=>parseQ(qq)))
      .forEach(r=>{if(r&&r.u===p.u&&!seen.has(r.n)&&out.length<2){seen.add(r.n);out.push(r.n);}});
    for(const k of shuffle([0.5,0.6,0.75,1.25,1.4,1.5,2])){if(out.length>=3)break;const v=niceNum(p.n*k,p.u);if(v>0&&!seen.has(v)){seen.add(v);out.push(v);}}
    for(let s=1;out.length<3&&s<20;s++)[p.n+s,p.n-s].forEach(v=>{if(out.length<3&&v>0&&!seen.has(v)){seen.add(v);out.push(v);}});
    const q2=mkQ('dose',x,LT('q_dose',{item:x.name,ing:n}),q,out.map(v=>fmtNum(v,p.comma)+' '+p.u),`${n} — ${q}`);
    if(q2)return q2;
  }

}
function genComp(x){
  const cands=x.ing.filter(([n])=>!DECOR.test(n)); if(!cands.length)return null;
  const f=ingFreq(), right=shuffle(cands).sort((a,b)=>(f[a[0].toLowerCase()]||0)-(f[b[0].toLowerCase()]||0))[0][0];
  const own=x.ing.map(i=>i[0]), ownW=new Set(own.map(firstWord));
  const group=x.kind?preps:drinks, same=group.filter(o=>o!==x&&(x.kind?o.kind===x.kind:o.cat===x.cat));
  const names=[...shuffle(same),...shuffle(group.filter(o=>o!==x))].flatMap(o=>o.ing.map(i=>i[0]))
    .filter(n=>!DECOR.test(n)&&!ownW.has(firstWord(n)));
  return mkQ('comp',x,LT('q_comp',{item:x.name}),right,distinctNames(names,own,3),own.filter(n=>!DECOR.test(n)).join(', '));
}
function genPhoto(x){

    .filter(d=>d!==x&&imgHash(d.img)!==imgHash(x.img)).map(d=>d.name); /* some drinks share one photo under different file names (e.g. the Raf family); the hash in the name is the content */
  return mkQ('photo',x,LT('q_photo'),x.name,distinctNames(pool,[x.name],3),x.name,x.img);
}
function genVessel(x){

function genStorage(x){

function genUsed(x){
  if(!x.kind)return null;

  const trig=x.trig&&x.trig!=='§нет§'?x.trig:null;

  const bad=drinks.filter(d=>!used.includes(d.id)&&!(trig&&d.ing.some(([n])=>n.toLowerCase().includes(trig)))).map(d=>d.name);
  const right=drinkById[pick(used)].name;

/* -- exam-style questions across recipes (the written Foundation exam asks these): «в каком напитке…», «какой НЕ содержит…», «у какого больше всего…» --
   The subject x is always the right answer, and every wrong option is checked against the recipes, so exactly one option is right. */
/* loose «has this ingredient»: the same name, one inside the other, or the same first word (single and double espresso are both «Эспрессо»); used to keep wrong options clean */
function dMentions(d,k){const w=firstWord(k);return d.ing.some(([n])=>{const a=n.toLowerCase();return a===k||a.includes(k)||k.includes(a)||(w&&firstWord(a)===w);});}

function drinkIndex(){const m={};drinks.forEach(d=>d.ing.forEach(([n])=>{if(DECOR.test(n))return;const k=n.toLowerCase();const e=m[k]||(m[k]={name:n,ds:[]});if(!e.ds.includes(d))e.ds.push(d);}));return m;}
function sameCatFirst(list,x){return [...shuffle(list.filter(d=>d.cat===x.cat)),...shuffle(list.filter(d=>d.cat!==x.cat))];}
function genHas(x){
  if(x.kind)return null;
  const idx=drinkIndex();
  for(const k of shuffle(x.ing.map(i=>i[0].toLowerCase()).filter(k=>idx[k]&&idx[k].ds.length<=6))){
    const wrong=sameCatFirst(drinks.filter(d=>d!==x&&!dMentions(d,k)),x).map(d=>d.name);
    const q=mkQ('has',x,LT('q_used',{item:idx[k].name}),x.name,distinctNames(wrong,[x.name],3),`${idx[k].name}: ${idx[k].ds.map(d=>d.name).join(', ')}`);
    if(q){q.meta={k};return q;}
  }
  return null;
}
function genWithout(x){
  if(x.kind)return null;
  const idx=drinkIndex(), inCat=k=>idx[k].ds.filter(d=>d.cat===x.cat).length;
  /* an ingredient that the drinks of x's own category use, and x doesn't: the wrong options are real look-alikes */
  const keys=shuffle(Object.keys(idx).filter(k=>idx[k].ds.length>=3&&inCat(k)>=2&&!dMentions(x,k)));
  for(const k of keys.slice(0,8)){
    const q=mkQ('without',x,LT('q_without',{ing:idx[k].name}),x.name,distinctNames(sameCatFirst(idx[k].ds,x).map(d=>d.name),[x.name],3),`${idx[k].name}: ${idx[k].ds.slice(0,6).map(d=>d.name).join(', ')}`);
    if(q){q.meta={k};return q;}
  }
  return null;
}
function genBoth(x){
  if(x.kind)return null;
  const names=x.ing.map(i=>i[0]).filter(n=>!DECOR.test(n)), pairs=[];
  for(let i=0;i<names.length;i++)for(let j=i+1;j<names.length;j++)pairs.push([names[i],names[j]]);
  for(const [a,b] of shuffle(pairs).slice(0,24)){
    const ka=a.toLowerCase(), kb=b.toLowerCase();
    /* every wrong option has one of the two, never both */

function buildQuiz(items,scope=L.scope,n=10,extra=true){
  const N=Math.min(n,items.length*3), qs=[], keys=new Set();
  const W=scope==='vitrina'?[['vcomp',4],['vhas',2],['vnot',2],['valg',3],['vstor',1],['vlife',1]]:scope==='preps'?[['dose',4],['comp',2],['shelf',3],['used',3],['storage',1]]:[['dose',4],['comp',3],['photo',3],['vessel',1]].concat(extra?[['has',2],['without',1],['both',1],['most',2],['same',1]]:[]);
  let order=shuffle(items), oi=0;

}

/* -- «План на сегодня»: what to do now. Up to three rows: study (the next unread lesson of the person's level, or the weakest card deck),
   a counted test (the group with more attempts left), or the monthly exam, or practice when the week is used up. A row is ticked when it was done today
   (LS.today, in the person's bucket); the dot on the «Обучение» tab says nothing was done today. -- */
/* the day in Baku (UTC+4, no summer time): lessons are dated with it, like the sheet's weeks */
function bakuDay(ts){return new Date((ts||Date.now())+4*36e5).toISOString().slice(0,10);}
function dayLocal(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
function todayDone(){const t=LS.today;return t&&t.day===dayLocal()&&Array.isArray(t.done)?t.done:[];}
function markToday(k){
  const d=dayLocal(); if(!LS.today||LS.today.day!==d)LS.today={day:d,done:[]};
  if(!LS.today.done.includes(k)){LS.today.done.push(k);saveLearn();}
  updLearnDot();
}
function planOn(){return !RESULTS_URL||!!LS.me;}
function updLearnDot(){const d=document.getElementById('learndot');if(d)d.style.display=RESULTS_URL&&LS.me&&!todayDone().length&&!(dailyOpen()&&dailyDone())?'block':'none';}
function nextLesson(){
  const my=new Set(levelSet(myLvl()).map(t=>t.topic));
  return LES.find(x=>!LS.read[x.id]&&my.has(x.topic))||LES.find(x=>!LS.read[x.id])||null;
}
function weakestDeck(){
  return ['d','p','v'].map(s=>{const a=matAll(s);return {s,n:a.length,k:learnedCount(a)};}).filter(x=>x.n).sort((a,b)=>a.k/a.n-b.k/b.n)[0]||null;
}
function planTest(){
  const a=attempts();
  if(!a)return {scope:'mixed'};  /* no limits (an older script, no sheet) */
  if(!a.left)return null;
  if(a.day)return {locked:true};
  return {scope:'mixed',att:a};
}
function planItems(){
  const done=todayDone(), out=[], les=nextLesson(), w=les?null:weakestDeck(), ds=dailyStreak();
  if(dailyOpen())out.push(dailyDone()?{k:'daily',done:true,ic:'✓',t:T('daily_done'),d:ds?LT('daily_streak',{n:daysTxt(ds)}):'',go:'mat'}
    :{k:'daily',ic:'📅',t:T('daily_title'),d:LT('daily_d',{n:DAILY_N}),go:'daily'});
  const study=les?{ic:'📖',t:LT('plan_les',{name:les.title}),d:`${(LCATS[les.cat]||{}).t||''} · ${TTOPICS[les.topic]||''}`,go:'les:'+les.id}
    :w?{ic:'🃏',t:LT('plan_cards',{name:matInfo(w.s).t}),d:`${T('lp_learned')}: ${w.k} / ${w.n}`,go:'cards:'+w.s}:null;
  if(study)out.push(done.includes('study')?{k:'study',done:true,ic:'✓',t:T('plan_study_done'),d:LT('plan_next',{name:les?les.title:matInfo(w.s).t}),go:study.go}:Object.assign({k:'study'},study));
  const pt=planTest(), last=LS.quiz[0], game=RESULTS_URL&&LS.me&&!L.noGame&&LS.stats;
  if(done.includes('test'))out.push({k:'test',done:true,ic:'✓',t:T(last?(testPassed(last)?'plan_test_passed':'plan_test_review'):'plan_test_done'),d:last?`${T('lp_last')}: ${last.score}/${last.total} · ${last.scope}`:'',go:pt&&pt.scope?'test:'+pt.scope:'mat'});
  else if(pt&&pt.locked)out.push({k:'free',ic:'⏳',t:T('plan_test_tomorrow'),d:T('plan_free_d'),go:'mat'});
  else if(pt)out.push({k:'test',ic:'📝',t:T('plan_test_all'),d:pt.att?attBadge(pt.att):T('quiz_week_d'),go:'test:mixed'});
  else if(game&&!examDone())out.push({k:'test',ic:'🏆',t:T('exam_title'),d:T('exam_reward'),go:'exam'});
  else out.push({k:'free',ic:'✨',t:T('plan_free'),d:T('plan_free_d'),go:'mat'});
  return out;
}
/* -- «Вопрос дня»: 3 questions once a day (the weakest cards of a recipe part, a theory question of an open topic), outside the weekly limit.
   Only with script v5.6 (?action=me returns daily), which keeps it on its own sheet: an older script would file it as a test. -- */
function dailyOpen(){return !!(RESULTS_URL&&LS.me&&!L.noGame&&LS.stats&&LS.stats.daily);}
function dailyDone(){const g=LS.stats;return LS.dailyDay===dayLocal()||!!(g&&g.daily&&g.daily.done&&new Date(g.at||0).toDateString()===new Date().toDateString());}
function dailyStreak(){const g=LS.stats;return g&&g.daily?g.daily.streak||0:0;}
function daysTxt(n){return n+' '+(LANG==='ru'?plural(n,'день','дня','дней'):'gün');}
function weakest(list,n){return shuffle(list).sort((a,b)=>boxOf(a)-boxOf(b)).slice(0,n);}
function dailyQuestions(){
  const parts=shuffle([['drinks',trainable(drinks)],['preps',trainable(preps)],['vitrina',vit]]).filter(p=>p[1].length);
  const P=passedTopics(), th=levelSet(myLvl()).filter(t=>P.has(t.topic)), qs=[];
  const add=q=>{if(q&&!qs.some(x=>x.id===q.id&&!!x.isTheory===!!q.isTheory))qs.push(q);};
  if(parts.length)add(buildQuiz(weakest(parts[0][1],8),parts[0][0],1,false)[0]);
  if(th.length)add(buildTheoryQuiz(th,1)[0]);
  for(let i=1;qs.length<DAILY_N&&i<12&&parts.length;i++){const [s,l]=parts[i%parts.length];add(buildQuiz(weakest(l,8),s,1,false)[0]);}
  return shuffle(qs.slice(0,DAILY_N));
}
function startDaily(){
  if(!dailyOpen()||dailyDone())return;
  const qs=dailyQuestions(); if(!qs.length)return;
  LS.dailyDay=dayLocal(); saveLearn();  /* a started one is the day's, finished or not */
  beginQuiz(qs,'daily',T('daily_title'));
}
/* the week at a glance (script v5.8): five tests (drinks, preps, vitrina, theory twice) and two lessons; a green tick is counted,
   a ring is a test taken below 70% that can be taken again. The lessons are also counted from the days kept on the phone, so a lesson shows at once. */
function weekStartStr(){const d=new Date(Date.now()+4*36e5);d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return d.toISOString().slice(0,10);}
function weekLessons(p){const w=weekStartStr();let n=0;Object.keys(LS.read).forEach(k=>{const v=LS.read[k];if(typeof v==='string'&&v>=w)n++;});return Math.max(p.lessons||0,n);}
function weekSteps(){
  const g=LS.stats, p=g&&g.plan; if(!p||!RESULTS_URL||!LS.me)return null;
  const N=p.testsNeed||3, got=(p.tests&&p.tests.test)||0, low=(p.tried&&p.tried.test)||0;
  const steps=Array.from({length:N},(_,i)=>({ic:'📝',t:T('plan_test_all'),st:i<got?'done':i===got&&low>0?'tried':'open'}));
  const les=weekLessons(p);
  [0,1].forEach(i=>steps.push({ic:'📖',t:T('week_lesson'),st:les>i?'done':'open'}));
  return steps;
}
function weekStrip(){
  const st=weekSteps(); if(!st)return '';
  const n=st.filter(x=>x.st==='done').length;
  return `<div class="wstrip" role="img" aria-label="${LT('week_of',{n,m:st.length})}">${st.map(x=>`<span class="ws ${x.st}" title="${esc(x.t)}">${x.st==='done'?'✓':x.st==='tried'?'↺':x.ic}</span>`).join('')}<small>${LT('week_of',{n,m:st.length})}</small></div>
    <p class="hint wlead">${T('week_hint')}</p>`;
}
/* «План месяца» (script v5.9): the share of the month's training plan done, what it costs against the KPI, and a warning in good time.
   `stats.kpi` is the script's: weeks 60% + exam 20% + quality 10% + regularity 10%; from the threshold nothing is lost. A trial month shows it without a loss. */
function daysLeftInMonth(){const [y,m,d]=bakuDay().split('-').map(Number);return new Date(Date.UTC(y,m,0)).getUTCDate()-d;}
function kpiCard(){
  const g=LS.stats, k=g&&g.kpi; if(!k||!RESULTS_URL||!LS.me)return '';
  const P=v=>v==null?'—':v+'%', live=k.state==='live', left=daysLeftInMonth(), friday=new Date(Date.now()+4*36e5).getUTCDay()===5;
  if(k.pct==null)return `<div class="lpanel kpi"><div class="lph serif"><span>${T('kpi_title')}</span></div><p class="hint u-m0">${T('kpi_none')}</p></div>`;
  const worst=Math.max(k.loss,k.lossIfExamMissed||0), warn=worst>0&&(left<=2||friday);
  const lines=[];
  if(!live)lines.push(T('kpi_trial'));
  lines.push(k.loss>0?LT(live?'kpi_loss_live':'kpi_loss_trial',{n:k.loss}):LT('kpi_ok',{thr:k.threshold}));
  if(k.examPending&&k.lossIfExamMissed>k.loss)lines.push(LT('kpi_exam',{n:k.lossIfExamMissed}));
  if(k.graceUntil&&k.graceUntil>=bakuDay())lines.push(LT('kpi_grace',{d:dayMonth(k.graceUntil)}));
  if(k.absentDays)lines.push(LT('kpi_away',{n:k.absentDays}));
  const row=(t,v)=>`<div class="prow2"><span>${T(t)}</span><b>${v}</b></div>`;
  return `<div class="lpanel kpi${warn?' warn':''}"><div class="lph serif"><span>${T('kpi_title')}</span><small>${LT('kpi_head',{pct:k.pct,thr:k.threshold})}</small></div>
    <span class="bar kbar"><i style="width:${Math.min(100,k.pct)}%"></i><u style="left:${k.threshold}%"></u></span>
    ${row('kpi_p_weeks',P(k.parts.weeks))}${row('kpi_p_exam',k.examPending?T('kpi_exam_wait'):P(k.parts.exam))}${row('kpi_p_quality',P(k.parts.quality))}${row('kpi_p_reg',P(k.parts.regularity))}
    ${warn?`<p class="note kwarn">${LT('kpi_warn',{n:left,pct:k.pct,thr:k.threshold})}</p>`:''}
    <p class="hint kl">${lines.join(' ')}</p></div>`;
}
function planCard(){

function answer(i,x){

  const your=i>=0?q.opts[i]:i===-3?x.your:T(i===-1?'q_timeout':'q_away');
  z.right=right;
  if(right)z.score++;
  else{if(i===-1)z.timeouts++; else if(i===-2)z.away++;
    z.mistakes.push({text:q.text,your,correct:q.correct,id:q.id,q});}
  /* a wrong answer sends the item back to the start of the flashcard queue; theory has no cards, so there a right answer moves the question up a box */
  const it=q.isTheory?TH.find(t=>t.id===q.id):itemById(q.id,q.isPrep,q.isVit);
  if(it&&(!right||q.isTheory)){const k=boxKey(it);LS.box[k]=right?Math.min(5,(LS.box[k]||0)+1):0;touchProgress(k);}
  liveSave(z); renderLearn();

function submitComplex(){

    if(!t||isNaN(Number(t)))return;
    z.numv=raw; answer(-3,{ok:Number(t)===q.val,your:raw});
  }else{
    const got=z.sel.map(i=>q.opts[i]);
    if(!got.length||(q.tt==='order'&&got.length<q.opts.length))return;
    if(q.tt==='multi')answer(-3,{ok:got.length===q.set.length&&q.set.every(o=>got.includes(o)),your:got.join(', ')});

}
function nextQ(){
  const z=L.qz; z.i++; z.picked=null; z.sel=[]; z.numv=''; z.deadline=Date.now()+qsec(z.qs[z.i])*1000;
  if(z.i<z.qs.length){renderLearn();toTop();return;}
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  z.result={score:z.score,total:z.qs.length,scope:z.scope,mistakes:z.mistakes,
    secs:Math.round((Date.now()-z.t0)/1000),timeouts:z.timeouts,away:z.away,
    date:`${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`};
  if(!z.practice&&LIMIT_GROUP[z.kind]&&z.score/z.qs.length<testPassThreshold())LS.att=(LS.att||[]).filter(a=>a.ts!==z.t0);
  if(z.kind==='check'){
    const need=checkNeed(z.qs.length), pass=z.score>=need, les=LES.find(x=>x.id===z.lid), c=z.result.check={pass,need,lid:z.lid,opened:''};
    if(pass&&les&&!LS.read[les.id]){
      const had=passedTopics().has(les.topic);
      LS.read[les.id]=bakuDay(); touchProgress(); markToday('study');
      if(!had&&passedTopics().has(les.topic))c.opened=TTOPICS[les.topic];
    }
  }
  else if(z.kind==='daily')markToday('daily');
  else if(!z.practice){LS.quiz.unshift({score:z.score,total:z.qs.length,scope:z.scope,date:z.result.date}); LS.quiz=LS.quiz.slice(0,30); markToday('test');}
  if(z.rec){liveSave(z);const r=liveSend(z.rec,false);z.result.sendId=r.id;SEND[r.id]='wait';}
  saveLearn();
  learnGo('result');
  flushOutbox();
}

/* -- honesty of a test: 15 s per question, leaving the app counts as a wrong answer, leaving the test as aborted -- */
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function mmss(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
/* the attempt as it will be sent, kept in LS.live while it runs: a test closed half-way still reaches the sheet as aborted */
function liveSave(z){
  if(!z||!z.rec)return;
  Object.assign(z.rec,{score:z.score,timeouts:z.timeouts,away:z.away,upd:Date.now(),
    mistakes:z.mistakes.map(m=>({q:m.text,a:m.your,c:m.correct}))});
  LS.live=z.rec; saveLearn();
}
function liveSend(rec,aborted){
  const end=rec.upd||Date.now(), {t0,upd,...r}=rec;
  Object.assign(r,{ts:end,secs:Math.max(0,Math.round((end-t0)/1000)),aborted});
  LS.outbox.push(r); LS.live=null; saveLearn();
  return r;
}
function quizRunning(){return L.view==='quiz'&&!!L.qz;}
/* every way out of a running test asks first; questions left unanswered count as wrong */
function quizGuard(){
  if(!quizRunning())return true;
  if(!confirm(T(L.qz.practice?'q_abort_practice':'q_abort_ask')))return false;
  const z=L.qz; L.qz=null; const p=learnPop();  /* back to the screen the test was started from */
  if(z.rec){liveSave(z);liveSend(z.rec,true);flushOutbox();}
  renderLearn(); document.getElementById('scrollArea').scrollTop=p.y||0;
  return true;
}
function quizTick(){
  const z=L.qz; if(L.view!=='quiz'||!z||z.picked!==null)return;
  const left=z.deadline-Date.now();
  if(left<=0){answer(-1);return;}
  const row=document.getElementById('qtrow'); if(!row)return;
  row.classList.toggle('low',left<=5000);
  document.getElementById('qtbar').style.width=(left/(qsec(z.qs[z.i])*10))+'%';
  document.getElementById('qtsec').textContent=Math.ceil(left/1000);
}
setInterval(quizTick,200);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&L.view==='quiz'&&L.qz&&L.qz.picked===null)answer(-2);});

/* -- sending results to the trainer's sheet -- */
const SEND={};  // attempt id -> 'wait' | 'sent' | 'queued' | 'rejected' | 'examdone'
const REWARD={};  // attempt id -> {xp, owls:[{why, n}]} as counted by the sheet
let flushing=false;
let rewardTimer=0, rewardDelay=15000;
function api(params,body){
  if(RESULTS_URL==='demo')return new Promise(r=>setTimeout(()=>r(body?{ok:true}:{ok:true,name:T('id_demo'),branch:'Central Park'}),400));
  /* text/plain keeps it a simple request: Apps Script answers without a CORS preflight */
  const req=body?fetch(RESULTS_URL,{method:'POST',body:JSON.stringify(body),cache:'no-store'}):fetch(RESULTS_URL+'?'+new URLSearchParams(params),{cache:'no-store'});
  return req.then(r=>r.json());
}
function showSend(){const r=L.qz&&L.qz.result, el=document.getElementById('sendstat');
  if(L.view==='result'&&r&&el){el.outerHTML=sendStatus(r);} else if(L.view==='home'&&state.tab==='learn')renderLearn();}
async function flushOutbox(){
  if(!RESULTS_URL||flushing||!LS.outbox.length)return;
  clearTimeout(rewardTimer);rewardTimer=0;
  flushing=true; let sent=false;
  for(const item of LS.outbox.slice()){
    let res;
    try{res=await api(null,item);}catch(e){SEND[item.id]='queued';break;}  /* offline: keep the rest for later */
    if(res&&res.ok){SEND[item.id]='sent';sent=true;rewardDelay=15000;if(res.xp!=null)REWARD[item.id]={xp:res.xp,owls:res.owls||[],over:!!res.over,daily:res.daily||null};}
    else if(res&&res.error==='reward_pending'){
      SEND[item.id]='rewardpending';sent=true;
      if(!document.hidden){rewardTimer=setTimeout(flushOutbox,rewardDelay);rewardDelay=Math.min(120000,rewardDelay*2);}
      break;
    }
    else if(res&&res.error==='exam_done'){SEND[item.id]='examdone';}
    else if(res&&res.error==='unknown_code'){SEND[item.id]='rejected';if(LS.me&&LS.me.code===item.code)switchUser(null);}
    else{SEND[item.id]='queued';break;}
    LS.outbox=LS.outbox.filter(x=>x.id!==item.id); saveLearn();
  }
  flushing=false; showSend();
  if(sent)fetchStats();
  pushProgress();
}
function login(){
  const el=document.getElementById('lcode'), code=(el?el.value:'').replace(/\D/g,'');
  const say=m=>{L.idMsg=m;const s=document.getElementById('idstat');if(s)s.textContent=m;};
  if(!/^\d{4,8}$/.test(code)){say(T('id_bad'));return;}
  say('…');
  api({action:'whoami',code}).then(r=>{
    if(r&&r.ok){switchUser({code,name:r.name,branch:r.branch,level:r.level||''});LS.stats=null;L.needId=false;L.idMsg='';saveLearn();renderLearn();flushOutbox();}
    else say(T('id_unknown'));
  },()=>say(T('id_offline')));
}
if(LS.live&&LS.live.id&&LS.live.t0)liveSend(LS.live,true); else if(LS.live){LS.live=null;saveLearn();}
window.addEventListener('online',flushOutbox);
flushOutbox(); pushProgress();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){flushOutbox();pushProgress();}});
document.getElementById('learnroot').addEventListener('click',e=>{
  const b=e.target.closest('[data-l]'); if(!b)return;
  const a=b.dataset.l;
  if(a==='cards')startCards();
  else if(a==='mat')learnGo('materials');
  else if(a==='matcat')learnGo('matdeck',{msrc:b.dataset.v});
  else if(a==='lcat')learnGo('lessons',{lcat:b.dataset.v});
  else if(a==='lesson')learnGo('lesson',{lid:b.dataset.v});
  else if(a==='lnext')learnReplace('lesson',{lid:b.dataset.v});
  else if(a==='lread'){LS.read[L.lid]=bakuDay();touchProgress();markToday('study');renderLearn();}
  else if(a==='lcheck')startLessonCheck();
  else if(a==='lcheck2'){L.lid=b.dataset.v;startLessonCheck();}
  else if(a==='plan')planGo(b.dataset.v);
  else if(a==='ltest')startLessonTest();
  else if(a==='mcat'){L.mcat=b.dataset.v;renderLearn();}
  else if(a==='mkind'){L.mkind=b.dataset.v;renderLearn();}
  else if(a==='mvcat'){L.mvcat=b.dataset.v;renderLearn();}
  else if(a==='cardsquiz'){const sc=L.fc&&L.fc.src==='p'?'preps':L.fc&&L.fc.src==='v'?'vitrina':'drinks';startPractice(buildQuiz(cardItems(L.fc?L.fc.src:'d'),sc),T(sc==='preps'?'nav_preps':sc==='vitrina'?'nav_vitrina':'nav_drinks'));}
  else if(a==='quiz')startQuiz();
  else if(a==='flip')flipCard();
  else if(a==='know'||a==='again')rateCard(a==='know');
  else if(a==='ans')answer(+b.dataset.i);
  else if(a==='pick')pickOpt(+b.dataset.i);
  else if(a==='submit')submitComplex();
  else if(a==='next')nextQ();
  else if(a==='retry')startQuiz(L.qz.mistakes.map(m=>m.q),L.qz.practice||L.qz.kind==='daily');
  else if(a==='exit')learnBack();
  else if(a==='login')login();
  else if(a==='logout'){switchUser(null);L.idMsg='';renderLearn();}
  else if(a==='exam')startExam();
  else if(a==='board'){L.board=b.dataset.v;renderLearn();}
});
document.getElementById('learnroot').addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='lcode')login();else if(e.target.id==='qnum')submitComplex();});
document.getElementById('learnroot').addEventListener('input',e=>{
  if(e.target.id!=='qnum'||!L.qz)return;
  L.qz.numv=e.target.value; const b=document.getElementById('qsubmit'); if(b)b.disabled=!e.target.value.trim();
});

/* init */
renderSubbars();
renderDrinks(); renderPreps(); renderVit(); renderPromos(); renderFav(); updateAppBadge();
setInterval(()=>{tickPromos();renderSpot();},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tickPromos();renderSpot();}});
</script>
